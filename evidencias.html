<style>.resumen-ev{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.resumen-ev .v{font-size:var(--fs-hero);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}.resumen-ev .n{font-size:var(--fs-base);color:var(--muted);max-width:36ch;line-height:1.4}.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}.filtros button{font:inherit;font-size:var(--fs-base);font-weight:500;border:1px solid var(--line);background:#fff;border-radius:var(--r-l);padding:0 12px;min-height:36px;cursor:pointer;color:var(--ink)}.filtros button[aria-pressed=true]{background:var(--n-800);border-color:var(--n-800);color:#fff}.grupo-h{font-size:var(--fs-base);font-weight:600;margin:18px 0 6px;color:var(--ink)}.est{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:11px 13px;margin-bottom:8px}.est .cab{display:flex;gap:10px;align-items:flex-start}.est .num{font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:44px}.est .tx{flex:1;min-width:0;font-size:var(--fs-base);line-height:1.4}.est .pill{flex:0 0 auto;font-size:var(--fs-menor);font-weight:600;border-radius:var(--r-xs);padding:2px 8px;white-space:nowrap}.pill.ok{background:var(--verde-50);color:var(--verde-600)}.pill.parcial{background:var(--ambar-100);color:var(--ambar-700)}.pill.falta{background:var(--rojo-50);color:var(--rojo-800)}.pill.manual,.pill.reservado{background:var(--bg);color:var(--n-600)}.est ul{margin:6px 0 0 54px;padding:0 0 0 16px;font-size:var(--fs-base);color:#334;line-height:1.45}.est .que{margin:6px 0 0 54px;font-size:var(--fs-base);color:var(--muted);line-height:1.4}.est .que a{color:var(--azul-600);font-weight:600;text-decoration:none;margin-left:6px;white-space:nowrap}@media (max-width:520px){.est .que,.est ul{margin-left:0}}</style>

<script>OfflineBanner.init(),OutboxBadge.init(),"undefined"!=typeof Outbox&&Outbox.flush(),"undefined"!=typeof UpdateManager&&UpdateManager.init();const $=UI.$,TIPOS="empresa,documento,comite,reunion,plananual,trabajador,induccion,politica,auditoria,rendicion,legal,reporte,proveedor,contratista,cambio,perfil,sve,cargo,examen,inspeccion,residuo,aspecto,mes,peligro,revmatriz,sustancia,medicion,programa,equipo,eppcargo,entrega,emergencia,simulacro,revision,accion",ETIQUETA={ok:"Al día",parcial:"Incompleto",falta:"Falta",manual:"Revisar a mano",reservado:"Solo SST"};let lista=[],plantilla="",grupo=60,filtro="todos",perfil=null;const esSst=()=>!Sesion.modo()||!Sesion.yo()||-1!==["admin","sst"].indexOf(Sesion.rol());async function cargar(){if(UI.avisoServidor($("avisoSrv")))return void($("contenido").innerHTML="");const a=await SGSST.listar(TIPOS);if(UI.avisoCopia($("avisoCopia"),a),a.sinSesion)return void($("contenido").innerHTML="");const e=a.rows.find(a=>"EMPRESA-PERFIL"===a.id);perfil=e&&await SGSST.doc("EMPRESA-PERFIL")||UI.perfilInstalacion()||{},grupo=Number(perfil.grupo0312)||60,plantilla=60===grupo?"RES0312":"RES0312_"+grupo,lista=await EVIDENCIAS.evaluar(PLANTILLAS_AUDITORIA[plantilla].items,{rows:a.rows,perfil,hoy:UI.hoy(),esSst:esSst(),docDe:a=>SGSST.doc(a)}),pintar()}function pintar(){const a=EVIDENCIAS.resumen(lista),e=$("contenido"),t=lista.filter(a=>"todos"===filtro||a.e===filtro||"manual"===filtro&&"reservado"===a.e);let i="";e.innerHTML=(perfil.trabajadores?"":'<div class="aviso amar">Sin perfil de la empresa: se revisan los 60 estándares. Defínelo (trabajadores y clase de riesgo) en el Tablero de la gerencia.</div>')+'<div class="card"><div class="resumen-ev"><div class="v">'+String(a.pct).replace(".",",")+'%</div><div class="n">de los '+a.total+' estándares que le aplican, ponderado por su valor, con evidencia al día en el portal. No es la calificación oficial: es la guía para la autoevaluación.</div></div><p class="ayuda u-mt8">Le aplican '+esc(UI.textoGrupo(grupo))+'.</p><div class="filtros" role="group" aria-label="Filtrar">'+[["todos","Todos ("+a.total+")"],["falta","Falta ("+a.falta+")"],["parcial","Incompletos ("+a.parcial+")"],["ok","Al día ("+a.ok+")"],["manual","A mano ("+(a.manual+a.reservado)+")"]].map(([a,e])=>'<button type="button" data-f="'+a+'" aria-pressed="'+(filtro===a)+'">'+e+"</button>").join("")+'</div><button type="button" class="btn ghost" id="btnPdf">🖨️ Índice de evidencias (PDF)</button><button type="button" class="btn amber" id="btnAuto">Llevar a una autoevaluación</button><p class="ayuda">«Llevar a una autoevaluación» abre una autoevaluación nueva con la evidencia de cada estándar ya escrita y marcados como «cumple» los que están al día. Quien audita revisa y confirma cada uno.</p></div>'+(t.length?t.map(a=>{const e=a.ciclo+" · "+a.grupo,t=e!==i?'<h2 class="grupo-h">'+esc(e)+"</h2>":"";return i=e,t+'<div class="est"><div class="cab"><span class="num">'+esc(a.id)+'</span><span class="tx">'+esc(a.texto)+'</span><span class="pill '+a.e+'">'+ETIQUETA[a.e]+"</span></div>"+(a.ev.length?"<ul>"+a.ev.map(a=>"<li>"+esc(a)+"</li>").join("")+"</ul>":"")+("ok"!==a.e&&(a.que||a.href)?'<div class="que">'+esc("reservado"===a.e?"Datos de salud: lo revisan Administrador o SST.":a.que)+(a.href?'<a href="'+esc(a.href)+'">Abrir</a>':"")+"</div>":a.href?'<div class="que"><a href="'+esc(a.href)+'" style="margin-left:0;">Ver la evidencia</a></div>':"")+"</div>"}).join(""):'<div class="empty">Nada en este filtro.</div>'),e.querySelectorAll("[data-f]").forEach(a=>a.addEventListener("click",()=>{filtro=a.dataset.f,pintar()})),$("btnPdf").addEventListener("click",pdf),$("btnAuto").addEventListener("click",llevar)}function pdf(){const a=EVIDENCIAS.resumen(lista);UI.imprimir([UI.cabecera("SG-EVIDENCIAS","ÍNDICE DE EVIDENCIAS DEL SG-SST POR ESTÁNDAR",UI.textoGrupo(grupo)+" · corte "+UI.corta(UI.hoy()))+UI.seccion("RESUMEN",UI.tablaDatos([["Con evidencia al día",a.ok+" de "+a.total+" ("+String(a.pct).replace(".",",")+" % ponderado)"],["Incompletos",String(a.parcial)],["Sin evidencia",String(a.falta)],["Para revisar a mano",String(a.manual+a.reservado)]]))+UI.seccion("ESTÁNDARES Y EVIDENCIAS",'<table><tr><td class="l" style="width:7%;">Estándar</td><td class="l" style="width:30%;">Requisito</td><td class="l">Evidencia en el portal</td><td class="l" style="width:14%;">Dónde</td><td class="l" style="width:10%;">Estado</td></tr>'+lista.map(a=>"<tr><td>"+esc(a.id)+"</td><td>"+esc(a.texto)+"</td><td>"+(a.ev.length?a.ev.map(esc).join("<br>"):esc("ok"===a.e?"":a.que))+"</td><td>"+esc(a.href?a.href.replace(/\.html.*$/,""):"—")+"</td><td>"+ETIQUETA[a.e]+"</td></tr>").join("")+"</table>")+'<p style="font-size:8pt;">«Dónde» es el módulo del portal con el registro y sus soportes. Este índice no reemplaza la autoevaluación ni la calificación oficial de la Res. 0312 de 2019.</p>'],!0)}function llevar(){const a={plantilla,en:(new Date).toISOString(),items:{}};lista.forEach(e=>{a.items[e.id]={r:"ok"===e.e?"C":"",evid:e.ev.join("; ")}});try{sessionStorage.setItem("ssta-autoeval-sugerida",JSON.stringify(a))}catch(a){return void UI.toast("No se pudo preparar en este equipo.","mal")}location.href="auditorias.html?sugerida=1"}window.addEventListener("outbox-enviado",()=>cargar()),cargar();</script>
