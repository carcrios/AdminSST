<script>OfflineBanner.init(),"undefined"!=typeof UpdateManager&&UpdateManager.init(),function(){const e=EMPRESA,a="undefined"!=typeof MultiEmpresa&&MultiEmpresa.activo&&MultiEmpresa.proveedor||null,o=e.privacidad||{},s=esc(e.nombre||"La empresa")+(e.nit?" (NIT "+esc(e.nit)+")":""),i=o.correo?'<a href="mailto:'+esc(o.correo)+'">'+esc(o.correo)+"</a>":"el área de Seguridad y Salud en el Trabajo de la empresa",r=a&&a.nombre&&a.nombre!==e.nombre?esc(a.nombre)+(a.nit?" (NIT "+esc(a.nit)+")":""):"";document.getElementById("aviso").innerHTML='<div class="quien"><b>Responsable del tratamiento:</b> '+s+".<br><b>Consultas y reclamos:</b> "+i+"."+(r?"<br><b>Encargado del tratamiento:</b> "+r+", que presta la plataforma del portal por cuenta de la empresa.":"")+"</div><h2>Qué datos se tratan</h2><ul><li>Identificación y contacto: nombre, cédula, cargo, área, empresa y firma.</li><li>Registros de seguridad y salud en el trabajo: permisos, ATS, inspecciones, preoperacionales, reportes de actos, condiciones, incidentes y accidentes, inducciones, asistencia y entregas de EPP.</li><li><b>Datos sensibles</b> (solo los registra el área SST): conceptos médicos de aptitud y restricciones, exámenes, ausentismo y vigilancia de la salud. Nunca el diagnóstico.</li><li>Fotografías que tú adjuntes como evidencia.</li></ul><h2>Para qué</h2><p>Para cumplir las obligaciones del Sistema de Gestión de la Seguridad y Salud en el Trabajo (Decreto 1072 de 2015 y Resolución 0312 de 2019): controlar los trabajos de alto riesgo, reportar e investigar eventos, verificar que el personal esté habilitado, hacer seguimiento a la salud en el trabajo, conservar los registros que exige la ley y rendir cuentas a las autoridades y a la ARL.</p><h2>Tus derechos</h2><ul><li>Conocer, actualizar y rectificar tus datos.</li><li>Pedir prueba de la autorización que diste.</li><li>Saber qué uso se les ha dado.</li><li>Presentar quejas ante la Superintendencia de Industria y Comercio.</li><li>Revocar la autorización o pedir que se supriman cuando no haya un deber legal o contractual de conservarlos (hay registros de SST que se conservan 20 años: Decreto 1072 de 2015, art. 2.2.4.6.13).</li><li>Acceder gratis a tus datos.</li></ul><p>Responder las preguntas sobre datos sensibles es <b>voluntario</b>: no estás obligado a darlos (Ley 1581, art. 6), salvo lo que la ley laboral exige para tu seguridad.</p><h2>Dónde quedan</h2><p>En las hojas de cálculo de la cuenta de Google de la empresa (servicios en la nube de Google), no en este celular salvo lo que espera señal para enviarse. Solo los ven las personas con usuario y rol autorizado.</p><h2>Política de tratamiento</h2><p>"+(o.politica?'Consulta la política completa de la empresa en <a href="'+esc(o.politica)+'" target="_blank" rel="noopener">este enlace</a>.':"Pide la política de tratamiento de datos de la empresa a "+i+".")+'</p><p>Mira también las <a href="terminos.html">condiciones de uso</a>.</p><p class="ayuda">Al usar el portal y en la inducción se pide tu autorización. Este aviso se puede actualizar; la versión vigente es la de esta página.</p>'}();</script>
