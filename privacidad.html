<script>OfflineBanner.init(),"undefined"!=typeof UpdateManager&&UpdateManager.init(),function(){const e=EMPRESA,a="undefined"!=typeof MultiEmpresa&&MultiEmpresa.activo&&MultiEmpresa.proveedor||null,o=e.privacidad||{},s=esc(e.nombre||"La empresa")+(e.nit?" (NIT "+esc(e.nit)+")":""),r=o.correo?'<a href="mailto:'+esc(o.correo)+'">'+esc(o.correo)+"</a>":"el área de Seguridad y Salud en el Trabajo de la empresa",i=a&&a.nombre&&a.nombre!==e.nombre?esc(a.nombre)+(a.nit?" (NIT "+esc(a.nit)+")":""):"";document.getElementById("aviso").innerHTML='<div class="quien"><b>Responsable del tratamiento:</b> '+s+".<br><b>Consultas y reclamos:</b> "+r+".<br><b>Encargado del tratamiento:</b> "+(i||"quien presta y mantiene la plataforma del portal (asesor o proveedor contratado por la empresa)")+", que trata los datos solo por cuenta e instrucciones de la empresa, con contrato de transmisión.</div><h2>Qué datos se tratan</h2><ul><li>Identificación y contacto: nombre, cédula, cargo, área, empresa y firma.</li><li>Registros de seguridad y salud en el trabajo: permisos, ATS, inspecciones, preoperacionales, reportes de actos, condiciones, incidentes y accidentes, inducciones, asistencia y entregas de EPP.</li><li><b>Datos sensibles</b> (solo los registra y los ve el área SST): conceptos médicos de aptitud y restricciones, exámenes, ausentismo, vigilancia de la salud y condiciones de salud que tú declares. Nunca el diagnóstico.</li><li><b>Datos para emergencias</b>: tipo de sangre (RH), EPS, ARL y un contacto de emergencia. Los ven SST, administración y supervisores, solo para atender una emergencia médica.</li><li><b>Firma</b> manuscrita digital (dato biométrico). Con cada firma se guarda la hora, el tipo de celular o navegador y, <b>si lo permites</b> cuando el celular lo pregunta, la ubicación aproximada (GPS), para probar dónde y cuándo se firmó. Negar la ubicación no impide firmar.</li><li>Fotografías que se adjunten como evidencia (pueden mostrar personas o lesiones en un accidente).</li><li>Quejas al comité de convivencia (van cifradas: solo las lee el comité) y lo que se deje en el buzón.</li><li>Datos de contratistas, proveedores y de quien responda encuestas.</li></ul><h2>Para qué</h2><p>Para cumplir las obligaciones del Sistema de Gestión de la Seguridad y Salud en el Trabajo (Decreto 1072 de 2015 y Resolución 0312 de 2019): controlar los trabajos de alto riesgo, reportar e investigar eventos, verificar que el personal esté habilitado, hacer seguimiento a la salud en el trabajo, conservar los registros que exige la ley y rendir cuentas a las autoridades y a la ARL.</p><h2>Tus derechos</h2><ul><li>Conocer, actualizar y rectificar tus datos.</li><li>Pedir prueba de la autorización que diste.</li><li>Saber qué uso se les ha dado.</li><li>Presentar quejas ante la Superintendencia de Industria y Comercio.</li><li>Revocar la autorización o pedir que se supriman cuando no haya un deber legal o contractual de conservarlos (hay registros de SST que se conservan 20 años: Decreto 1072 de 2015, art. 2.2.4.6.13).</li><li>Acceder gratis a tus datos.</li></ul><p>Responder las preguntas sobre datos sensibles es <b>voluntario</b>: no estás obligado a darlos (Ley 1581, art. 6), salvo lo que la ley laboral exige para tu seguridad.</p><h2>Dónde quedan</h2><p>En las hojas de cálculo de la cuenta de Google de la empresa (Google LLC). Los servidores de Google pueden estar <b>fuera de Colombia</b> (por ejemplo en Estados Unidos): es una <b>transmisión internacional</b> a un encargado que presta el servicio de nube, con las garantías de seguridad de Google y del contrato de la empresa con su proveedor del portal. Solo los ven las personas con usuario y rol autorizado. Cada semana se envía una <b>copia de respaldo</b> a un correo designado por la empresa (o a su asesor, como encargado), para no perder la información.</p><p><b>En este celular</b> quedan, mientras tengas la sesión abierta, copias de las listas que consultas, los formularios que dejaste a medias (hasta 7 días) y lo que espera señal para enviarse. Al <b>cerrar sesión</b> se borra todo, menos lo que todavía no se ha enviado. En un celular compartido, cierra sesión al terminar.</p><h2>Cuánto tiempo</h2><p>Los registros del Sistema de Gestión se conservan 20 años (Decreto 1072 de 2015, art. 2.2.4.6.13). Lo demás, mientras dure la relación con la empresa y lo exija la ley.</p><h2>Política de tratamiento</h2><p>"+(o.politica?'Consulta la política completa de la empresa en <a href="'+esc(o.politica)+'" target="_blank" rel="noopener">este enlace</a>.':"Pide la política de tratamiento de datos de la empresa a "+r+".")+'</p><p>Mira también las <a href="terminos.html">condiciones de uso</a>.</p><p class="ayuda">Al usar el portal y en la inducción se pide tu autorización. Este aviso se puede actualizar; la versión vigente es la de esta página.</p>'}();</script>
