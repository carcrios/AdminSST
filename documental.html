<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Documental y legal · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.politica{white-space:pre-wrap;font-size:14px;line-height:1.55;background:#fffdf5;border:1px solid #f1e3b3;border-radius:10px;padding:14px;}
.crit{display:flex;align-items:center;gap:8px;border-bottom:1px dashed #e6eaee;padding:7px 0;font-size:13px;}
.crit > span{flex:1;min-width:0;}
.nov{border-bottom:1px dashed #e6eaee;padding:9px 0;}
.nov a{font-weight:600;color:#1f4d78;text-decoration:none;font-size:14px;line-height:1.35;}
.nov small{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
.nov-b{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.btn-mini.gris{background:#eef1f4;color:#4a5566;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Planear el SG-SST</div>
    <h1>Documental y legal</h1>
    <p>Política y objetivos · matriz legal · listado maestro · gestión del cambio · proveedores y contratistas</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="avisoCopia"></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">
    <button type="button" class="on" data-tab="politica">Política y objetivos</button>
    <button type="button" data-tab="legal">Matriz legal <span class="n" id="nLeg">0</span></button>
    <button type="button" data-tab="docs">Listado maestro <span class="n" id="nDoc">0</span></button>
    <button type="button" data-tab="cambios">Gestión del cambio <span class="n" id="nCam">0</span></button>
    <button type="button" data-tab="prov">Proveedores y contratistas <span class="n" id="nPrv">0</span></button>
  </div>
  <div id="panel"><div class="empty">Cargando…</div></div>
  <div class="version-portal">Portal SSTA · versión v128</div>
</div>
<div class="screen" id="scrPol"></div>
</div>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="iconos-emoji.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script src="registros.js"></script>
<script src="importar.js"></script>
<script src="normas-base.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
let rows = [], tab = 'politica';
/* v109: filtro de cada lista (lo dejan las cifras de arriba). */
const fDoc = { legal: '', docs: '', prov: '' };
window.filtrarKpi = (v)=> { fDoc[tab] = v || ''; pintar(); };
const chipsDoc = (panel, ops)=> { panel.querySelectorAll('.filtro-kpi [data-f]').forEach((b)=> b.addEventListener('click', ()=> window.filtrarKpi(b.dataset.f))); };
const legalPend = (x)=> x.resumen.vigente !== 'No' && x.resumen.cumple !== 'No aplica' && x.resumen.cumple !== 'Cumple';
const legalSinEv = (x)=> x.resumen.vigente !== 'No' && (!x.resumen.cumple || x.resumen.cumple === 'Sin evaluar');
const legalNo = (x)=> x.resumen.vigente !== 'No' && /^(No cumple|Cumple parcialmente)$/.test(x.resumen.cumple);
const docVenc = (x)=> x.resumen.estado === 'Vigente' && x.resumen.proximaRevision && x.resumen.proximaRevision < UI.hoy();
const prvVencido = (x)=> x.resumen.activo !== false && (!x.resumen.proximaEvaluacion || x.resumen.proximaEvaluacion < UI.hoy());
const de = (t)=> rows.filter((x)=> x.tipo === t);
function show(id){ document.querySelectorAll('.screen').forEach((s)=>s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); }
async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('panel').innerHTML = ''; return; }
  const r = await SGSST.listar('politica,legal,documento,cambio,proveedor');
  UI.avisoCopia($('avisoCopia'), r);
  rows = r.rows; pintar();
}
function vigentePol(){ return de('politica').sort((a, b)=> String(b.resumen.fechaFirma).localeCompare(String(a.resumen.fechaFirma)))[0]; }
function pintar(){
  const h = UI.hoy(), pol = vigentePol(), leg = de('legal').filter((x)=> x.resumen.vigente !== 'No');
  // Los «No aplica» no cuentan; el verde solo si TODO lo que aplica está evaluado y cumple.
  const aplica = leg.filter((x)=> x.resumen.cumple !== 'No aplica'), ev = aplica.filter((x)=> x.resumen.cumple && x.resumen.cumple !== 'Sin evaluar'), cumple = ev.filter((x)=> x.resumen.cumple === 'Cumple').length;
  const docsVenc = de('documento').filter((x)=> x.resumen.estado === 'Vigente' && x.resumen.proximaRevision && x.resumen.proximaRevision < h);
  const prv = de('proveedor').filter((x)=> x.resumen.activo !== false), prvVenc = prv.filter((x)=> !x.resumen.proximaEvaluacion || x.resumen.proximaEvaluacion < h);
  $('nLeg').textContent = leg.length; $('nDoc').textContent = de('documento').length; $('nCam').textContent = de('cambio').length; $('nPrv').textContent = prv.length;
  $('kpis').innerHTML = '<div class="kpi ' + (pol && (!pol.resumen.proximaRevision || pol.resumen.proximaRevision >= h) ? 'ok' : 'mal') + '" data-ir="tab:politica"><div class="v">' + (pol ? 'v' + esc(pol.resumen.versionDoc) : '—') + '</div><div class="n">política de SST</div>' + (pol ? '<div class="f">revisar ' + esc(UI.corta(pol.resumen.proximaRevision)) + '</div>' : '') + '</div>' +
    '<div class="kpi ' + (ev.length && cumple === ev.length && ev.length === aplica.length ? 'ok' : ev.length ? '' : 'mal') + '" data-ir="tab:legal|filtro:' + (leg.some(legalPend) ? 'pendientes' : '') + '"><div class="v">' + (ev.length ? Math.round(cumple * 100 / ev.length) + '%' : '—') + '</div><div class="n">cumplimiento legal</div><div class="f">' + ev.length + ' de ' + aplica.length + ' normas que aplican, evaluadas</div></div>' +
    '<div class="kpi ' + (docsVenc.length ? 'mal' : 'ok') + '" data-ir="tab:docs|filtro:' + (docsVenc.length ? 'vencidos' : '') + '"><div class="v">' + docsVenc.length + '</div><div class="n">documentos con revisión vencida</div></div>' +
    '<div class="kpi ' + (prvVenc.length ? 'mal' : 'ok') + '" data-ir="tab:prov|filtro:' + (prvVenc.length ? 'vencidos' : '') + '"><div class="v">' + (prv.length - prvVenc.length) + ' / ' + prv.length + '</div><div class="n">proveedores y contratistas evaluados al día</div></div>';
  ({ politica: pintarPolitica, legal: pintarLegal, docs: pintarDocs, cambios: pintarCambios, prov: pintarProv })[tab]($('panel'));
}
function item(x, titulo, sub, chip, clase){ return '<button type="button" class="item ' + (clase || '') + '" data-id="' + esc(x.id) + '"><div class="fila"><div><div class="t">' + titulo + '</div>' + (sub || []).filter(Boolean).map((s)=> '<div class="m">' + s + '</div>').join('') + (x.pendiente ? '<div class="m"><span class="pend">⏳ pendiente de enviar</span></div>' : '') + '</div>' + (chip ? '<span class="chip ' + (clase || '') + '">' + chip + '</span>' : '') + '</div></button>'; }
function simple(tipo, titulo, campos, d, extra){
  extra = extra || {};
  Registros.editar({ titulo: (d.nuevo ? 'Nuevo: ' : '') + titulo, campos, datos: d, alElegirPersona: extra.persona, despues: extra.despues ? extra.despues(d) : '', alAbrir: extra.alAbrir ? (el, pref)=> extra.alAbrir(el, d, pref) : null,
    borrar: d.nuevo ? null : async ()=> { const ok = await Registros.borrar(d.id, 'Borrado desde Documental'); if (ok) cargar(); return ok; },
    alGuardar: async (v)=> { if (extra.antes) { const e = await extra.antes(v, d); if (typeof e === 'string') return e; } const r = await Registros.guardar(tipo, d.id, v, d.nuevo ? 0 : d.version); if (typeof r === 'string') return r;
      if (extra.luego && !r.enCola) await extra.luego(v, d); cargar(); return true; } });
}
function abrir(panel, tipo, titulo, campos, extra){ panel.querySelectorAll('[data-id]').forEach((b)=> b.addEventListener('click', async ()=> { const d = await Registros.abrir(b.dataset.id); if (d) simple(tipo, titulo, campos, d, extra); })); }

/* ── Política y objetivos (Dec. 1072, arts. 2.2.4.6.5 a 2.2.4.6.7; estándares 2.1.1 y 2.2.1) ── */
const INDICADORES = ['Frecuencia de accidentalidad', 'Severidad de accidentalidad', 'Ausentismo por causa médica', 'Cumplimiento del plan anual de trabajo', 'Cobertura de capacitación', 'Cierre de acciones a tiempo', 'Cumplimiento de inspecciones', 'Cumplimiento legal', 'Calificación de estándares mínimos', 'Otro'];
function textoPolitica(){ const n = EMPRESA.nombre || 'La empresa';
  return n + ' se compromete con la seguridad y la salud de sus trabajadores, contratistas y visitantes en todas sus actividades y centros de trabajo.\n\n' +
    'Para lograrlo nos comprometemos a:\n• Identificar los peligros, evaluar y valorar los riesgos, y establecer los controles necesarios.\n• Proteger la seguridad y la salud de todos los trabajadores mediante la mejora continua del Sistema de Gestión de Seguridad y Salud en el Trabajo.\n' +
    '• Cumplir la normatividad nacional vigente en riesgos laborales y los demás requisitos que suscribamos.\n• Promover la participación de los trabajadores y del COPASST.\n• Asignar los recursos humanos, técnicos y financieros necesarios.\n\n' +
    'Esta política es conocida por todos los trabajadores, está disponible en los centros de trabajo, se comunicó al COPASST y se revisa como mínimo una vez al año.'; }
function pintarPolitica(panel){
  const pol = vigentePol(), otras = de('politica').filter((x)=> !pol || x.id !== pol.id);
  panel.innerHTML = (pol ? '<div class="card" id="cPol"><div class="status-msg">Cargando…</div></div>' : '<div class="empty">No hay política registrada.</div>') +
    '<button type="button" class="btn ' + (pol ? 'ghost' : 'amber') + '" id="nPol">' + (pol ? '📝 Nueva versión de la política' : '+ Registrar la política (con plantilla)') + '</button>' +
    (otras.length ? '<p class="ayuda" style="margin-top:12px;">Versiones anteriores: ' + otras.map((x)=> 'v' + esc(x.resumen.versionDoc) + ' (' + esc(UI.corta(x.resumen.fechaFirma)) + ')').join(', ') + '</p>' : '');
  $('nPol').addEventListener('click', async ()=> { const ant = pol ? await SGSST.doc(pol.id) : null;
    editarPolitica({ id: SGSST.nuevoId('POL'), nuevo: true, versionDoc: ant ? String((Number(ant.versionDoc) || 1) + 1) : '1', texto: ant ? ant.texto : textoPolitica(), objetivosLista: ant ? (ant.objetivosLista || []) : [
      { objetivo: 'Disminuir la accidentalidad', indicador: 'Frecuencia de accidentalidad', meta: 'Menor que el año anterior' }, { objetivo: 'Cumplir el plan anual de trabajo', indicador: 'Cumplimiento del plan anual de trabajo', meta: '≥ 90 %' },
      { objetivo: 'Cumplir los requisitos legales', indicador: 'Cumplimiento legal', meta: '100 %' }, { objetivo: 'Fortalecer las competencias en SST', indicador: 'Cobertura de capacitación', meta: '≥ 95 %' }],
      fechaFirma: UI.hoy(), proximaRevision: Festivos.sumarMeses(UI.hoy(), 12), firmante: ant ? ant.firmante : '', divulgacionesLista: [] }); });
  if (pol) SGSST.doc(pol.id).then((d)=> { if (!d || !$('cPol')) return;
    $('cPol').innerHTML = '<h2>Política de SST · versión ' + esc(d.versionDoc) + '</h2><div class="politica">' + esc(d.texto) + '</div>' +
      '<div class="dato" style="margin-top:10px;"><span>Firmada por</span><b>' + esc(d.firmante || '—') + ' · ' + esc(UI.corta(d.fechaFirma)) + '</b></div><div class="dato"><span>Comunicada al COPASST</span><b>' + esc(UI.corta(d.comunicadaCopasst) || '—') + '</b></div>' +
      '<div class="dato"><span>Próxima revisión</span><b>' + esc(UI.corta(d.proximaRevision)) + '</b></div>' +
      '<h3>Objetivos</h3><table class="tabla"><tr><th>Objetivo</th><th>Indicador</th><th>Meta</th></tr>' + (d.objetivosLista || []).map((o)=> '<tr><td>' + esc(o.objetivo) + '</td><td>' + esc(o.indicador) + '</td><td>' + esc(o.meta) + '</td></tr>').join('') + '</table>' +
      '<h3>Divulgación</h3>' + ((d.divulgacionesLista || []).map((v)=> '<div class="m" style="font-size:12.5px;margin-bottom:4px;">' + esc(UI.corta(v.fecha)) + ' · ' + esc(v.medio) + ' · ' + esc(v.personas || 0) + ' personas</div>').join('') || '<div class="m" style="font-size:12.5px;color:var(--muted);">Sin registros.</div>') +
      '<div class="fila-btn"><button type="button" class="btn ghost" id="divPol">+ Divulgación</button><button type="button" class="btn ghost" id="edPol">✏️ Corregir</button></div><button type="button" class="btn ghost" id="pdfPol">🖨️ Política y objetivos (PDF)</button>';
    $('edPol').addEventListener('click', ()=> editarPolitica(d));
    $('pdfPol').addEventListener('click', ()=> pdfPolitica(d));
    $('divPol').addEventListener('click', ()=> Registros.editar({ titulo: 'Divulgación de la política', campos: [{ k: 'fecha', l: 'Fecha', t: 'date', def: UI.hoy(), medio: true }, { k: 'personas', l: 'Personas', t: 'number', medio: true }, { k: 'medio', l: 'Medio', t: 'select', op: ['Charla', 'Inducción', 'Cartelera', 'Correo', 'Reunión', 'Otro'] }],
      alGuardar: async (v)=> { const r = await SGSST.enviar({ action: 'parche', tipo: 'politica', id: d.id, campos: { divulgaciones: (d.divulgacionesLista || []).length + 1 }, agregar: { divulgacionesLista: [Object.assign({ uid: SGSST.nuevoOpId() }, v)] } }); if (!r.ok) return r.error; cargar(); return true; } }));
  });
}
function editarPolitica(d){
  const s = $('scrPol');
  const C = [{ k: 'versionDoc', l: 'Versión', medio: true }, { k: 'fechaFirma', l: 'Fecha de firma', t: 'date', medio: true }, { k: 'firmante', l: 'Firma (representante legal)', t: 'persona', req: true }, { k: 'comunicadaCopasst', l: 'Comunicada al COPASST el', t: 'date', medio: true }, { k: 'proximaRevision', l: 'Próxima revisión', t: 'date', medio: true }];
  s.innerHTML = '<div class="hdr"><a class="back" href="#" data-volver>← Volver</a><div class="eyebrow">Política de SST</div><h1>Versión ' + esc(d.versionDoc) + '</h1><p>Dec. 1072, arts. 2.2.4.6.5 a 2.2.4.6.7</p></div>' +
    '<div class="card"><div class="field"><label>Texto de la política</label><textarea id="polTxt" style="min-height:280px;">' + esc(d.texto || '') + '</textarea><div class="ayuda">Debe ser específica de la empresa, incluir los compromisos de identificar peligros, proteger la seguridad y salud, cumplir la norma y mejorar continuamente; firmada, comunicada al COPASST, disponible y revisada cada año.</div></div>' +
    Registros.form(C, d, 'po_') + '<div class="field"><label>Firma</label>' + UI.padHTML('fPol') + '</div></div>' +
    '<div class="card"><h2>Objetivos</h2><div id="polObj"></div><button type="button" class="btn ghost" id="polObjAdd">+ Objetivo</button></div>' +
    '<button type="button" class="btn amber" id="polOk">Guardar</button><div class="status-msg" id="polMsg"></div>';
  Registros.activar(s); UI.activarPad('fPol', d.firma);
  d.objetivosLista = d.objetivosLista || [];
  const pintarO = ()=> { $('polObj').innerHTML = d.objetivosLista.map((o, i)=> '<div class="miembro" data-i="' + i + '"><div class="field"><label>Objetivo</label><input type="text" data-k="objetivo" value="' + esc(o.objetivo) + '"></div><div class="grid2"><div class="field"><label>Indicador</label><select data-k="indicador">' + INDICADORES.map((x)=> '<option' + (x === o.indicador ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Meta</label><input type="text" data-k="meta" value="' + esc(o.meta || '') + '"></div></div><button type="button" class="btn mini ghost" data-q="' + i + '">Quitar</button></div>').join(''); $('polObj').querySelectorAll('[data-q]').forEach((b)=> b.addEventListener('click', ()=> { leerO(); d.objetivosLista.splice(+b.dataset.q, 1); pintarO(); })); };
  const leerO = ()=> { d.objetivosLista = [...$('polObj').querySelectorAll('.miembro')].map((el)=> ({ objetivo: el.querySelector('[data-k="objetivo"]').value.trim(), indicador: el.querySelector('[data-k="indicador"]').value, meta: el.querySelector('[data-k="meta"]').value.trim() })).filter((o)=> o.objetivo); };
  pintarO();
  $('polObjAdd').addEventListener('click', ()=> { leerO(); d.objetivosLista.push({ objetivo: '', indicador: INDICADORES[0], meta: '' }); pintarO(); });
  $('polOk').addEventListener('click', async ()=> { leerO();
    const v = Object.assign({}, d, Registros.leer(C, s, 'po_'), { texto: $('polTxt').value.trim(), firma: UI.firma('fPol') || d.firma || '', estado: 'VIGENTE' });
    v.objetivos = v.objetivosLista.length; v.divulgaciones = (v.divulgacionesLista || []).length;
    if (!v.texto || !v.firmante) { $('polMsg').textContent = 'Faltan el texto o quién firma.'; return; }
    if (!v.objetivosLista.length) { $('polMsg').textContent = 'Agrega al menos un objetivo medible.'; return; }
    const r = await Registros.guardar('politica', d.id, v, d.nuevo ? 0 : d.version); if (typeof r === 'string') { $('polMsg').textContent = r; return; }
    UI.toast('✓ Política guardada.'); show('scrLista'); cargar(); });
  show('scrPol');
}
function pdfPolitica(d){
  UI.imprimir([UI.cabecera('SG-POLITICA', 'POLÍTICA DE SEGURIDAD Y SALUD EN EL TRABAJO', 'Versión ' + d.versionDoc + ' · ' + UI.corta(d.fechaFirma)) + UI.textoLargo(d.texto) +
    UI.seccion('OBJETIVOS DEL SG-SST', '<table><tr><th>Objetivo</th><th style="width:30%">Indicador</th><th style="width:20%">Meta</th></tr>' + (d.objetivosLista || []).map((o)=> '<tr><td>' + esc(o.objetivo) + '</td><td>' + esc(o.indicador) + '</td><td>' + esc(o.meta) + '</td></tr>').join('') + '</table>') +
    '<table style="margin-top:14px;"><tr><td style="height:70px;vertical-align:bottom;width:50%;">' + UI.firmaHoja(d.firma) + '<br><b>' + esc(d.firmante || '') + '</b><br>Representante legal</td><td style="vertical-align:bottom;">Comunicada al COPASST: ' + esc(UI.corta(d.comunicadaCopasst) || '—') + '<br>Próxima revisión: ' + esc(UI.corta(d.proximaRevision)) + '</td></tr></table>']);
}

/* ── Matriz legal (estándar 2.7.1) ── */
const C_LEG = [{ k: 'norma', l: 'Norma', req: true, ph: 'Ej: Resolución 4272 de 2021' }, { k: 'anio', l: 'Año', medio: true }, { k: 'emisor', l: 'Emisor', medio: true },
  { k: 'tema', l: 'Tema', medio: true }, { k: 'articulos', l: 'Artículos que aplican', medio: true }, { k: 'requisito', l: 'Requisito (qué exige)', t: 'textarea' },
  { k: 'evidencia', l: 'Evidencia de cumplimiento', t: 'textarea', ph: 'Ej: programa de alturas, certificados vigentes en Personal habilitado' },
  { k: 'cumple', l: 'Cumplimiento', t: 'select', op: ['Sin evaluar', 'Cumple', 'Cumple parcialmente', 'No cumple', 'No aplica'], medio: true }, { k: 'responsable', l: 'Responsable', t: 'persona', medio: true },
  { k: 'fechaRevision', l: 'Evaluada el', t: 'date', medio: true }, { k: 'proximaRevision', l: 'Próxima evaluación', t: 'date', medio: true }, { k: 'vigente', l: '¿Sigue vigente?', t: 'select', op: ['Sí', 'No'] }];
function pintarLegal(panel){
  const l = de('legal').sort((a, b)=> String(a.resumen.tema).localeCompare(String(b.resumen.tema)) || String(a.resumen.norma).localeCompare(String(b.resumen.norma)));
  const clase = (c)=> ({ 'Cumple': 'ok', 'No aplica': 'gris', 'Cumple parcialmente': 'pronto', 'No cumple': 'mal' }[c] || '');
  panel.innerHTML = '<div class="acciones-top"><button type="button" class="btn amber" id="nLegB">+ Norma</button><button type="button" class="btn ghost" id="novLeg">Novedades normativas</button><button type="button" class="btn ghost" id="xLeg">Cargar matriz legal desde Excel</button>' + (l.length ? '' : '<button type="button" class="btn ghost" id="baseLeg">Cargar normas base (' + NORMAS_BASE.length + ')</button>') + '<button type="button" class="btn ghost" id="pLeg">Matriz legal (PDF)</button></div>' +
    '<div id="novedades"></div>' +
    '<p class="ayuda">Normas de SST que aplican a la empresa, con su evaluación de cumplimiento. Se actualiza cuando sale una norma nueva y se evalúa por lo menos una vez al año. «Cargar normas base» trae una lista para empezar: revisa que apliquen y que sigan vigentes.</p>' +
    (l.length ? UI.chipsFiltro([['', 'Todas (' + l.length + ')'], ['pendientes', 'Pendientes (' + l.filter(legalPend).length + ')'], ['sinevaluar', 'Sin evaluar (' + l.filter(legalSinEv).length + ')'], ['nocumple', 'No cumple o parcial (' + l.filter(legalNo).length + ')']], fDoc.legal) : '') +
    '<input type="search" class="buscar" id="bLeg" placeholder="Buscar norma o tema"><div id="lLeg"></div>';
  chipsDoc(panel);
  const fL = { pendientes: legalPend, sinevaluar: legalSinEv, nocumple: legalNo }[fDoc.legal] || (()=> true);
  const lista = ()=> { const q = UI.norm($('bLeg').value).trim();
    $('lLeg').innerHTML = l.filter(fL).filter((x)=> !q || UI.norm(x.resumen.norma + ' ' + x.resumen.tema + ' ' + x.resumen.requisito).includes(q)).map((x)=> { const s = x.resumen;

    UI.seccion('3. IMPACTO EN EL SG-SST', UI.tablaDatos([['Actualizar la matriz de peligros', d.actualizarMatriz ? 'Sí' : 'No'], ['Capacitación o comunicación a los trabajadores', d.capacitacion ? 'Sí' : 'No'], ['Requisitos legales asociados', 'Revisar en la matriz legal'], ['Acciones en el plan de acción', String(d.acciones || lin.length)]])) +
    UI.seccion('4. MEDIDAS DE CONTROL ANTES DE IMPLEMENTAR', '<table><tr><td class="l a" style="width:6%;">N.º</td><td class="l">Medida</td><td class="l" style="width:22%;">Responsable</td><td class="l" style="width:14%;">Fecha</td></tr>' + (lin.length ? lin.map((t, i)=> '<tr><td class="a">' + (i + 1) + '</td><td>' + esc(t) + '</td><td></td><td></td></tr>').join('') : '<tr><td colspan="4">—</td></tr>') + '</table>') +
    UI.seccion('5. APROBACIÓN Y FIRMAS', '<table><tr><td style="height:60px;vertical-align:bottom;width:33%;"><div style="border-top:1px solid #000;padding-top:2px;"><b>' + esc(d.solicitante || '') + '</b><br>Solicita</div></td><td style="vertical-align:bottom;width:33%;"><div style="border-top:1px solid #000;padding-top:2px;"><b></b><br>Responsable del SG-SST</div></td><td style="vertical-align:bottom;"><div style="border-top:1px solid #000;padding-top:2px;"><b>' + esc(d.aprobo || '') + '</b><br>Aprueba</div></td></tr></table>') +
    '<p style="font-size:7.5px;">Decreto 1072 de 2015, art. 2.2.4.6.26: el empleador evalúa el impacto sobre la SST de los cambios internos y externos, y adopta las medidas de prevención y control antes de su implementación.</p>']);
}

/* ── Evaluación de proveedores y contratistas (estándares 2.9.1 y 2.10.1) ── */
const CRITERIOS = ['Personal afiliado a seguridad social (EPS, AFP, ARL) y pagos al día', 'SG-SST implementado (autoevaluación de estándares mínimos)', 'Matriz de peligros de la actividad contratada', 'Personal competente y certificado para tareas de alto riesgo',
  'Entrega, uso y reposición de EPP', 'ATS y permisos de trabajo', 'Reporte e investigación de incidentes y accidentes', 'Indicadores de accidentalidad del último año', 'Plan de emergencias y brigada', 'Exámenes médicos ocupacionales de su personal',
  'Fichas técnicas y hojas de seguridad (proveedores de bienes)', 'Especificaciones de SST en lo que compramos (equipos, herramientas, EPP certificados)'];
const C_PRV = [{ k: 'nombre', l: 'Razón social', req: true }, { k: 'nit', l: 'NIT', medio: true }, { k: 'tipoProveedor', l: 'Tipo', t: 'select', op: ['Contratista', 'Proveedor de servicios', 'Proveedor de bienes'], medio: true },
  { k: 'servicio', l: 'Qué nos suministra o hace', medio: true }, { k: 'contacto', l: 'Contacto', medio: true }, { k: 'calificacion0312', l: 'Su calificación de estándares mínimos (%)', t: 'number', medio: true },
  { k: 'fechaEvaluacion', l: 'Evaluado el', t: 'date', medio: true }, { k: 'evaluador', l: 'Evaluó', t: 'persona' }, { k: 'observaciones', l: 'Observaciones', t: 'textarea' }, { k: 'activo', l: 'Proveedor activo', t: 'check', def: true }];
function resultadoPrv(p){ return p >= 80 ? 'Aprobado' : p >= 60 ? 'Aprobado con plan de mejora' : 'No aprobado'; }
function pintarProv(panel){
  const h = UI.hoy(), l = de('proveedor').sort((a, b)=> String(a.resumen.nombre).localeCompare(String(b.resumen.nombre)));
  panel.innerHTML = '<div class="aviso"><b>Nuevo:</b> la evaluación completa de proveedores (matriz de requisitos por categoría, evaluación inicial, reevaluación, homologación y cronograma) está en <a href="proveedores.html">Proveedores y contratistas →</a>. Aquí se ven los mismos registros en forma resumida.</div><p class="ayuda">Se evalúan sus requisitos de SST antes de contratar y cada año. Criterio del portal: 80 % o más aprobado, 60–79 % aprobado con plan de mejora, menos de 60 % no aprobado (ajústalo a tu procedimiento).</p>' +
    (l.length ? UI.chipsFiltro([['', 'Todos (' + l.length + ')'], ['vencidos', 'Evaluación vencida o sin evaluar (' + l.filter(prvVencido).length + ')']], fDoc.prov) : '') +
    (l.filter((x)=> fDoc.prov !== 'vencidos' || prvVencido(x)).length ? l.filter((x)=> fDoc.prov !== 'vencidos' || prvVencido(x)).map((x)=> { const s = x.resumen, c = s.activo === false ? 'gris' : s.resultado === 'Aprobado' ? UI.semaforo(s.proximaEvaluacion, 30) : s.resultado === 'No aprobado' ? 'mal' : 'pronto';
      return item(x, esc(s.nombre), [esc(s.tipoProveedor) + ' · ' + esc(s.servicio || ''), 'Puntaje ' + esc(s.puntaje === '' ? '—' : s.puntaje + ' %') + ' · reevaluar ' + esc(UI.corta(s.proximaEvaluacion))], esc(s.resultado || 'Sin evaluar'), c); }).join('') : '<div class="empty">' + (l.length ? 'Todos evaluados al día ✓' : 'Sin proveedores ni contratistas evaluados.') + '</div>') +
    '<button type="button" class="btn amber" id="nPrvB">+ Evaluar proveedor o contratista</button><button type="button" class="btn ghost" id="pPrv">🖨️ Proveedores y contratistas (PDF)</button>';
  const extra = {
    despues: (d)=> '<div class="field"><label>Criterios de SST</label>' + CRITERIOS.map((c, i)=> '<div class="crit"><span>' + esc(c) + '</span><div class="seg-btn" data-cr="' + i + '">' + ['Sí', 'No', 'N/A'].map((v)=> '<button type="button" data-v="' + v + '" class="' + (((d.criterios || {})[i]) === v ? 'on' : '') + '">' + v + '</button>').join('') + '</div></div>').join('') + '</div>',
    alAbrir: (el)=> el.querySelectorAll('.seg-btn[data-cr]').forEach((g)=> g.addEventListener('click', (e)=> { const b = e.target.closest('[data-v]'); if (b) g.querySelectorAll('button').forEach((x)=> x.classList.toggle('on', x === b)); })),
    antes: async (v, d)=> {
      v.criterios = {}; document.querySelectorAll('.modal .seg-btn[data-cr]').forEach((g)=> { const b = g.querySelector('button.on'); if (b) v.criterios[g.dataset.cr] = b.dataset.v; });
      const ap = Object.values(v.criterios).filter((x)=> x !== 'N/A'), si = ap.filter((x)=> x === 'Sí').length;
      if (Object.keys(v.criterios).length < CRITERIOS.length) return 'Responde todos los criterios (Sí, No o N/A).';
      v.puntaje = ap.length ? Math.round(si * 100 / ap.length) : 100; v.resultado = resultadoPrv(v.puntaje);
      v.proximaEvaluacion = Festivos.sumarMeses(v.fechaEvaluacion || UI.hoy(), 12);
      return true; },
    luego: (v, d)=> { if (v.resultado !== 'Aprobado' && confirm(v.resultado + ' (' + v.puntaje + ' %). ¿Crear una acción para el plan de mejora?')) UI.nuevaAccion({ origen: 'Evaluación de proveedores', origenRef: d.id, hallazgo: v.nombre + ': ' + v.resultado + ' (' + v.puntaje + ' %)' }); } };
  abrir(panel, 'proveedor', 'Proveedor o contratista', C_PRV, extra); chipsDoc(panel);
  $('nPrvB').addEventListener('click', ()=> simple('proveedor', 'Proveedor o contratista', C_PRV, { id: SGSST.nuevoId('PRV'), nuevo: true, fechaEvaluacion: h, activo: true, tipoProveedor: 'Contratista' }, extra));
  $('pPrv').addEventListener('click', ()=> UI.imprimir([UI.cabecera('SG-PROVEEDORES', 'EVALUACIÓN DE PROVEEDORES Y CONTRATISTAS EN SST', 'Corte ' + UI.corta(h)) + '<table><tr><th>Razón social</th><th>NIT</th><th>Tipo</th><th>Servicio</th><th>Calif. 0312</th><th>Puntaje</th><th>Resultado</th><th>Evaluado</th><th>Reevaluar</th></tr>' +
    l.map((x)=> { const s = x.resumen; return '<tr><td>' + esc(s.nombre) + '</td><td>' + esc(s.nit) + '</td><td>' + esc(s.tipoProveedor) + '</td><td>' + esc(s.servicio) + '</td><td class="a">' + esc(s.calificacion0312 === '' ? '' : s.calificacion0312 + ' %') + '</td><td class="a">' + esc(s.puntaje === '' ? '' : s.puntaje + ' %') + '</td><td>' + esc(s.resultado) + '</td><td>' + esc(UI.corta(s.fechaEvaluacion)) + '</td><td>' + esc(UI.corta(s.proximaEvaluacion)) + '</td></tr>'; }).join('') + '</table>'], true));
}

$('tabs').addEventListener('click', (e)=>{ const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
document.addEventListener('click', (e)=>{ const v = e.target.closest('[data-volver]'); if (v) { e.preventDefault(); show('scrLista'); pintar(); } });
window.addEventListener('outbox-enviado', ()=> cargar());
cargar();
</script>
