    <h1>Instalar paso a paso</h1>
    <p>Un paso a la vez. Marca cada uno cuando lo termines; esta página recuerda dónde ibas.</p>

    <div class="caminos">
      <button type="button" class="camino a" data-camino="a"><span class="ico">🛡️</span><span><b>A. Mi sitio — soy el administrador</b><span>Tu marca, tu servidor y tu consola. Se hace <u>una sola vez</u>, antes del primer cliente.</span><em>Una vez</em></span></button>

    </div>
    <p style="color:var(--suave);font-size:var(--fs-base);line-height:1.5;">¿No sabes cuál? Si todavía no tienes tu consola (<code>admin.html</code>) funcionando, empieza por la <b>A</b>.</p>
