<script>!async function(){const e=new URLSearchParams(location.search),i=e.get("c"),o=e.get("k"),r=document.getElementById("vf");if(!i||!o)return void(r.innerHTML='<div class="ic">⚠️</div><h2>Falta el código</h2><p>Escanea el QR del certificado.</p>');let a;try{a=await SGSST.consultar({action:"verificarCertificado",c:i,k:o})}catch(e){a={ok:!1,error:navigator.onLine?"El servidor no responde.":"Sin señal: inténtalo con internet."}}if(!a||!a.ok)return void(r.innerHTML='<div class="ic">⚠️</div><h2>No se pudo verificar</h2><p>'+esc(a&&a.error||"")+"</p>");if(!a.valido)return void(r.innerHTML='<div class="ic">❌</div><h2>Certificado NO válido</h2><p>'+esc(a.motivo||"")+"</p>");const d=(e,i)=>i?"<dt>"+esc(e)+"</dt><dd>"+esc(i)+"</dd>":"";r.innerHTML='<div class="ic">✅</div><h2>Certificado auténtico</h2><p>Emitido por <b>'+esc(a.empresa)+"</b></p><dl>"+d("Persona",a.persona)+d("Cédula",a.cedula)+d("Curso",a.curso)+d("Fecha",UI.corta(a.fecha))+d("Intensidad",a.horas?a.horas+" hora(s)":"")+d("Resultado",a.resultado)+d("Instructor(a)",a.instructor)+d("Vigente hasta",a.vence?UI.corta(a.vence):"")+d("Código",a.id)+"</dl>"}();</script>
