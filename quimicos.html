<style>
.pics{display:flex;flex-wrap:wrap;gap:2px 4px;margin:6px 0 2px;}
.pics svg{width:30px;height:30px;flex:none;}
.lugar{margin-bottom:14px;}
.lugar h3{font-size:15px;margin:0 0 4px;}
.lugar .meta{font-size:12px;color:var(--muted);line-height:1.4;}
.conds{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
.conds span{font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 9px;}
.conds .si{background:#dff3e6;color:#1d6b43;} .conds .no{background:#fbe0dc;color:#9b2c1f;}
.susl{display:flex;flex-direction:column;gap:2px;margin:6px 0;}
.susl button{display:flex;align-items:center;gap:6px;border:0;background:none;font:inherit;font-size:13px;text-align:left;padding:4px 0;min-height:40px;color:var(--ink);cursor:pointer;}
.susl button svg{width:22px;height:22px;flex:none;}
.par{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.35;}
.par.N{background:#fdecea;color:#7c2418;} .par.P{background:#fff6d9;color:#6b4d00;}
.par b{display:block;margin-bottom:2px;}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mx{border-collapse:collapse;font-size:11px;background:#fff;}
.mx th,.mx td{border:1px solid var(--line);padding:4px;text-align:center;min-width:30px;}
.mx th svg{width:26px;height:26px;display:block;margin:auto;}
.mx th.r{text-align:left;white-space:nowrap;font-weight:700;position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--line);}
.mx td.S{background:#dff3e6;color:#1d6b43;} .mx td.P{background:#fff6d9;color:#7a5800;} .mx td.N{background:#fbe0dc;color:#9b2c1f;font-weight:800;}
.req{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35;}
.req:last-child{border-bottom:0;}
.req .e{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;}
.req .e.ok{background:#dff3e6;color:#1d6b43;} .req .e.mal{background:#fbe0dc;color:#9b2c1f;}
.req small{display:block;color:var(--muted);margin-top:2px;}
.picsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;}
.picsel button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:4px 8px 4px 4px;font:inherit;font-size:12px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink);min-height:44px;}
.picsel button svg{width:34px;height:34px;flex:none;}
.picsel button.on{border-color:#d62718;background:#fff5f4;}
.nfpasel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.btn-mini{min-height:40px;margin:4px 6px 0 0;}
.acciones-top{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.acciones-top .btn{flex:1 1 150px;margin-top:0;}
.selq{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;}
.selq label{display:flex;gap:8px;align-items:center;min-height:42px;font-size:13px;border-bottom:1px solid #f0f2f4;}
.selq label:last-child{border-bottom:0;}
.selq input{width:20px;height:20px;flex:none;}
.falta{font-size:12.5px;line-height:1.4;padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;}
.falta div{flex:1;min-width:0;} .falta small{display:block;color:var(--mal);}
.vista{overflow:hidden;border:1px dashed var(--line);border-radius:10px;padding:6px;background:#f6f7f8;margin:8px 0;}
.vista .zoom{transform-origin:0 0;}
/* ── Etiqueta SGA (pantalla y hoja impresa) ── */
/* Carta con márgenes de 10 mm: quedan ~194 × 255 mm útiles. 2 grandes, 2 × 3 medianas o 3 × 5 pequeñas, centradas. */
.etqs{display:flex;flex-wrap:wrap;gap:2mm;align-content:flex-start;justify-content:center;}
.etq{box-sizing:border-box;border:.6mm solid #000;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;overflow:hidden;display:flex;flex-direction:column;padding:2.5mm;break-inside:avoid;page-break-inside:avoid;line-height:1.2;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
.etq.g{width:190mm;height:124mm;font-size:9.5pt;padding:4mm;}
.etq.m{width:94mm;height:82mm;font-size:6.4pt;}
.etq.p{width:62mm;height:48mm;font-size:5.1pt;padding:1.8mm;}
.etq .nom{font-weight:900;text-transform:uppercase;line-height:1.05;font-size:2.3em;overflow-wrap:anywhere;}
.etq.p .nom{font-size:1.9em;}
.etq .ids{font-size:.95em;margin-top:.6mm;}
.etq .fila{display:flex;align-items:center;gap:2mm;margin:1.2mm 0;}
.etq .picts{display:flex;flex-wrap:wrap;gap:.4mm;}
.etq.g .picts svg{width:24mm;height:24mm;} .etq.m .picts svg{width:13.5mm;height:13.5mm;} .etq.p .picts svg{width:9.5mm;height:9.5mm;}
.etq .pal{font-weight:900;text-transform:uppercase;font-size:2.4em;letter-spacing:.3px;}
.etq.p .pal{font-size:2em;}
.etq .cols{display:flex;gap:3mm;flex:1;min-height:0;}
.etq .cols > div{flex:1;min-width:0;}
.etq .bl{margin-top:.8mm;}
.etq .bl b{display:block;text-transform:uppercase;font-size:.9em;border-bottom:.2mm solid #000;margin-bottom:.4mm;}
.etq .bl p{margin:0 0 .3mm;}
.etq .pie{margin-top:auto;border-top:.3mm solid #000;padding-top:1mm;display:flex;gap:2mm;align-items:flex-end;}
.etq .pie > div:first-child{flex:1;min-width:0;}
.etq .nfpa svg{display:block;}
.etq.g .nfpa svg{width:24mm;height:24mm;} .etq.m .nfpa svg{width:14mm;height:14mm;} .etq.p .nfpa svg{width:10mm;height:10mm;}
.etq .tras{font-size:.95em;margin-top:.6mm;}
</style>

  H260: 'En contacto con el agua desprende gases inflamables que pueden inflamarse espontáneamente.', H261: 'En contacto con el agua desprende gases inflamables.', H270: 'Puede provocar o agravar un incendio; comburente.', H271: 'Puede provocar un incendio o una explosión; muy comburente.', H272: 'Puede agravar un incendio; comburente.',

/** Lista de frases {c: código, t: texto} desde lo escrito ("H225, H319" o una por línea con su texto). */
function frases(txt){
  return String(txt || '').split(/\s*[;\n]\s*|,\s*(?=[HPhp]\s?\d{3})/).map((t)=> t.trim()).filter(Boolean).map((t)=> {

  const m = UI.modal('<h3>Sustancias en «' + esc(L.resumen.nombre) + '»</h3><p class="ayuda">Marca las que se guardan aquí. Si una estaba en otro lugar, pasa a este.</p><div class="selq" id="aSel">' +
    u.map((x)=> { const y = lugarDe(x); return '<label><input type="checkbox" value="' + esc(x.id) + '"' + (y && y.id === idLugar ? ' checked' : '') + '> ' + esc(x.resumen.nombre) + (y && y.id !== idLugar ? ' <small style="color:var(--muted);">(en ' + esc(y.resumen.nombre) + ')</small>' : !y && x.resumen.ubicacion ? ' <small style="color:var(--muted);">(' + esc(x.resumen.ubicacion) + ')</small>' : '') + '</label>'; }).join('') +
    '</div><button type="button" class="btn amber" id="aOk">Guardar</button><button type="button" class="btn ghost" data-cerrar>Cancelar</button><div class="status-msg" id="aMsg"></div>', true);
  m.el.querySelector('#aOk').addEventListener('click', async ()=> {
    const marcadas = new Set([...m.el.querySelectorAll('#aSel input:checked')].map((i)=> i.value));
    const cambios = u.filter((x)=> { const y = lugarDe(x), aqui = !!(y && y.id === idLugar); return marcadas.has(x.id) !== aqui; });
    if (!cambios.length) { m.cerrar(); return; }
    m.el.querySelector('#aOk').disabled = true; m.el.querySelector('#aMsg').textContent = 'Guardando…';
    for (const x of cambios) { const campos = marcadas.has(x.id) ? { lugarId: idLugar, ubicacion: L.resumen.nombre } : { lugarId: '', ubicacion: '' };
      const r = await SGSST.enviar({ action: 'parche', tipo: 'sustancia', id: x.id, campos }, { resumen: Object.assign({}, x.resumen, campos) });
      if (!r.ok) { m.el.querySelector('#aMsg').textContent = 'No se guardó ' + x.resumen.nombre + ': ' + (r.error || ''); m.el.querySelector('#aOk').disabled = false; return; } }
    m.cerrar(); UI.toast('✓ ' + cambios.length + ' sustancia(s) actualizada(s).'); await cargar();
  });
}
function matrizLugar(L, pdf){
  const n = L.l, cel = (i, j)=> { if (i === j) return pdf ? '<td style="background:#ddd;"></td>' : '<td style="background:#eee;"></td>'; const v = compatPar(n[i], n[j]).v;
    return pdf ? '<td class="a" style="background:' + (v === 'N' ? '#f6d4cf' : v === 'P' ? '#fbecc0' : '#d5efdd') + ';">' + (v === 'S' ? 'Sí' : v === 'P' ? 'Prec.' : 'NO') + '</td>' : '<td class="' + v + '">' + (v === 'S' ? '✓' : v === 'P' ? '!' : '✗') + '</td>'; };

/* ── Res. 773 de 2021 ── */
function pintarGes(panel){
  const req = requisitos();
  panel.innerHTML = '<div class="acciones-top"><button type="button" class="btn amber" id="gEd">Capacitación, señalización y emergencias</button></div>' +
    '<div class="fila-btn" style="margin-bottom:10px;"><button type="button" class="btn ghost" id="gPdf">Estado del programa (PDF)</button><a class="btn ghost" href="inspecciones.html">Inspección de almacenamiento</a></div>' +
    '<div class="card"><h2>Obligaciones del empleador</h2>' + req.map((r)=> '<div class="req"><span class="e ' + (r.ok ? 'ok' : 'mal') + '">' + (r.ok ? '✓' : '✗') + '</span><div><b>' + esc(r.t) + '</b> <small style="display:inline;">· ' + esc(r.a) + '</small><small>' + esc(r.d) + '</small>' +
      (r.btn === 'inv' ? '<button type="button" class="btn-mini" id="gInv" style="margin-top:6px;">Anotar: inventario revisado hoy</button>' : '') + '</div></div>').join('') +
    '<p class="ayuda" style="margin-top:8px;">Resumen de la Res. 773 de 2021 (SGA en los lugares de trabajo; el Decreto 1496 de 2018 adopta el SGA en Colombia). Verifica el texto vigente de la norma.</p></div>';
  $('gEd').addEventListener('click', editarGes);
  $('gPdf').addEventListener('click', pdfGestion);
  if ($('gInv')) $('gInv').addEventListener('click', async ()=> { await guardarGes({ inventarioRevisado: UI.hoy() }); UI.toast('✓ Revisión del inventario anotada.'); });
}
async function guardarGes(campos){
  const g = gestion(), r = await SGSST.enviar({ action: 'parche', tipo: 'gestquim', id: ID_GES, campos }, { resumen: Object.assign({}, g ? g.resumen : {}, campos) });
  if (!r.ok) { UI.toast('No se guardó: ' + (r.error || ''), 'mal'); return false; }
  await cargar(); return true;
}
async function editarGes(){
  const g = gestion(), d = g ? await Registros.abrir(ID_GES) : { id: ID_GES, nuevo: true };
  if (!d) return;
  Registros.editar({ titulo: 'Programa de riesgo químico', campos: C_GES, datos: d,
    alGuardar: async (v, el, pref)=> {
      const e = [];
      if (v.capacitados !== '' && !(Number(v.capacitados) >= 0)) e.push({ k: 'capacitados', m: 'personas capacitadas: número de 0 en adelante' });
      if (v.capacitacionSGA && v.capacitacionSGA > UI.hoy()) e.push({ k: 'capacitacionSGA', m: 'la última capacitación no puede ser futura' });
      const msg = marcar(el, pref, e); if (msg) return msg;
      if (v.capacitacionSGA && (!v.proximaCapacitacion || v.proximaCapacitacion <= v.capacitacionSGA)) v.proximaCapacitacion = Festivos.sumarMeses(v.capacitacionSGA, 12);
      const r = await Registros.guardar('gestquim', ID_GES, v, d.nuevo ? 0 : d.version); if (typeof r === 'string') return r; await cargar(); return true; } });
}
/* ── Acciones de lo que falta (una por problema; no repite las que siguen abiertas) ── */
async function accionesFaltantes(){
  const abiertas = de('accion').filter((a)=> a.estado !== 'CERRADA' && /^(SUS|QUIMICOS|LUQ)-/.test(a.resumen.origenRef || '')).map((a)=> a.resumen.origenRef + '|' + UI.norm(a.resumen.hallazgo).slice(0, 60));
  const ya = (ref, hall)=> abiertas.includes(ref + '|' + UI.norm(hall).slice(0, 60));
  const nuevas = [];
  enUso().forEach((x)=> problemas(x).forEach((p)=> { const hall = x.resumen.nombre + ': ' + p; if (!ya(x.id, hall)) nuevas.push({ origenRef: x.id, hallazgo: hall, accion: p.startsWith('Sin ficha') || p.startsWith('Ficha') ? 'Conseguir la ficha de datos de seguridad vigente y en español de ' + x.resumen.nombre + ' y adjuntarla' : p.startsWith('Etiqueta sin revisar') ? 'Revisar la etiqueta de ' + x.resumen.nombre + ' y anotar si cumple el SGA' : p.startsWith('Etiqueta') ? 'Etiquetar ' + x.resumen.nombre + ' conforme al SGA (generador de etiquetas del portal)' : p.startsWith('Envases') ? 'Rotular los envases secundarios de ' + x.resumen.nombre : /lugar/i.test(p) ? 'Asignar ' + x.resumen.nombre + ' a un lugar de almacenamiento registrado' : 'Registrar los pictogramas de ' + x.resumen.nombre + ' según su etiqueta', prioridad: prioritaria(x.resumen) ? 'Alta' : 'Media' }); }));
  lugares().forEach((L)=> { L.pares.filter((p)=> p.v === 'N').forEach((p)=> { const hall = 'Incompatibles juntos en ' + L.nombre + ': ' + p.a.resumen.nombre + ' + ' + p.b.resumen.nombre; if (!ya(p.a.id, hall)) nuevas.push({ origenRef: p.a.id, hallazgo: hall, accion: 'Separar ' + p.a.resumen.nombre + ' de ' + p.b.resumen.nombre + '. ' + p.motivos.join(' '), prioridad: 'Alta' }); });
    if (L.id && L.l.length) L.alertas.forEach((a)=> { const hall = L.nombre + ': ' + a; if (!ya(L.id, hall)) nuevas.push({ origenRef: L.id, hallazgo: hall, accion: 'Corregir en ' + L.nombre + ': ' + a.toLowerCase(), prioridad: 'Media' }); }); });
  requisitos().filter((r)=> !r.ok && r.a === 'Art. 21' && !/^Productos con etiqueta|^Inventario/.test(r.t)).forEach((r)=> { const hall = 'Res. 773 de 2021: ' + r.t; if (!ya(ID_GES, hall)) nuevas.push({ origenRef: ID_GES, hallazgo: hall + ' (' + r.d + ')', accion: 'Cumplir: ' + r.t.charAt(0).toLowerCase() + r.t.slice(1), prioridad: 'Media' }); });
  if (!nuevas.length) { UI.toast('No hay nada nuevo por crear: lo que falta ya tiene acción abierta o todo está al día.'); return; }
  if (!confirm('Se crean ' + nuevas.length + ' acción(es) en el plan de acción:\n\n· ' + nuevas.slice(0, 8).map((n)=> n.hallazgo).join('\n· ') + (nuevas.length > 8 ? '\n…' : ''))) return;
  const resp = prompt('Responsable:', ((gestion() || {}).resumen || {}).responsable || ''); if (!resp) return;
  const f = Festivos.sumarHabiles(UI.hoy(), 10); let n = 0;
  for (const a of nuevas) { const r = await UI.guardarAccion(Object.assign({ origen: 'Sustancias químicas', tipoAccion: 'Correctiva', responsable: resp, fechaCompromiso: a.prioridad === 'Alta' ? Festivos.sumarHabiles(UI.hoy(), 5) : f }, a)); if (r.ok) n++; else break; }
  UI.toast('✓ ' + n + ' acción(es) creada(s).'); cargar();
}
/* ── PDF ── */

  const l = de('sustancia').slice().sort((a, b)=> (a.resumen.estado === 'Fuera de uso') - (b.resumen.estado === 'Fuera de uso') || String(a.resumen.ubicacion).localeCompare(String(b.resumen.ubicacion)) || String(a.resumen.nombre).localeCompare(String(b.resumen.nombre)));

      return '<tr' + (s.estado === 'Fuera de uso' ? ' style="color:#888;"' : '') + '><td class="a">' + (i + 1) + '</td><td>' + esc(s.nombre) + (s.estado === 'Fuera de uso' ? '<br>(fuera de uso)' : '') + '</td><td>' + esc(s.fabricante || '') + '</td><td>' + esc([s.uso, s.area].filter(Boolean).join(' · ')) + '</td><td>' + esc(L ? L.resumen.nombre : s.ubicacion || '') + '</td><td>' + esc([s.estadoFisico, s.cantidad].filter(Boolean).join(' · ')) + '</td><td>' + esc([s.cas, s.onu ? 'ONU ' + s.onu : ''].filter(Boolean).join(' · ')) + '</td><td>' + esc(s.pictogramas || '—') + '</td><td>' + esc(s.palabra || '') + '</td><td>' + esc(s.frasesH || '') + '</td><td class="a">' + (prioritaria(s) ? 'SÍ' : '') + '</td><td' + (malF ? ' style="background:#f6d4cf;"' : '') + '>' + fds + '</td><td' + (s.etiquetaSGA && s.etiquetaSGA !== 'Conforme al SGA' ? ' style="background:#f6d4cf;"' : '') + '>' + esc(s.etiquetaSGA || '') + '</td><td>' + esc(s.epp || '') + '</td></tr>'; }).join('') + '</table>';
  UI.imprimir([UI.cabecera('SG-SUSTANCIAS', 'INVENTARIO DE SUSTANCIAS QUÍMICAS', 'Corte ' + UI.corta(h) + ' · ' + enUso().length + ' en uso · Res. 773 de 2021') + t], true);
}

  UI.imprimir([UI.cabecera('SG-LUGARES-QUIMICOS', 'LUGARES DE ALMACENAMIENTO DE SUSTANCIAS QUÍMICAS', 'Corte ' + UI.corta(UI.hoy()) + ' · ' + lg.length + ' lugar(es)') +

function pdfMatriz(){
