<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Gestión de la calidad · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.dofa{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.dofa div{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;min-height:70px;}
.dofa h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
.dofa ul{margin:0;padding-left:16px;}
.dofa .f{background:#e8f6ee;} .dofa .d{background:#fdecea;} .dofa .o{background:#e7f1fb;} .dofa .a{background:#fff6d9;}
.tabla-m{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:10px;}
.tabla-m th,.tabla-m td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;}
.tabla-m th{background:#f3f5f8;font-size:11.5px;color:var(--muted);}
.barras{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:6px;}
.barras span{flex:1;background:#7fb08f;border-radius:3px 3px 0 0;min-height:2px;} .barras span.mal{background:#d98c7f;}
.criterio{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--line);}
.criterio b{white-space:nowrap;}
.sub-t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.sub-t small{font-weight:600;text-transform:none;letter-spacing:0;}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:10px;}
/* Encuesta por enlace: editor de preguntas, enlace y QR */
.pe{border:1.5px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fcfbf8;}
.pe .pe-top{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.pe .pe-n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#eef1f4;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.pe .pe-top select{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font-size:14px;font-family:inherit;background:#fff;}
.pe .pe-x{flex:0 0 auto;width:44px;height:44px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-size:18px;color:var(--mal);cursor:pointer;}
.pe textarea{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit;line-height:1.35;resize:vertical;background:#fff;}
.pe label.check{font-size:13px;margin-top:4px;display:flex;gap:8px;align-items:center;min-height:36px;}
.pe label.check input{width:20px;height:20px;}
.qr-caja{text-align:center;margin:4px 0 8px;}
.qr-caja canvas{width:220px;max-width:70%;height:auto;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px;}
.enlace-txt{word-break:break-all;font-size:12.5px;background:#f7f9fa;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;user-select:all;-webkit-user-select:all;}
.resp-q{border-bottom:1px dashed #e6eaee;padding:8px 0;font-size:13.5px;}
.resp-q:last-child{border-bottom:0;}
.resp-q .v{font-weight:700;margin-top:3px;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">HSEQ · Calidad</div>
    <h1>Gestión de la calidad</h1>
    <p>ISO 9001: contexto, riesgos y oportunidades, objetivos, producto no conforme, PQRS y satisfacción del cliente</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="avisoCopia"></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">
    <button type="button" class="on" data-tab="contexto">Contexto</button>
    <button type="button" data-tab="riesgos">Riesgos y oportunidades <span class="n" id="nRie">0</span></button>
    <button type="button" data-tab="objetivos">Objetivos <span class="n" id="nObj">0</span></button>
    <button type="button" data-tab="pnc">No conforme <span class="n" id="nPnc">0</span></button>
    <button type="button" data-tab="pqrs">PQRS <span class="n" id="nPqr">0</span></button>
    <button type="button" data-tab="satisfaccion">Satisfacción <span class="n" id="nEnc">0</span></button>
  </div>
  <div id="panel"><div class="empty">Cargando…</div></div>
  <div class="version-portal">Portal SSTA · versión v124</div>
</div>
</div>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="iconos-emoji.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script src="registros.js"></script>
<script src="qr.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
const ID_CTX = 'CTX-CALIDAD';
const DIAS_PQRS = Number(((typeof EMPRESA !== 'undefined' && EMPRESA.calidad) || {}).diasPQRS) || 15;   // plazo interno de respuesta (días hábiles)
const ESCALA5 = [['5', '5 · Excelente'], ['4', '4 · Bueno'], ['3', '3 · Aceptable'], ['2', '2 · Malo'], ['1', '1 · Muy malo']];
const CRITERIOS = [['calidad', 'Calidad del producto o servicio'], ['oportunidad', 'Cumplimiento y oportunidad'], ['atencion', 'Atención y comunicación'], ['precio', 'Relación calidad / precio']];
/* Riesgos y oportunidades: probabilidad × impacto (1 a 5). Método de referencia: ajústalo a tu procedimiento. */
const nivelRO = (p, i)=> { const n = (Number(p) || 1) * (Number(i) || 1); return { n, t: n >= 15 ? 'Alto' : n >= 6 ? 'Medio' : 'Bajo' }; };
const C_RIE = [{ k: 'proceso', l: 'Proceso', req: true, medio: true }, { k: 'tipoRO', l: 'Tipo', t: 'select', op: ['Riesgo', 'Oportunidad'], medio: true },
  { k: 'descripcion', l: 'Descripción', req: true, ph: 'Ej: Retraso de un proveedor crítico de materia prima' }, { k: 'causa', l: 'Causa o fuente', ph: 'Ej: un solo proveedor calificado' },
  { k: 'probabilidad', l: 'Probabilidad (1 a 5)', t: 'select', op: ['1', '2', '3', '4', '5'], medio: true }, { k: 'impacto', l: 'Impacto (1 a 5)', t: 'select', op: ['1', '2', '3', '4', '5'], medio: true },
  { k: 'tratamiento', l: 'Acción para abordarlo', t: 'textarea' }, { k: 'responsable', l: 'Responsable', t: 'persona', medio: true }, { k: 'fechaCompromiso', l: 'Fecha', t: 'date', medio: true },
  { k: 'estado', l: 'Estado', t: 'select', op: ['ABIERTO', 'EN TRATAMIENTO', 'TRATADO'] }];
const C_OBJ = [{ k: 'objetivo', l: 'Objetivo de calidad', req: true, ph: 'Ej: Entregar a tiempo los pedidos' }, { k: 'indicador', l: 'Indicador', req: true, medio: true, ph: 'Ej: Entregas a tiempo' },
  { k: 'formula', l: 'Fórmula', medio: true, ph: 'Ej: entregas a tiempo / entregas totales × 100' }, { k: 'meta', l: 'Meta', t: 'number', req: true, medio: true }, { k: 'unidad', l: 'Unidad', medio: true, ph: '%' },
  { k: 'sentido', l: 'Se cumple si el valor es', t: 'select', op: [['mayor', 'mayor o igual a la meta'], ['menor', 'menor o igual a la meta']], medio: true }, { k: 'frecuencia', l: 'Frecuencia', t: 'select', op: ['Mensual', 'Trimestral', 'Semestral', 'Anual'], medio: true },
  { k: 'responsable', l: 'Responsable', t: 'persona' }, { k: 'estado', l: 'Estado', t: 'select', op: ['VIGENTE', 'INACTIVO'] }];
const C_PNC = [{ k: 'fecha', l: 'Fecha', t: 'date', req: true, medio: true }, { k: 'detectadoEn', l: 'Dónde se detectó', t: 'select', op: ['Recepción', 'Proceso', 'Inspección final', 'Entrega', 'Cliente'], medio: true },
  { k: 'producto', l: 'Producto o servicio', req: true, medio: true }, { k: 'cliente', l: 'Cliente (si aplica)', medio: true }, { k: 'descripcion', l: 'Qué no cumple', t: 'textarea', req: true },
  { k: 'cantidad', l: 'Cantidad afectada', medio: true }, { k: 'costo', l: 'Costo estimado ($)', t: 'number', medio: true },
  { k: 'tratamiento', l: 'Tratamiento', t: 'select', op: ['Corrección / reproceso', 'Reclasificación', 'Concesión del cliente', 'Rechazo / desecho', 'Devolución al proveedor', 'Reposición al cliente'], medio: true }, { k: 'responsable', l: 'Responsable', t: 'persona', medio: true },
  { k: 'requiereAC', l: '¿Requiere acción correctiva (análisis de causa)?', t: 'select', op: ['No', 'Sí'], medio: true }, { k: 'estado', l: 'Estado', t: 'select', op: ['ABIERTO', 'CERRADO'], medio: true }];
const C_PQR = [{ k: 'fecha', l: 'Fecha de recibo', t: 'date', req: true, medio: true }, { k: 'tipoPQRS', l: 'Tipo', t: 'select', op: ['Petición', 'Queja', 'Reclamo', 'Sugerencia', 'Felicitación'], medio: true },
  { k: 'cliente', l: 'Cliente o quien la presenta', req: true, medio: true }, { k: 'canal', l: 'Canal', t: 'select', op: ['Correo', 'Teléfono', 'WhatsApp', 'Presencial', 'Página web', 'Encuesta', 'Portal (Reportar un evento)'], medio: true },
  { k: 'presenta', l: 'Quién la presenta', t: 'select', vacio: true, op: ['Cliente', 'Trabajador', 'Contratista', 'Comunidad', 'Otro'], medio: true }, { k: 'contacto', l: 'Contacto para responder', medio: true, ph: 'Correo o teléfono' },
  { k: 'area', l: 'Área o proceso', medio: true },
  { k: 'descripcion', l: 'Qué dice el cliente', t: 'textarea', req: true }, { k: 'responsable', l: 'Responsable de responder', t: 'persona', medio: true }, { k: 'fechaLimite', l: 'Responder a más tardar', t: 'date', medio: true },
  { k: 'respuesta', l: 'Respuesta dada', t: 'textarea' }, { k: 'fechaRespuesta', l: 'Fecha de la respuesta', t: 'date', medio: true }, { k: 'procede', l: '¿Procede? (queja o reclamo justificado)', t: 'select', op: ['Por analizar', 'Sí', 'No'], medio: true },
  { k: 'estado', l: 'Estado', t: 'select', op: ['ABIERTA', 'RESPONDIDA', 'CERRADA'] }];
let rows = [], tab = 'contexto', ctxDoc = null;
const de = (t)=> rows.filter((x)=> x.tipo === t);
const hace12 = ()=> Festivos.sumarMeses(UI.hoy(), -12);
async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('panel').innerHTML = ''; return; }
  const r = await SGSST.listar('contextocal,riesgocal,objcal,pnc,pqrs,encuesta,encuestacli,encresp');
  UI.avisoCopia($('avisoCopia'), r);
  rows = r.rows;
  ctxDoc = de('contextocal').length ? await SGSST.doc(ID_CTX) : null;
  pintar();
}
/* ── Indicadores del módulo ── */
/* Las respuestas por enlace (encresp) traen los mismos campos que la encuesta registrada a mano:
   entran al mismo cálculo (no hay un segundo indicador). */
const respuestasSat = ()=> de('encuesta').concat(de('encresp'));
function satisfaccion(lista){
  const l = lista || respuestasSat().filter((x)=> String(x.resumen.fecha) >= hace12());
  if (!l.length) return null;
  const conProm = l.filter((x)=> Number(x.resumen.promedio) > 0);   // una encuesta solo con NPS no baja el promedio
  const prom = conProm.length ? conProm.reduce((a, x)=> a + Number(x.resumen.promedio), 0) / conProm.length : 0;
  const conNps = l.filter((x)=> x.resumen.nps !== '' && x.resumen.nps != null);
  const nps = conNps.length ? Math.round((conNps.filter((x)=> Number(x.resumen.nps) >= 9).length - conNps.filter((x)=> Number(x.resumen.nps) <= 6).length) * 100 / conNps.length) : null;
  const crit = {}; CRITERIOS.forEach(([k])=> { const v = l.map((x)=> Number(x.resumen[k])).filter((n)=> n > 0); crit[k] = v.length ? v.reduce((a, b)=> a + b, 0) / v.length : null; });
  return { n: l.length, pct: conProm.length ? Math.round(prom * 20) : null, nps, crit };
}
function pintar(){
  const h = UI.hoy(), pq = de('pqrs'), abiertas = pq.filter((x)=> x.estado === 'ABIERTA'), venc = abiertas.filter((x)=> x.resumen.fechaLimite && x.resumen.fechaLimite < h);
  const pncMes = de('pnc').filter((x)=> String(x.resumen.fecha).slice(0, 7) === h.slice(0, 7)).length, obj = de('objcal').filter((x)=> x.resumen.estado !== 'INACTIVO'), objOk = obj.filter((x)=> x.resumen.cumple === 'Sí').length;
  const altos = de('riesgocal').filter((x)=> x.resumen.nivel === 'Alto' && x.estado !== 'TRATADO').length, sat = satisfaccion();
  $('nRie').textContent = de('riesgocal').length; $('nObj').textContent = obj.length; $('nPnc').textContent = de('pnc').filter((x)=> x.estado !== 'CERRADO').length; $('nPqr').textContent = abiertas.length; $('nEnc').textContent = respuestasSat().length;
  $('kpis').innerHTML = '<div class="kpi ' + (sat && sat.pct != null ? (sat.pct >= 85 ? 'ok' : sat.pct >= 70 ? '' : 'mal') : '') + '" data-ir="tab:satisfaccion"><div class="v">' + (sat && sat.pct != null ? sat.pct + '%' : '—') + '</div><div class="n">satisfacción del cliente (12 meses)</div><div class="f">' + (sat ? sat.n + ' encuesta(s)' + (sat.nps != null ? ' · NPS ' + sat.nps : '') : 'sin encuestas') + '</div></div>' +
    '<div class="kpi ' + (venc.length ? 'mal' : abiertas.length ? 'pronto' : 'ok') + '" data-ir="tab:pqrs|filtro:' + (venc.length ? 'pqrsVencidas' : 'pqrsAbiertas') + '"><div class="v">' + abiertas.length + '</div><div class="n">PQRS abiertas</div><div class="f">' + venc.length + ' vencida(s) · plazo ' + DIAS_PQRS + ' días hábiles</div></div>' +
    '<div class="kpi ' + (pncMes ? 'pronto' : 'ok') + '" data-ir="tab:pnc"><div class="v">' + pncMes + '</div><div class="n">producto no conforme este mes</div></div>' +
    '<div class="kpi ' + (obj.length && objOk === obj.length ? 'ok' : obj.length ? '' : 'mal') + '" data-ir="tab:objetivos"><div class="v">' + objOk + ' / ' + obj.length + '</div><div class="n">objetivos de calidad cumplidos</div><div class="f">' + altos + ' riesgo(s) alto(s) sin tratar</div></div>';
  ({ contexto: pintarCtx, riesgos: pintarRie, objetivos: pintarObj, pnc: pintarPnc, pqrs: pintarPqr, satisfaccion: pintarSat })[tab]($('panel'));
}
function item(x, titulo, subs, chip, clase){ return '<button type="button" class="item ' + (clase || '') + '" data-id="' + esc(x.id) + '"><div class="fila"><div><div class="t">' + titulo + '</div>' + (subs || []).filter(Boolean).map((s)=> '<div class="m">' + s + '</div>').join('') + (x.pendiente ? '<div class="m"><span class="pend">⏳ pendiente de enviar</span></div>' : '') + '</div>' + (chip ? '<span class="chip ' + (clase || '') + '">' + chip + '</span>' : '') + '</div></button>'; }
async function accionDe(tipo, id, a){
  if (!confirm('¿Crear la acción en el plan de acción?')) return;
  const resp = prompt('Responsable:', a.responsable || ''); if (!resp) return;
  const r = await UI.guardarAccion(Object.assign({ origen: 'Calidad', origenRef: id, responsable: resp }, a));
  if (r.ok) await SGSST.enviar({ action: 'parche', tipo, id, campos: { accionId: r.id } });
}
function editar(tipo, titulo, campos, d, alistar, despues){
  Registros.editar({ titulo: (d.nuevo ? 'Nuevo: ' : '') + titulo, campos, datos: d,
    // v109: la PQRS que llega desde «Reportar un evento» trae fotos (se ven aquí, no se editan).
    antes: tipo === 'pqrs' && (d.fotos || []).length ? '<div class="fotos" style="margin-bottom:10px;">' + d.fotos.map(UI.src).filter(Boolean).map((f)=> '<div class="f"><img src="' + f + '" alt="Foto de la PQRS"></div>').join('') + '</div>' : '',
    borrar: d.nuevo ? null : async ()=> { const ok = await Registros.borrar(d.id, 'Borrado desde Calidad'); if (ok) cargar(); return ok; },
    alGuardar: async (v)=> { const e = alistar ? alistar(v, d) : null; if (typeof e === 'string') return e;
      const r = await Registros.guardar(tipo, d.id, v, d.nuevo ? 0 : d.version); if (typeof r === 'string') return r;
      if (despues && !r.enCola) await despues(v, d);
      cargar(); return true; } });
}
const abrirCon = (panel, tipo, titulo, campos, alistar, despues)=> panel.querySelectorAll('[data-id]').forEach((b)=> b.addEventListener('click', async ()=> { const d = await Registros.abrir(b.dataset.id); if (d) editar(tipo, titulo, campos, d, alistar, despues); }));

/* ── Contexto (4.1, 4.2, 4.3) ── */
const lineas = (t)=> String(t || '').split('\n').map((x)=> x.trim()).filter(Boolean);
function pintarCtx(panel){
  const c = ctxDoc || {}, lis = (l)=> (l || []).length ? '<ul>' + l.map((x)=> '<li>' + esc(x) + '</li>').join('') + '</ul>' : '<i style="color:var(--muted);">—</i>';
  panel.innerHTML = '<div class="acciones-top"><button type="button" class="btn amber" id="bCtx">' + (ctxDoc ? 'Actualizar el contexto' : 'Definir el contexto') + '</button><button type="button" class="btn ghost" id="pCtx">Contexto de la organización (PDF)</button></div>' +
    '<p class="ayuda">Cuestiones internas y externas (DOFA), partes interesadas y sus requisitos, y el alcance del sistema de gestión de la calidad (ISO 9001, 4.1 a 4.3). Se revisan por lo menos una vez al año.</p>' +
    (c.alcance ? '<div class="card"><h2>Alcance</h2><div class="texto-largo">' + esc(c.alcance) + '</div></div>' : '') +
    '<div class="dofa"><div class="f"><h4>Fortalezas</h4>' + lis(c.fortalezas) + '</div><div class="d"><h4>Debilidades</h4>' + lis(c.debilidades) + '</div><div class="o"><h4>Oportunidades</h4>' + lis(c.oportunidades) + '</div><div class="a"><h4>Amenazas</h4>' + lis(c.amenazas) + '</div></div>' +
    '<div class="card"><h2>Partes interesadas</h2>' + ((c.partes || []).length ? '<table class="tabla-m"><tr><th>Parte</th><th>Necesidades y expectativas</th><th>Seguimiento</th></tr>' + c.partes.map((p)=> '<tr><td>' + esc(p.parte) + '</td><td>' + esc(p.necesidades) + '</td><td>' + esc(p.seguimiento) + '</td></tr>').join('') + '</table>' : '<div class="empty">Sin partes interesadas.</div>') + '</div>' +
    (c.fechaRevision ? '<div class="m" style="font-size:12.5px;margin-bottom:8px;">Revisado el ' + esc(UI.corta(c.fechaRevision)) + (c.responsable ? ' por ' + esc(c.responsable) : '') + ' · próxima revisión ' + esc(UI.corta(c.proximaRevision)) + '</div>' : '');
  $('bCtx').addEventListener('click', editarCtx);
  $('pCtx').addEventListener('click', ()=> { if (!ctxDoc) { UI.toast('Primero define el contexto.'); return; } const t = (l)=> '<ul style="margin:2px 0;padding-left:14px;">' + (l || []).map((x)=> '<li>' + esc(x) + '</li>').join('') + '</ul>';
    UI.imprimir([UI.cabecera('SG-CONTEXTO', 'CONTEXTO DE LA ORGANIZACIÓN (ISO 9001, 4.1 A 4.3)', 'Revisado el ' + UI.corta(c.fechaRevision)) + UI.seccion('ALCANCE', '<table><tr><td>' + esc(c.alcance || '') + '</td></tr></table>') +
      UI.seccion('ANÁLISIS DOFA', '<table><tr><th>Fortalezas</th><th>Debilidades</th></tr><tr><td>' + t(c.fortalezas) + '</td><td>' + t(c.debilidades) + '</td></tr><tr><th>Oportunidades</th><th>Amenazas</th></tr><tr><td>' + t(c.oportunidades) + '</td><td>' + t(c.amenazas) + '</td></tr></table>') +
      UI.seccion('PARTES INTERESADAS', '<table><tr><th>Parte interesada</th><th>Necesidades y expectativas</th><th>Seguimiento</th></tr>' + (c.partes || []).map((p)=> '<tr><td>' + esc(p.parte) + '</td><td>' + esc(p.necesidades) + '</td><td>' + esc(p.seguimiento) + '</td></tr>').join('') + '</table>')]); });
}
async function editarCtx(){
  const d = ctxDoc ? await Registros.abrir(ID_CTX) : { id: ID_CTX, nuevo: true, fechaRevision: UI.hoy() };
  if (!d) return;
  const datos = Object.assign({}, d, { fortalezasT: (d.fortalezas || []).join('\n'), debilidadesT: (d.debilidades || []).join('\n'), oportunidadesT: (d.oportunidades || []).join('\n'), amenazasT: (d.amenazas || []).join('\n'),
    partesT: (d.partes || []).map((p)=> [p.parte, p.necesidades, p.seguimiento].join(' | ')).join('\n') });
  const campos = [{ k: 'alcance', l: 'Alcance del sistema de gestión de la calidad', t: 'textarea', ph: 'Productos o servicios, sedes y requisitos que no aplican (con su justificación)' },
    { k: 'fortalezasT', l: 'Fortalezas (una por línea)', t: 'textarea' }, { k: 'debilidadesT', l: 'Debilidades (una por línea)', t: 'textarea' },
    { k: 'oportunidadesT', l: 'Oportunidades (una por línea)', t: 'textarea' }, { k: 'amenazasT', l: 'Amenazas (una por línea)', t: 'textarea' },

      { el: el('#ecCor'), etiqueta: 'Correo', error: malCorreo ? 'no es un correo válido (' + malCorreo + ')' : '' },
      { el: el('#ecPer'), etiqueta: 'Periodo evaluado', error: Valida.texto(v.periodo, 3) },
      { el: el('#ecLim'), etiqueta: 'Responder a más tardar', error: Valida.fecha(v.fechaLimite) || (v.fechaLimite < h ? 'no puede ser antes de hoy' : '') }];
    const cajas = cont.querySelectorAll('.pe');
    preg.forEach((q, i)=> { reglas.push({ el: cajas[i].querySelector('textarea'), etiqueta: 'Pregunta ' + (i + 1), error: !q.texto ? 'escriba el texto' : q.texto.length < 5 ? 'es muy corta' : '' }); });
    const nNps = preg.filter((q)=> q.tipo === 'nps').length;
    if (nNps > 1) preg.forEach((q, i)=> { if (q.tipo === 'nps') reglas.push({ el: cajas[i].querySelector('select'), etiqueta: 'Pregunta ' + (i + 1), error: 'solo puede haber una pregunta de recomendación (0 a 10)' }); });
    if (!preg.some((q)=> q.obligatoria !== false)) reglas.push({ el: cajas[0].querySelector('input[type=checkbox]'), etiqueta: 'Preguntas', error: 'marque por lo menos una como obligatoria' });
    if (Valida.revisar(m.el, reglas, el('#ecMsg')).length) return;
    const id = SGSST.nuevoId('ENV'), clave = claveNueva();
    const doc = Object.assign(v, { fechaEnvio: h, preguntas: preg.map((q)=> ({ id: q.id, texto: q.texto, tipo: q.tipo, obligatoria: q.obligatoria !== false })), nPreguntas: preg.length,
      estado: 'ABIERTA', clave, enviadaPor: (typeof Sesion !== 'undefined' && Sesion.nombre && Sesion.nombre()) || '' });
    const b = el('#ecOk'); b.disabled = true; b.textContent = 'Creando el enlace…';
    const r = await SGSST.enviar({ action: 'guardar', tipo: 'encuestacli', id, doc, versionBase: 0 }, null, { sinCola: true });
    b.disabled = false; b.textContent = 'Crear el enlace';
    if (!r.ok) { el('#ecMsg').innerHTML = '<div class="v-resumen">No se creó la encuesta: ' + esc(r.error || 'intente de nuevo') + '</div>'; return; }
    m.cerrar(); await cargar();
    compartir(Object.assign({ id }, doc));
  });
}
/** Enlace, QR y botones para enviar (WhatsApp, correo, copiar, QR impreso). */
function compartir(d){
  const u = enlaceCliente(d.id, d.clave), emp = (EMPRESA.nombreCorto || EMPRESA.nombre || 'nuestra empresa');
  const texto = 'Hola' + (d.contacto ? ' ' + d.contacto : '') + '. En ' + emp + ' queremos saber cómo le fue con nuestro servicio' + (d.periodo ? ' (' + d.periodo + ')' : '') +
    '. La encuesta toma unos 2 minutos' + (d.fechaLimite ? ' y está abierta hasta el ' + UI.corta(d.fechaLimite) : '') + ': ' + u;
  const tel = waNum(d.telefono);
  const m = UI.modal('<h3>Enviar la encuesta a ' + esc(d.cliente) + '</h3><p class="ayuda">Este enlace es solo para ' + esc(d.contacto || d.cliente) + ' y sirve para UNA respuesta. Cuando responda, la encuesta queda «Respondida» y el resultado entra a la satisfacción del cliente.</p>' +
    '<div class="qr-caja"><canvas id="eqCv" aria-label="Código QR de la encuesta"></canvas></div><div class="enlace-txt" id="eqUrl">' + esc(u) + '</div>' +
    '<div class="acciones-top"><button type="button" class="btn amber" id="eqWa">WhatsApp' + (tel ? '' : ' (elegir chat)') + '</button><button type="button" class="btn ghost" id="eqMail">Correo' + (d.correo ? '' : ' (sin destinatario)') + '</button>' +
    '<button type="button" class="btn ghost" id="eqCopiar">Copiar el enlace</button><button type="button" class="btn ghost" id="eqPdf">QR para imprimir (PDF)</button></div>' +
    '<button type="button" class="btn ghost" data-cerrar>Listo</button>');
  try { QR.dibujar(m.el.querySelector('#eqCv'), u, { px: 440, margen: 2 }); } catch (e) { m.el.querySelector('.qr-caja').hidden = true; }
  m.el.querySelector('#eqWa').addEventListener('click', ()=> window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(texto), '_blank'));
  m.el.querySelector('#eqMail').addEventListener('click', ()=> { location.href = 'mailto:' + (d.correo ? encodeURIComponent(d.correo).replace(/%40/g, '@') : '') + '?subject=' + encodeURIComponent('Encuesta de satisfacción · ' + emp) + '&body=' + encodeURIComponent(texto); });
  m.el.querySelector('#eqCopiar').addEventListener('click', async ()=> UI.toast(await copiarTexto(u) ? '✓ Enlace copiado.' : 'Mantenga presionado el enlace para copiarlo.'));
  m.el.querySelector('#eqPdf').addEventListener('click', ()=> { let img = ''; try { img = QR.comoImagen(u, { px: 600, margen: 4 }); } catch (e) {}
    UI.imprimir([UI.cabecera('SG-SATISFACCION', 'ENCUESTA DE SATISFACCIÓN DEL CLIENTE', d.cliente + (d.periodo ? ' · ' + d.periodo : '')) +
      UI.seccion('ESCANEE EL CÓDIGO CON LA CÁMARA DEL CELULAR', '<table><tr><td style="text-align:center;padding:14px;">' + (img ? '<img src="' + img + '" alt="QR" style="width:62mm;height:62mm;">' : '') +
        '<div style="font-size:10px;word-break:break-all;margin-top:8px;">' + esc(u) + '</div></td></tr></table>') +
      UI.seccion('DATOS', UI.tablaDatos([['Cliente', d.cliente], ['Contacto', [d.contacto, d.cargo].filter(Boolean).join(' · ')], ['Periodo evaluado', d.periodo || ''], ['Responder a más tardar', UI.corta(d.fechaLimite)], ['Preguntas', String((d.preguntas || []).length)]]))]); });
}
/** Detalle de una encuesta enviada: estado, preguntas y lo que se puede hacer con ella. */
async function verEnvio(id){
  const d = await Registros.abrir(id); if (!d) return;
  const h = UI.hoy(), e = estadoEnv({ estado: d.estado, resumen: d }), p = pctDe(d);
  const puedeReabrir = e.t === 'Vencida' || e.t === 'Cerrada';
  const m = UI.modal('<h3>Encuesta · ' + esc(d.cliente) + '</h3>' +
    '<div class="dato"><span>Estado</span><b><span class="chip ' + e.c + '">' + e.t + '</span></b></div>' +
    dato('Contacto', [d.contacto, d.cargo].filter(Boolean).join(' · ')) + dato('Celular', d.telefono) + dato('Correo', d.correo) + dato('Periodo evaluado', d.periodo) +
    dato('Enviada', UI.corta(d.fechaEnvio) + (d.enviadaPor ? ' · ' + d.enviadaPor : '')) + dato('Responder a más tardar', UI.corta(d.fechaLimite)) +
    (e.t === 'Respondida' ? dato('Respondida', UI.corta(d.fechaRespuesta)) + dato('Satisfacción', p == null ? '—' : p + '%') + dato('NPS', npsTxt(d.nps)) : '') +
    '<div class="sub-t">Preguntas <small>' + (d.preguntas || []).length + '</small></div><ol style="margin:0 0 8px;padding-left:20px;font-size:13px;line-height:1.5;">' +
      (d.preguntas || []).map((q)=> '<li>' + esc(q.texto) + ' <span style="color:var(--muted);">(' + esc(((TIPOS_P.find((t)=> t[0] === q.tipo) || [])[1] || q.tipo).toLowerCase()) + (q.obligatoria === false ? ', opcional' : '') + ')</span></li>').join('') + '</ol>' +
    (puedeReabrir ? '<div class="field"><label>Nuevo plazo para responder *</label><input type="date" id="evPl" min="' + h + '" value="' + Festivos.sumarDias(h, 15) + '"></div>' : '') +
    '<div class="acciones-top">' +
      (e.t === 'Enviada' ? '<button type="button" class="btn amber" id="evComp">Enviar o compartir el enlace</button><button type="button" class="btn ghost" id="evCerrar">Cerrar la encuesta</button>' : '') +
      (puedeReabrir ? '<button type="button" class="btn amber" id="evReabrir">' + (e.t === 'Vencida' ? 'Ampliar el plazo' : 'Reabrir la encuesta') + '</button>' + (e.t === 'Vencida' ? '<button type="button" class="btn ghost" id="evCerrar">Cerrar la encuesta</button>' : '') : '') +
      (e.t === 'Respondida' ? '<button type="button" class="btn amber" id="evResp">Ver la respuesta</button>' : '<button type="button" class="btn ghost" id="evBorrar" style="color:var(--mal);">Borrar</button>') +
    '</div><button type="button" class="btn ghost" data-cerrar>Cerrar</button>');
  m.el.querySelector('[data-cerrar]').insertAdjacentElement('beforebegin', UI.botonHistorial(d.id, 'Encuesta a ' + d.cliente));
  const parche = async (campos, okTxt)=> { const r = await SGSST.enviar({ action: 'parche', tipo: 'encuestacli', id: d.id, campos }, null, { sinCola: true });
    if (!r.ok) { UI.toast('No se guardó: ' + (r.error || ''), 'mal'); return false; } UI.toast(okTxt); m.cerrar(); await cargar(); return true; };
  const on = (s, f)=> { const b = m.el.querySelector(s); if (b) b.addEventListener('click', f); };
  on('#evComp', ()=> { m.cerrar(); compartir(d); });
  on('#evCerrar', ()=> { if (confirm('¿Cerrar la encuesta? El cliente ya no podrá responder con ese enlace.')) parche({ estado: 'CERRADA' }, '✓ Encuesta cerrada.'); });
  on('#evReabrir', async ()=> { const f = m.el.querySelector('#evPl'), err = Valida.fecha(f.value) || (f.value < h ? 'no puede ser antes de hoy' : '');
    if (err) { Valida.revisar(m.el, [{ el: f, etiqueta: 'Nuevo plazo', error: err }], null); return; }
    if (await parche({ estado: 'ABIERTA', fechaLimite: f.value }, '✓ La encuesta recibe respuestas hasta el ' + UI.corta(f.value) + '.')) compartir(Object.assign({}, d, { fechaLimite: f.value })); });
  on('#evResp', ()=> { m.cerrar(); verRespuesta(d.respuestaId); });
  on('#evBorrar', async ()=> { if (!confirm('¿Borrar esta encuesta? El enlace deja de funcionar.')) return; if (await Registros.borrar(d.id, 'Encuesta sin responder borrada desde Calidad')) { m.cerrar(); cargar(); } });
}
/** Lo que respondió el cliente por el enlace; desde aquí sale la acción de mejora o la PQRS. */
async function verRespuesta(id){
  const r = await Registros.abrir(id); if (!r) return;
  const p = pctDe(r), bajo = (p != null && p < 70) || (hayNps(r.nps) && Number(r.nps) <= 6);
  const escrito = [r.comentario].concat((r.respuestas || []).filter((q)=> q.tipo === 'texto' && q.valor).map((q)=> q.valor)).filter((t, i, a)=> t && a.indexOf(t) === i).join('\n');
  const m = UI.modal('<h3>Respuesta de ' + esc(r.cliente) + '</h3>' +
    dato('Respondió', [r.encuestado, r.cargo].filter(Boolean).join(' · ')) + dato('Fecha', UI.corta(r.fecha)) + dato('Periodo evaluado', r.periodo) + dato('Canal', 'Enlace (la respondió el cliente)') +
    dato('Satisfacción', p == null ? '—' : p + '%') + dato('NPS', npsTxt(r.nps)) +
    '<div class="sub-t">Respuestas</div>' + (r.respuestas || []).map((q, i)=> '<div class="resp-q"><div>' + (i + 1) + '. ' + esc(q.texto) + '</div><div class="v">' + esc(valorTxt(q)) + '</div></div>').join('') +
    (r.comentario && !(r.respuestas || []).some((q)=> q.valor === r.comentario) ? '<div class="sub-t">Comentario</div><div class="texto-largo">' + esc(r.comentario) + '</div>' : '') +
    (bajo && !r.accionId ? '<div class="aviso amar" style="margin-top:10px;">La calificación es baja: conviene acordar una acción de mejora con este cliente.</div>' : '') +
    (r.accionId ? '<div class="aviso ok" style="margin-top:10px;">Acción en el plan de acción: ' + esc(r.accionId) + '</div>' : '') + (r.pqrsId ? '<div class="aviso info">Registrada como PQRS: ' + esc(r.pqrsId) + '</div>' : '') +
    '<div class="acciones-top" style="margin-top:10px;">' + (!r.accionId ? '<button type="button" class="btn ' + (bajo ? 'amber' : 'ghost') + '" id="rvAcc">Crear acción en el plan</button>' : '') +
      (!r.pqrsId && escrito ? '<button type="button" class="btn ghost" id="rvPqr">Registrar el comentario como PQRS</button>' : '') + '<button type="button" class="btn ghost" id="rvPdf">Respuesta (PDF)</button></div>' +
    '<button type="button" class="btn ghost" data-cerrar>Cerrar</button>');
  const on = (s, f)=> { const b = m.el.querySelector(s); if (b) b.addEventListener('click', f); };
  on('#rvAcc', ()=> { m.cerrar(); UI.nuevaAccion({ origen: 'Calidad', origenRef: id, tipoAccion: 'De mejora', prioridad: bajo ? 'Alta' : 'Media',
      hallazgo: 'Encuesta de satisfacción de ' + r.cliente + ': ' + (p == null ? '' : p + '%') + (hayNps(r.nps) ? ' · NPS ' + r.nps : '') + (escrito ? ' — ' + escrito.replace(/\n/g, ' / ') : ''), accion: 'Analizar con el cliente lo que calificó bajo y acordar mejoras' },
    async (a)=> { await SGSST.enviar({ action: 'parche', tipo: 'encresp', id, campos: { accionId: a.id } }); cargar(); }); });
  on('#rvPqr', ()=> { m.cerrar(); editar('pqrs', 'PQRS', C_PQR, { id: SGSST.nuevoId('PQR'), nuevo: true, fecha: r.fecha || UI.hoy(), cliente: r.cliente, canal: 'Encuesta', tipoPQRS: bajo ? 'Queja' : 'Sugerencia', descripcion: escrito, procede: 'Por analizar', estado: 'ABIERTA' },
    alistarPqr, async (v, d)=> { await despuesPqr(v, d); await SGSST.enviar({ action: 'parche', tipo: 'encresp', id, campos: { pqrsId: d.id } }); }); });
  on('#rvPdf', ()=> UI.imprimir([UI.cabecera('SG-SATISFACCION', 'ENCUESTA DE SATISFACCIÓN DEL CLIENTE', 'Respondida por enlace el ' + UI.corta(r.fecha)) +
    UI.seccion('DATOS', UI.tablaDatos([['Cliente', r.cliente], ['Respondió', [r.encuestado, r.cargo].filter(Boolean).join(' · ')], ['Periodo evaluado', r.periodo || ''], ['Fecha', UI.corta(r.fecha)]])) +
    UI.seccion('RESPUESTAS', '<table><tr><th>N.º</th><th>Pregunta</th><th>Respuesta</th></tr>' + (r.respuestas || []).map((q, i)=> '<tr><td class="a">' + (i + 1) + '</td><td>' + esc(q.texto) + '</td><td>' + esc(valorTxt(q)) + '</td></tr>').join('') + '</table>') +
    (r.comentario ? UI.seccion('COMENTARIO', UI.textoLargo(r.comentario)) : '') +
    UI.seccion('RESULTADO', UI.tablaDatos([['Satisfacción', p == null ? '—' : p + '%'], ['Recomendación (NPS)', npsTxt(r.nps)], ['Acción en el plan', r.accionId || '—'], ['PQRS', r.pqrsId || '—']]))]));
}
$('tabs').addEventListener('click', (e)=>{ const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
window.addEventListener('outbox-enviado', ()=> cargar());
cargar().then(async ()=> { const id = decodeURIComponent(location.hash.slice(1) || ''); const pre = { PNC: 'pnc', PQR: 'pqrs', PQRS: 'pqrs', RIC: 'riesgos', OBC: 'objetivos', ENC: 'satisfaccion', ENV: 'satisfaccion', RSP: 'satisfaccion' }[id.split('-')[0]];
  if (pre) document.querySelector('#tabs [data-tab="' + pre + '"]').click();
  // Desde el plan de acción, los pendientes o el historial: abre la encuesta enviada o la respuesta.
  // v109: desde Reportes → PQRS se abre esa PQRS para responderla.
  if (/^PQR-/.test(id) && rows.some((x)=> x.id === id)) { const b = $('panel').querySelector('[data-id="' + CSS.escape(id) + '"]'); if (b) b.click(); }
  if (/^ENV-/.test(id) && rows.some((x)=> x.id === id)) verEnvio(id); else if (/^RSP-ENV-/.test(id) && rows.some((x)=> x.id === id)) verRespuesta(id); });
</script>
