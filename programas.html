<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Programas de alto riesgo · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
/* v107: botones de estado con color (antes no se veía cuál quedaba marcado) */
.seg-btn{flex-wrap:wrap;}
.seg-btn button{min-height:44px;flex:1 1 auto;padding:0 10px;}
.seg-btn button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.seg-btn button.on[data-v="Cumple"],.seg-btn button.on[data-v="Completo"],.seg-btn button.on[data-v="Bueno"]{background:var(--ok);border-color:var(--ok);color:#fff;}
.seg-btn button.on[data-v="Parcial"],.seg-btn button.on[data-v="Incompleto"],.seg-btn button.on[data-v="Regular"]{background:#e0a400;border-color:#e0a400;color:#151b24;}
.seg-btn button.on[data-v="No cumple"],.seg-btn button.on[data-v="No tiene"],.seg-btn button.on[data-v="Malo"]{background:var(--mal);border-color:var(--mal);color:#fff;}
.seg-btn button.on[data-v="No aplica"]{background:#6b7785;border-color:#6b7785;color:#fff;}
/* filas editables (responsables, inventario, personal, equipos…) */
.filas{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px;}
.fila-ed{border:1px solid var(--line);border-left:5px solid #c8d0d6;border-radius:10px;padding:10px 12px 8px;background:#fcfcfb;}
.fila-ed.ok{border-left-color:var(--ok);} .fila-ed.pronto{border-left-color:#e0a400;} .fila-ed.mal{border-left-color:var(--mal);}
.fila-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px;}
.fila-campos .field{margin-bottom:8px;min-width:0;}
.fila-campos .fe-l{grid-column:1 / -1;}
.fila-pie{display:flex;align-items:center;gap:8px;border-top:1px dashed #e6eaee;padding-top:8px;}
.fila-pie .chip{white-space:normal;}
.btn-quitar{margin-left:auto;min-height:44px;min-width:92px;padding:0 14px;border:1.5px solid #f0c8c1;background:#fff;color:var(--mal);border-radius:10px;font:700 13.5px/1 inherit;font-family:inherit;cursor:pointer;}
.btn-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border:1.5px dashed #b9c3cc;background:#fff;border-radius:10px;font:700 14px/1.2 inherit;font-family:inherit;color:var(--ink);cursor:pointer;margin-top:4px;}
.con-otro .otro-txt{margin-top:6px;}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;}
.acciones .btn{flex:1 1 140px;width:auto;margin:0;}
.acciones.fija{position:sticky;top:0;z-index:20;background:var(--bg,#eef1f4);padding:8px 0;margin-top:-6px;}
.barra{height:10px;border-radius:6px;background:#e6eaee;overflow:hidden;margin:6px 0 2px;}
.barra > i{display:block;height:100%;background:var(--ok);border-radius:6px;}
.barra.pronto > i{background:#e0a400;} .barra.mal > i{background:var(--mal);}
.falta-lista{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.5;color:#8a1f12;}
.falta-lista button{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer;text-align:left;}
.card h2 .n{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px;}
.prog-ic{display:inline-flex;width:22px;height:22px;vertical-align:-5px;margin-right:6px;color:var(--ink);}
.prog-ic svg{width:22px;height:22px;}
.hdr .prog-ic{color:#c9a227;}
/* checklist */
.comp{font-family:var(--font-display);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 2px;display:flex;justify-content:space-between;gap:8px;}
.comp span{font-family:inherit;text-transform:none;letter-spacing:0;font-weight:700;}
.elem{border-bottom:1px dashed #e6eaee;padding:9px 0;}
.elem .et{font-size:13.5px;font-weight:600;line-height:1.35;}
.elem .seg-btn{margin-top:6px;}
.elem textarea,.elem input.otro-req{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:9px;padding:8px;font-size:15px;font-family:inherit;min-height:44px;margin-top:6px;background:#fcfbf8;}
.elem.sin .et::after{content:' · sin evaluar';color:var(--mal);font-weight:700;font-size:11.5px;}
.elem .quitar-otro{margin-top:6px;}
.ind{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:7px 0;border-bottom:1px dashed #e6eaee;font-size:13px;}
.ind b{font-size:15px;}
.ind small{grid-column:1 / span 2;color:var(--muted);font-size:11.5px;}
.field-invalid{border-color:#c0392b !important;background:#fdecea !important;}
/* v109: personal y equipos sincronizados con el anexo, Personal habilitado y el inventario */
.fila-nota{font-size:12px;color:var(--muted);line-height:1.4;margin:-2px 0 6px;}
.fila-nota b{color:var(--ink);font-weight:700;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#e8eef4;color:var(--ink);margin-right:4px;vertical-align:1px;}
.tag.nuevo{background:#fff1c2;color:#6b4e00;}
.sync{border:1px solid #d7e3ec;background:#f4f8fb;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;margin:6px 0 10px;}
.sync .btn{width:auto;min-height:44px;margin:8px 0 0;padding:0 14px;}
.quitados{margin:10px 0 0;font-size:13px;}
.quitados summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:700;}
.quitados .q{display:flex;align-items:center;gap:8px;border-top:1px dashed #e6eaee;padding:8px 0;}
.quitados .q div{flex:1;min-width:0;} .quitados .q small{display:block;color:var(--muted);}
.quitados .q button{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font:700 13px/1 inherit;font-family:inherit;cursor:pointer;}
.eq-inv{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-left:5px solid #c8d0d6;border-radius:10px;padding:10px 12px;background:#fcfcfb;margin:0 0 8px;cursor:pointer;min-height:44px;}
.eq-inv.ok{border-left-color:var(--ok);} .eq-inv.pronto{border-left-color:#e0a400;} .eq-inv.mal{border-left-color:var(--mal);} .eq-inv.fuera{opacity:.72;}
.eq-inv input{width:24px;height:24px;margin:1px 0 0;}
.eq-inv b{font-size:14px;display:block;} .eq-inv small{display:block;color:var(--muted);font-size:12px;line-height:1.4;}
.eq-inv .alerta{color:var(--mal);font-weight:700;} .eq-inv .chip{margin-top:4px;}
.sub-h{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:14px 0 4px;}
.btn-mini{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font:700 13px/1.1 inherit;font-family:inherit;cursor:pointer;color:var(--ink);}
.filtro-aviso{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff7dc;border:1px solid #f0dc9a;border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:13px;}
.filtro-aviso button{margin-left:auto;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Planear el SG-SST</div>
    <h1>Programas de alto riesgo</h1>
    <p>Alturas, espacios confinados, eléctrico, caliente, izaje, energías peligrosas, químicos, excavaciones y cargas: requisitos, personal, equipos, rescate e indicadores</p></div></div>
  </div>
  <div id="avisoSrv"></div><div id="avisoCopia"></div>
  <div class="acciones"><button type="button" class="btn ghost" id="pdfTodos">Resumen de los programas (PDF)</button></div>
  <div class="kpis" id="kpis"></div>
  <div id="panel"><div class="empty">Cargando…</div></div>
  <div class="version-portal">Portal SSTA · versión v119</div>
</div>
<div class="screen" id="scrProg"></div>
</div>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script src="registros.js"></script>
<script src="inspecciones-plantillas.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
/* ── v107: utilidades locales («Otro» que deja escribir, filas editables y validación) ── */
const esOtro = (v)=> /^Otr[oa]s?\b/i.test(String(v == null ? '' : v));
/** Lista desplegable que, con «Otro»/«Otra», muestra un campo para escribir cuál. */
function selOtro(attr, ops, val, ph, vacio){
  val = val == null ? '' : String(val);
  const otro = ops.find(esOtro), enLista = ops.some((o)=> String(o) === val), usa = !!otro && val !== '' && (!enLista || esOtro(val));
  const sel = usa ? otro : val;
  return '<div class="con-otro"><select ' + attr + '>' + (vacio ? '<option value="">' + esc(vacio) + '</option>' : '') + ops.map((o)=> '<option' + (String(o) === sel ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' +
    (otro ? '<input type="text" class="otro-txt" aria-label="Escribe cuál" placeholder="' + esc(ph || '¿Cuál? Escríbelo aquí') + '" value="' + esc(usa && !esOtro(val) ? val : '') + '"' + (usa ? '' : ' hidden') + '>' : '') + '</div>';
}
/** Valor de una lista con «Otro»: el texto escrito (vacío si falta escribirlo). */
function valSel(s){ const t = s.parentElement && s.parentElement.querySelector('.otro-txt'); return t && esOtro(s.value) ? t.value.trim() : s.value; }
document.addEventListener('change', (e)=> { const s = e.target.closest('.con-otro > select'); if (!s) return; const t = s.parentElement.querySelector('.otro-txt'); if (t) { t.hidden = !esOtro(s.value); if (!t.hidden) t.focus(); } });
/* Filas editables: cols = [{ k, l, t: text|number|date|select|persona|sino, op, req, ph, ancho:'l', despuesDe:'k' }] */
function campoFila(c, v){
  const a = 'data-k="' + c.k + '"';
  if (c.t === 'select') return selOtro(a, c.op, v, c.ph, c.vacio);
  if (c.t === 'sino') return '<select ' + a + '>' + ['', 'Sí', 'No'].map((o)=> '<option value="' + o + '"' + (String(v || '') === o ? ' selected' : '') + '>' + (o || '—') + '</option>').join('') + '</select>';
  if (c.t === 'number') return '<input type="number" min="0" step="any" inputmode="decimal" ' + a + ' value="' + esc(v == null ? '' : v) + '"' + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + '>';
  return '<input type="' + (c.t === 'date' ? 'date' : 'text') + '" ' + a + (c.t === 'persona' ? ' data-persona="1"' : '') + ' value="' + esc(v == null ? '' : v) + '"' + (c.ph ? ' placeholder="' + esc(c.ph) + '"' : '') + '>';
}
function filaHTML(cols, r, estado, nota){
  const e = estado ? estado(r) : null, extra = {};
  // v109: lo que no es una columna (origen, obra, equipoId…) viaja escondido en la fila y se conserva al guardar.
  Object.keys(r || {}).forEach((k)=> { if (k !== 'uid' && !cols.some((c)=> c.k === k)) extra[k] = r[k]; });
  return '<div class="fila-ed ' + (e ? e[0] : '') + '" data-uid="' + esc(r.uid || '') + '" data-extra="' + esc(JSON.stringify(extra)) + '">' + (nota ? '<div class="fila-nota" data-nota>' + nota(r) + '</div>' : '') +
    '<div class="fila-campos">' + cols.map((c)=> '<div class="field' + (c.ancho === 'l' ? ' fe-l' : '') + '"><label>' + esc(c.l) + (c.req ? ' *' : '') + '</label>' + campoFila(c, r[c.k]) + '</div>').join('') + '</div>' +
    '<div class="fila-pie">' + (e ? '<span class="chip ' + e[0] + '" data-est>' + esc(e[1]) + '</span>' : '') + '<button type="button" class="btn-quitar" data-quitar>Quitar</button></div></div>';
}
function leerFila(el, cols){
  let extra = {}; try { extra = JSON.parse(el.dataset.extra || '{}') || {}; } catch (e) { extra = {}; }
  const o = Object.assign(extra, { uid: el.dataset.uid || SGSST.nuevoOpId() });
  cols.forEach((c)=> { const i = el.querySelector('[data-k="' + c.k + '"]'); if (!i) return; o[c.k] = c.t === 'select' ? valSel(i) : c.t === 'number' ? (i.value === '' ? '' : Number(i.value)) : i.value.trim(); });
  return o;
}
/** Monta una lista de filas en cont. Devuelve { leer(), validar(nombre) → [faltas] }. */
function listaFilas(cont, cols, lista, o){
  o = o || {};
  cont.innerHTML = '<div class="filas"></div><button type="button" class="btn-add">+ ' + esc(o.agregar || 'Agregar') + '</button>' + (o.vacio ? '<div class="ayuda" data-vacio>' + esc(o.vacio) + '</div>' : '');
  const caja = cont.querySelector('.filas');
  const vacio = ()=> { const v = cont.querySelector('[data-vacio]'); if (v) v.hidden = !!caja.children.length; };
  const activar = (el)=> {
    el.querySelectorAll('input[data-persona]').forEach((i)=> UI.autocompletar(i, (p)=> { i.value = p.nombre; const ce = el.querySelector('[data-k="cedula"]'), ca = el.querySelector('[data-k="cargo"]'); if (ce && p.cedula) ce.value = p.cedula; if (ca && p.cargo) ca.value = p.cargo; refrescar(el); }));
    el.querySelector('[data-quitar]').addEventListener('click', async ()=> { const r = leerFila(el, cols);
      if (o.alQuitar) { if (!(await o.alQuitar(r, el))) return; }
      else { const lleno = cols.some((c)=> r[c.k] !== '' && r[c.k] != null && c.k !== (o.clavePrincipalVacia || '')); if (lleno && !confirm('¿Quitar esta fila?')) return; }
      el.remove(); vacio(); if (o.alCambiar) o.alCambiar(); });
    el.addEventListener('input', ()=> refrescar(el)); el.addEventListener('change', ()=> refrescar(el));
    if (o.alActivar) o.alActivar(el);
  };
  const refrescar = (el)=> { if (!o.estado) { if (o.alCambiar) o.alCambiar(); return; } const r = leerFila(el, cols), e = o.estado(r); el.className = 'fila-ed ' + e[0]; const ch = el.querySelector('[data-est]'); if (ch) { ch.className = 'chip ' + e[0]; ch.textContent = e[1]; } const n = el.querySelector('[data-nota]'); if (n && o.nota) n.innerHTML = o.nota(r); if (o.alCambiar) o.alCambiar(); };
  const agregar = (r)=> { caja.insertAdjacentHTML('beforeend', filaHTML(cols, r || {}, o.estado, o.nota)); activar(caja.lastElementChild); vacio(); };
  (lista || []).forEach((r)=> agregar(r));
  cont.querySelector('.btn-add').addEventListener('click', ()=> { agregar(Object.assign({ uid: SGSST.nuevoOpId() }, o.nueva ? o.nueva() : {})); const f = caja.lastElementChild.querySelector('input,select'); if (f) f.focus(); if (o.alCambiar) o.alCambiar(); });
  vacio();
  return {
    agregar: (r)=> agregar(r),
    quitar: (el)=> { el.remove(); vacio(); if (o.alCambiar) o.alCambiar(); },
    filas: ()=> [...caja.children],
    refrescarTodo: ()=> [...caja.children].forEach((el)=> refrescar(el)),
    /** Cambia campos de una fila ya pintada (sin tocar lo que la persona escribió en las demás). */
    poner: (el, campos)=> { Object.keys(campos).forEach((k)=> { const i = el.querySelector('[data-k="' + k + '"]'); if (i) i.value = campos[k] == null ? '' : campos[k];
      else { let x = {}; try { x = JSON.parse(el.dataset.extra || '{}') || {}; } catch (e) {} x[k] = campos[k]; el.dataset.extra = JSON.stringify(x); } }); refrescar(el); },
    leer: ()=> [...caja.children].map((el)=> leerFila(el, cols)),
    validar: (nombre)=> { const faltas = [];
      [...caja.children].forEach((el, n)=> { const r = leerFila(el, cols), q = (k)=> el.querySelector('[data-k="' + k + '"]');
        const marca = (k, t)=> { const i = q(k); const x = i && i.parentElement.querySelector('.otro-txt:not([hidden])') && esOtro(i.value) ? i.parentElement.querySelector('.otro-txt') : i; if (x) x.classList.add('field-invalid'); faltas.push({ t: nombre + ' ' + (n + 1) + ': ' + t, el: x }); };
        cols.forEach((c)=> { const i = q(c.k); if (!i) return;
          if (c.t === 'select' && esOtro(i.value) && !r[c.k]) marca(c.k, 'escribe cuál en «' + c.l + '»');
          else if (c.req && (r[c.k] === '' || r[c.k] == null)) marca(c.k, 'falta «' + c.l + '»');
          if (c.t === 'number' && r[c.k] !== '' && Number(r[c.k]) < 0) marca(c.k, '«' + c.l + '» no puede ser negativo');
          if (c.despuesDe && r[c.k] && r[c.despuesDe] && r[c.k] < r[c.despuesDe]) marca(c.k, '«' + c.l + '» no puede ser antes de «' + (cols.find((x)=> x.k === c.despuesDe) || {}).l + '»');
          if (c.k === 'cedula' && r[c.k] && !/^\d{4,12}$/.test(r[c.k])) marca(c.k, 'la cédula va solo con números'); });
      });
      return faltas; }
  };
}
/** Muestra «qué falta» (con enlace a cada campo) y lleva al primero. */
function mostrarFaltas(caja, faltas){
  if (!faltas.length) { caja.innerHTML = ''; return; }
  caja.innerHTML = '<div class="aviso"><b>Falta completar ' + faltas.length + ' cosa(s):</b><ul class="falta-lista">' + faltas.slice(0, 12).map((f, i)=> '<li><button type="button" data-f="' + i + '">' + esc(f.t) + '</button></li>').join('') + (faltas.length > 12 ? '<li>… y ' + (faltas.length - 12) + ' más</li>' : '') + '</ul></div>';
  caja.querySelectorAll('[data-f]').forEach((b)=> b.addEventListener('click', ()=> { const el = faltas[+b.dataset.f].el; if (el) { el.scrollIntoView({ block: 'center' }); if (el.focus) el.focus(); } }));
  caja.scrollIntoView({ block: 'center' });
}
const limpiarMarcas = (raiz)=> raiz.querySelectorAll('.field-invalid').forEach((x)=> x.classList.remove('field-invalid'));
const estadoVence = (vence, txtOk)=> { const c = vence ? UI.semaforo(vence, 30) : 'gris'; return [c, c === 'mal' ? 'Vencido ' + UI.corta(vence) : c === 'pronto' ? 'Vence ' + UI.corta(vence) : c === 'ok' ? (txtOk || 'Vigente') + ' hasta ' + UI.corta(vence) : 'Sin fecha de vencimiento']; };

/* Íconos de línea (sin emojis) */
const IC = {
  alturas: '<path d="M4 20h16M7 20V9l5-5 5 5v11M12 4v6M10 14h4"/>', confinados: '<ellipse cx="12" cy="6" rx="7" ry="2.5"/><path d="M5 6v12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V6M12 9v8M9.5 14.5 12 17l2.5-2.5"/>',
  electrico: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', caliente: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-3.5 2-6 1.5 1 2.5 2.5 2.5 4.5"/>',
  izajes: '<path d="M4 21h6M7 21V4h12M7 8l4-4M19 4v6M17 10h4v4h-4z"/>', loto: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4M12 15v2"/>',
  quimicos: '<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M7.5 14h9"/>', excavaciones: '<path d="M3 20h18M5 20l3-8h8l3 8M10 12V5l4 2-4 2"/>',
  cargas: '<rect x="6" y="9" width="12" height="9" rx="1"/><path d="M9 9V6h6v3M4 21h16"/>'
};
const icono = (k)=> '<span class="prog-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (IC[k] || IC.alturas) + '</svg></span>';

/* Componentes mínimos de cada programa (orden en que se muestran) */
const COMP = { P: 'Programa y responsables', I: 'Inventario de tareas y sitios', D: 'Procedimientos y permisos', C: 'Controles en el sitio', K: 'Personal, capacitación y aptitud', E: 'Equipos e inspección', R: 'Rescate y emergencias', S: 'Seguimiento e indicadores' };
/* Requisitos de cada programa: [componente, texto]. Los primeros de alturas, confinados, eléctrico,
   caliente e izajes van en el mismo orden de antes (las evaluaciones guardadas siguen en su sitio);
   los nuevos se agregan al final. Guía práctica: verifícala con el texto vigente de cada norma. */
const PROGRAMAS = {
  alturas: { nombre: 'Protección contra caídas (trabajo en alturas)', norma: 'Res. 4272 de 2021', req: 'alturas', permiso: 'permiso-trabajo-alturas.html',

async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('panel').innerHTML = ''; return; }

}
/** Listas de inspección (para el nombre de la categoría, su frecuencia y sus vencimientos) y Personal habilitado por cédula. */
function armarListas(){
  PL = {}; plantillasInspeccion(de('plantillainsp')).forEach((p)=> { PL[p.id] = p; });
  HAB = {}; de('trabajador').forEach((x)=> { const k = ced(x.resumen.cedula); if (k) HAB[k] = x.resumen; });
}

/* ── v109: inventario de equipos (Inspecciones) ── */
const plN = (id)=> PL[id] || { id, nombre: id || 'Equipo', vencimientos: [], frecuencia: 'mensual' };
function proximaEq(s){ const f = FRECUENCIAS[s.frecuencia] || FRECUENCIAS.mensual; if (!s.ultimaInspeccion) return UI.hoy(); return f.dias ? Festivos.sumarDias(s.ultimaInspeccion, f.dias) : Festivos.sumarMeses(s.ultimaInspeccion, f.meses); }
/** Estado de un equipo del inventario (mismas reglas de Inspecciones). */
function estInv(x){
  const s = x.resumen || {};
  if (s.activo === false) return { c: 'gris', t: 'De baja', motivos: [], proxima: '' };
  const motivos = [], h = UI.hoy(), vale = plN(s.categoria).vencimientos || [];
  Object.keys(s.vencimientos || {}).filter((k)=> !PL[s.categoria] || vale.includes(k)).forEach((k)=> { const v = s.vencimientos[k]; if (!v) return; if (v < h) motivos.push(k + ' vencida (' + UI.corta(v) + ')'); else if (v <= Festivos.sumarDias(h, 30)) motivos.push(k + ' vence ' + UI.corta(v)); });
  const p = proximaEq(s);
  if (s.ultimoResultado === 'NO CONFORME') motivos.unshift('Última inspección: NO CONFORME');
  const mal = motivos.some((m)=> /vencida|NO CONFORME/.test(m));
  return { c: mal ? 'mal' : (p <= h || motivos.length ? 'pronto' : 'ok'), t: mal ? 'Atención' : p <= h ? (s.ultimaInspeccion ? 'Toca inspección' : 'Sin inspeccionar') : 'Al día', motivos, proxima: p };
}
/** Equipos del inventario que corresponden al programa (por categoría o por nombre). */
function pertinentes(k){
  const P = PROGRAMAS[k];
  return de('equipo').filter((y)=> y.resumen.activo !== false && (P.equipos.indexOf(y.resumen.categoria) !== -1 || (P.palabrasEquipo && P.palabrasEquipo.test(y.resumen.nombre + ' ' + y.resumen.categoria + ' ' + plN(y.resumen.categoria).nombre))));
}

let ANEXO = null, anexoCargando = null;
const riesgoDeTipo = (t)=> /altura/i.test(t) ? 'alturas' : /confinad/i.test(t) ? 'confinados' : /el[eé]ctric/i.test(t) ? 'electrico' : /caliente/i.test(t) ? 'caliente' : /izaje/i.test(t) ? 'izajes' : '';
/** Trae del servidor del anexo las obras con permisos de alto riesgo y el último registro diario de cada una.
 *  Resultado: { porRiesgo: { alturas: [{ nombre, cedula, cargo, obra, fecha }] }, obras, ok, error, cuando }. Sin señal usa la última copia. */
function cargarAnexo(forzar){
  if (ANEXO && !forzar) return Promise.resolve(ANEXO);
  if (anexoCargando && !forzar) return anexoCargando;
  anexoCargando = (async ()=> {
    const B = PORTAL_CONFIG.BACKENDS.personal, copia = SGSST._lsGet('ssta-prog-anexo', null);
    const sin = (error)=> Object.assign({ porRiesgo: {}, obras: 0 }, copia || {}, { ok: false, error, deCopia: !!copia });
    if (!B || !B.url || (typeof Empresa !== 'undefined' && !Empresa.moduloActivo('personal'))) return (ANEXO = { porRiesgo: {}, obras: 0, ok: false, error: 'sin servidor' });
    if (!navigator.onLine) return (ANEXO = sin('sin señal'));
    try {
      const tk = '&token=' + encodeURIComponent(PORTAL_CONFIG.API_TOKEN);
      const j = await (await fetchWithRetry(B.url + '?action=listObras' + tk)).json();
      if (!j || !j.ok) throw new Error((j && j.error) || 'respuesta no válida');
      const archivoDe = {};
      Object.keys(PROGRAMAS).forEach((k)=> { const a = (PORTAL_CONFIG.BACKENDS[k] || {}).archivo || PROGRAMAS[k].permiso; if (a) archivoDe[a] = k; if (PROGRAMAS[k].permiso) archivoDe[PROGRAMAS[k].permiso] = k; });

    q('aiOk').disabled = false;
    if (!res.ok) { q('aiMsg').textContent = 'No se guardó: ' + (res.error || 'error del servidor'); return; }
    rows.push({ id, tipo: 'equipo', resumen: res.resumen || Object.assign({ ultimaInspeccion: '', ultimoResultado: '' }, campos), pendiente: !!res.enCola });
    eqSel[id] = true; eqNuevos.add(id); L.eq.quitar(el); pintarEquiposInv(); sub(); m.cerrar();
    UI.toast((res.enCola ? '⏳ Se envía al volver la señal. ' : '✓ ') + 'Agregado al inventario y marcado en el programa. Guarda el programa.');
  });
}
/** Equipos del inventario marcados en el programa, con su estado de hoy. */
function equiposInvDe(){
  const inv = de('equipo');
  return Object.keys(eqSel).filter((id)=> eqSel[id]).map((id)=> { const x = inv.find((y)=> y.id === id), prev = (actual.equiposInventario || []).find((e)=> e.equipoId === id) || {};
    const s = x ? x.resumen : { codigo: prev.codigo, nombre: prev.nombre, categoria: prev.categoria, ultimaInspeccion: prev.ultima }, e = x && x.resumen.activo !== false ? estInv(x) : { c: 'gris', t: 'Ya no está en el inventario', proxima: '' };
    return { equipoId: id, codigo: s.codigo || '', nombre: s.nombre || '', categoria: s.categoria || '', ubicacion: s.ubicacion || '', ultima: s.ultimaInspeccion || '', resultado: s.ultimoResultado || '', proxima: e.proxima || '', estado: e.t, alDia: e.c === 'ok' }; });
}
function pintarOtros(){
  $('pOtros').innerHTML = actual.otros.map((o, j)=> '<div class="elem" data-o="' + j + '" data-uid="' + esc(o.uid) + '"><input type="text" class="otro-req" placeholder="Escribe el requisito (ej: requisito del cliente o de la ARL)" value="' + esc(o.t || '') + '">' +
    '<div class="seg-btn" role="group">' + ESTADOS.map((x)=> '<button type="button" data-v="' + x + '" aria-pressed="' + (o.estado === x) + '" class="' + (o.estado === x ? 'on' : '') + '">' + x + '</button>').join('') + '</div>' +
    '<textarea data-ev placeholder="Evidencia">' + esc(o.evidencia || '') + '</textarea><div class="fila-pie" style="border:0;"><button type="button" class="btn-quitar" data-qo="' + j + '">Quitar</button></div></div>').join('');
  $('pOtros').querySelectorAll('[data-qo]').forEach((b)=> b.addEventListener('click', ()=> { leerOtros(); actual.otros.splice(+b.dataset.qo, 1); pintarOtros(); sub(); }));
}
function leerOtros(){
  actual.otros = [...$('pOtros').querySelectorAll('.elem[data-o]')].map((d)=> { const on = d.querySelector('.seg-btn .on'); return { uid: d.dataset.uid || SGSST.nuevoOpId(), t: d.querySelector('.otro-req').value.trim(), estado: on ? on.dataset.v : '', evidencia: d.querySelector('[data-ev]').value.trim() }; });
}
function leer(){
  const P = PROGRAMAS[clave], el = {};
  document.querySelectorAll('#scrProg .elem[data-i]').forEach((d)=> { const on = d.querySelector('.seg-btn .on'); el[d.dataset.i] = { estado: on ? on.dataset.v : '', evidencia: d.querySelector('[data-ev]').value.trim() }; });
  leerOtros();
  const todos = Object.keys(el).map((i)=> el[i]).concat(actual.otros.filter((o)=> o.t));
  const ap = todos.filter((x)=> x.estado && x.estado !== 'No aplica'), pts = ap.reduce((a, x)=> a + (x.estado === 'Cumple' ? 1 : x.estado === 'Parcial' ? 0.5 : 0), 0);
  const personal = L.per.leer(), eqs = L.eq.leer(), h = UI.hoy(), eqInv = equiposInvDe();
  const excluidos = [...new Set((actual.equiposExcluidos || []).concat(pertinentes(clave).map((x)=> x.id)).filter((id)=> !eqSel[id]))];
  const resc = { estado: valSel($('rEstado')), fecha: $('rFecha').value, personas: $('rPersonas').value === '' ? '' : Number($('rPersonas').value), tiempo: $('rTiempo').value === '' ? '' : Number($('rTiempo').value), equipos: $('rEquipos').value.trim() };
  return Object.assign({}, actual, { programa: clave, nombre: P.nombre, coordinador: $('pCoord').value.trim(), estado: $('pAplica').value, objetivo: $('pObj').value.trim(), alcance: $('pAlc').value.trim(), metas: $('pMetas').value.trim(), elementos: el,
    responsables: L.resp.leer(), inventario: L.inv.leer(), documentos: L.doc.leer(), personal, equiposPrograma: eqs, rescate: resc,
    equiposInventario: eqInv, equiposExcluidos: excluidos, quitados: actual.quitados || [],
    personalTotal: personal.length, personalVigente: personal.filter((p)=> p.vence && p.vence >= h).length,
    equiposTotal: eqs.length + eqInv.length, equiposAlDia: eqs.filter((e)=> estEq(e)[0] === 'ok').length + eqInv.filter((e)=> e.alDia).length,
    evaluados: ap.length, sinEvaluar: todos.filter((x)=> !x.estado).length, cumplimiento: ap.length ? Math.round(pts * 100 / ap.length) : 0 });
}
/** Lo que falta para un programa completo (los elementos mínimos). */
function faltantes(v, marcar){
  const P = PROGRAMAS[clave], f = [], s = $('scrProg');
  if (marcar) limpiarMarcas(s);
  if (v.estado === 'NO APLICA') return f;
  const m = (el, t)=> { if (marcar && el) el.classList.add('field-invalid'); f.push({ t, el }); };
  if (!v.coordinador) m($('pCoord'), 'Coordinador o responsable del programa');
  if (esOtro($('rEstado').value) && !v.rescate.estado) m($('rEstado').parentElement.querySelector('.otro-txt'), 'Plan de rescate: escribe cuál');
  if (marcar) {
    f.push(...L.resp.validar('Responsable'), ...L.inv.validar('Tarea'), ...L.doc.validar('Documento'), ...L.per.validar('Persona'), ...L.eq.validar('Equipo'));
    ['rPersonas', 'rTiempo'].forEach((id)=> { if ($(id).value !== '' && Number($(id).value) < 0) m($(id), 'Plan de rescate: no puede ser negativo'); });
  }
  s.querySelectorAll('.elem[data-i]').forEach((d)=> { if (!d.querySelector('.seg-btn .on')) { if (marcar) d.classList.add('sin'); f.push({ t: 'Evaluar: ' + P.elementos[d.dataset.i][1], el: d }); } });
  s.querySelectorAll('.elem[data-o]').forEach((d, j)=> { const o = v.otros[j] || {}; if (!o.t) m(d.querySelector('.otro-req'), 'Otro requisito ' + (j + 1) + ': escribe cuál es'); else if (!o.estado) { if (marcar) d.classList.add('sin'); f.push({ t: 'Evaluar: ' + o.t, el: d }); } });
  return f;
}
function sub(){
  const v = leer(), P = PROGRAMAS[clave], f = faltantes(v, false);
  const minimos = [['responsables', 'responsables'], ['inventario', 'inventario de tareas'], ['documentos', 'procedimientos'], ['personal', 'personal certificado']].filter(([k])=> !(v[k] || []).length).map((x)=> x[1]);
  if (!v.equiposTotal) minimos.push('equipos');
  if (!v.rescate.estado || v.rescate.estado === 'No tiene') minimos.push('plan de rescate');
  $('pSub').textContent = v.estado === 'NO APLICA' ? 'No aplica a la empresa' : 'Cumplimiento ' + v.cumplimiento + '%' + (v.sinEvaluar ? ' · ' + v.sinEvaluar + ' requisito(s) sin evaluar' : '');
  $('pBarra').className = 'barra ' + claseCump(v.cumplimiento); $('pBarra').firstChild.style.width = (v.estado === 'NO APLICA' ? 0 : v.cumplimiento) + '%';
  $('pAvance').textContent = v.estado === 'NO APLICA' ? 'El programa no aplica: no se evalúa.' : v.evaluados + ' requisito(s) evaluados, ' + v.sinEvaluar + ' sin evaluar.' + (minimos.length ? ' Sin registrar: ' + minimos.join(', ') + '.' : ' Elementos mínimos registrados.');
  $('pInd').innerHTML = indicadores(clave, v).map((i)=> '<div class="ind"><span>' + esc(i.n) + '</span><b style="color:' + (i.ok === null ? 'inherit' : i.ok ? 'var(--ok)' : 'var(--mal)') + ';">' + esc(i.v) + '</b><small>' + esc(i.d) + '</small></div>').join('');
  const n = (id, l)=> { $(id).textContent = l.length ? '(' + l.length + ')' : ''; };
  n('nResp', v.responsables); n('nInv', v.inventario); n('nDoc', v.documentos); n('nPer', v.personal); n('nEqMano', v.equiposPrograma);
  $('nEq').textContent = v.equiposTotal ? '(' + v.equiposTotal + ')' : '';
  document.querySelectorAll('#scrProg .comp[data-comp]').forEach((c)=> { const ls = [...document.querySelectorAll('#scrProg .elem[data-c="' + c.dataset.comp + '"]')].map((d)=> v.elementos[d.dataset.i]).filter((x)=> x.estado && x.estado !== 'No aplica');
    c.querySelector('span').textContent = ls.length ? Math.round(ls.reduce((a, x)=> a + (x.estado === 'Cumple' ? 1 : x.estado === 'Parcial' ? 0.5 : 0), 0) * 100 / ls.length) + '%' : ''; });
  if ($('pFaltan').innerHTML && !f.length) $('pFaltan').innerHTML = '';
}
async function guardar(){
  const v = leer(), P = PROGRAMAS[clave], msg = $('pMsg');
  const f = faltantes(v, true);
  if (f.length) { mostrarFaltas($('pFaltan'), f); msg.textContent = 'Falta completar ' + f.length + ' cosa(s): mira la lista arriba.'; return; }
  $('pFaltan').innerHTML = '';
  v.fechaRevision = UI.hoy(); v.proximaRevision = Festivos.sumarMeses(UI.hoy(), 12);
  msg.textContent = 'Guardando…'; [$('pOk'), $('pOk2')].forEach((b)=> { b.disabled = true; });
  const r = await Registros.guardar('programa', v.id, v, v.nuevo ? 0 : v.version);
  [$('pOk'), $('pOk2')].forEach((b)=> { b.disabled = false; });
  if (typeof r === 'string') { msg.textContent = r; return; }
  // Lo que no cumple se vuelve acción del plan de acción (una vez por requisito).
  const creadas = Object.assign({}, actual.accionesPor || {});
  const pend = Object.keys(v.elementos).filter((i)=> /No cumple|Parcial/.test(v.elementos[i].estado) && !creadas[i]).map((i)=> ({ k: i, t: P.elementos[i][1], e: v.elementos[i].estado }))
    .concat(v.otros.filter((o)=> /No cumple|Parcial/.test(o.estado) && !creadas[o.uid]).map((o)=> ({ k: o.uid, t: o.t, e: o.estado })));
  if (!r.enCola && pend.length && v.estado !== 'NO APLICA' && confirm(pend.length + ' requisito(s) sin cumplir del todo. ¿Crear las acciones en el plan de acción?')) {
    const resp = prompt('Responsable de las acciones:', v.coordinador || '');
    if (resp) { for (const x of pend) { const a = await UI.guardarAccion({ origen: 'Programa de alto riesgo', origenRef: v.id, hallazgo: P.nombre + ': ' + x.t + ' (' + x.e + ')', accion: 'Cumplir: ' + x.t, responsable: resp, tipoAccion: 'Preventiva', prioridad: 'Alta' }); if (a.ok) creadas[x.k] = a.id; else break; }
      await SGSST.enviar({ action: 'parche', tipo: 'programa', id: v.id, campos: { accionesPor: creadas } }); }
  }
  UI.toast(r.enCola ? '⏳ Guardado en el equipo; se envía al volver la señal.' : '✓ Programa guardado.');
  await cargar(); show('scrLista');
}
function tabla(cab, filas){ return '<table><tr>' + cab.map((c)=> '<td class="l">' + esc(c) + '</td>').join('') + '</tr>' + (filas.length ? filas.map((f)=> '<tr>' + f.map((c)=> '<td>' + esc(c == null ? '' : c) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + cab.length + '">—</td></tr>') + '</table>'; }
function pdfPrograma(v){
  const P = PROGRAMAS[clave], ind = indicadores(clave, v), orden = Object.keys(COMP);
  const req = P.elementos.map((e, i)=> [e, i]).sort((a, b)=> orden.indexOf(a[0][0]) - orden.indexOf(b[0][0]) || a[1] - b[1]).map(([e, i])=> { const x = v.elementos[i] || {}; return [COMP[e[0]], e[1], x.estado || '—', x.evidencia || '']; })
    .concat((v.otros || []).filter((o)=> o.t).map((o)=> ['Otro', o.t, o.estado || '—', o.evidencia || '']));
  UI.imprimir([UI.cabecera('SG-PROGRAMA-ALTO-RIESGO', 'PROGRAMA: ' + P.nombre.toUpperCase(), P.norma + ' · revisado ' + UI.corta(v.fechaRevision || UI.hoy())) +
    UI.seccion('DATOS', UI.tablaDatos([['Coordinador', v.coordinador || ''], ['Aplica', v.estado === 'NO APLICA' ? 'No' : 'Sí'], ['Cumplimiento', v.cumplimiento + '%'], ['Próxima revisión', UI.corta(v.proximaRevision || '')], ['Alcance', v.alcance || ''], ['Objetivo', v.objetivo || '']])) +
    UI.seccion('METAS', UI.textoLargo(v.metas)) +
    UI.seccion('RESPONSABLES', tabla(['Rol', 'Nombre', 'Contacto'], (v.responsables || []).map((x)=> [x.rol, x.nombre, x.contacto]))) +
    UI.seccion('INVENTARIO DE TAREAS Y SITIOS', tabla(['Tarea o sitio', 'Área', 'Frecuencia', 'Controles'], (v.inventario || []).map((x)=> [x.tarea, x.area, x.frecuencia, x.control]))) +
    UI.seccion('PROCEDIMIENTOS, PERMISOS Y DOCUMENTOS', tabla(['Tipo', 'Nombre o código', 'Fecha', 'Ubicación'], (v.documentos || []).map((x)=> [x.tipoDoc, x.nombre, UI.corta(x.fecha), x.ubicacion]))) +
    UI.seccion('PERSONAL CAPACITADO Y CERTIFICADO', tabla(['Nombre', 'Cédula', 'Certificación', 'De dónde viene', 'Fecha', 'Vence', 'Estado'], (v.personal || []).map((x)=> [x.nombre, x.cedula, x.cert, origenTexto(x), UI.corta(x.fecha), UI.corta(x.vence), estPer(x)[1]]))) +
    ((v.quitados || []).length ? UI.seccion('PERSONAS QUITADAS DEL PROGRAMA', tabla(['Nombre', 'Cédula', 'Motivo', 'Fecha', 'Quién'], v.quitados.map((q)=> [q.nombre, q.cedula, q.motivo, UI.corta(q.fecha), q.por]))) : '') +
    UI.seccion('EQUIPOS Y SU INSPECCIÓN', tabla(['Equipo', 'Código', 'Origen', 'Estado', 'Última', 'Próxima', 'Semáforo'], (v.equiposInventario || []).map((x)=> [x.nombre || plN(x.categoria).nombre, x.codigo, 'Inventario · ' + plN(x.categoria).nombre, x.resultado || '', UI.corta(x.ultima), UI.corta(x.proxima), x.estado])
      .concat((v.equiposPrograma || []).map((x)=> [x.equipo + (Number(x.cantidad) > 1 ? ' (× ' + x.cantidad + ')' : ''), x.codigo, 'Escrito a mano', x.estado, UI.corta(x.ultima), UI.corta(x.proxima), estEq(x)[1]])))) +
    UI.seccion('PLAN DE RESCATE Y EMERGENCIAS', UI.tablaDatos([['Plan', v.rescate.estado || '—'], ['Actualizado', UI.corta(v.rescate.fecha || '')], ['Personas entrenadas', String(v.rescate.personas === '' || v.rescate.personas == null ? '—' : v.rescate.personas)], ['Tiempo de respuesta', v.rescate.tiempo === '' || v.rescate.tiempo == null ? '—' : v.rescate.tiempo + ' min'], ['Equipos de rescate', v.rescate.equipos || '—']])) +
    UI.seccion('INDICADORES', tabla(['Indicador', 'Valor', 'Detalle'], ind.map((i)=> [i.n, i.v, i.d]))) +
    UI.seccion('LISTA DE CHEQUEO DE CUMPLIMIENTO', tabla(['Componente', 'Requisito', 'Estado', 'Evidencia'], req)) +
    UI.seccion('FIRMAS', '<table><tr><td style="height:60px;vertical-align:bottom;width:50%;">______________________________<br>Firma · Coordinador del programa<br>' + esc(v.coordinador || '') + '</td><td style="height:60px;vertical-align:bottom;">______________________________<br>Firma · Representante legal o empleador</td></tr></table>')]);
}
function pdfResumen(){
  const ks = Object.keys(PROGRAMAS);
  UI.imprimir([UI.cabecera('SG-PROGRAMA-ALTO-RIESGO', 'PROGRAMAS DE TAREAS DE ALTO RIESGO', 'Corte ' + UI.corta(UI.hoy())) +

document.addEventListener('click', (e)=>{ const v = e.target.closest('[data-volver]'); if (v) { e.preventDefault(); show('scrLista'); pintar(); } });
