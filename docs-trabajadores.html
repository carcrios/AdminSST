<script>OfflineBanner.init(),"undefined"!=typeof UpdateManager&&UpdateManager.init();const $=e=>document.getElementById(e),parrafos=e=>String(e||"").split(/\n+/).filter(Boolean).map(e=>"<p>"+esc(e)+"</p>").join("");async function cargar(){if(UI.avisoServidor($("avisoSrv")))return void($("docsTrab").innerHTML="");let e;try{e=await(await fetchWithRetry(SGSST.url()+"?action=documentosTrabajadores&token="+encodeURIComponent(SGSST.token()))).json()}catch(a){e=null}if(!e||!e.ok)return void($("docsTrab").innerHTML='<div class="empty">'+esc(e&&e.error||"Sin señal: no se pudieron traer los documentos.")+"</div>");const a=e.politica,i=[];i.push(a?'<div class="card"><h2>Política de seguridad y salud en el trabajo</h2><div class="m">Versión '+esc(a.version||"1")+" · firmada por "+esc(a.firmante||"—")+" el "+esc(UI.corta(a.fecha)||"—")+'</div><div class="politica u-mt8">'+parrafos(a.texto)+"</div>"+(a.objetivos.length?'<h3>Objetivos del SG-SST</h3><table class="tabla"><tr><th>Objetivo</th><th>Cómo se mide</th><th>Meta</th></tr>'+a.objetivos.map(e=>"<tr><td>"+esc(e.objetivo)+"</td><td>"+esc(e.indicador)+"</td><td>"+esc(e.meta)+"</td></tr>").join("")+"</table>":"")+"</div>":'<div class="card"><h2>Política de SST</h2><div class="empty">La empresa aún no ha registrado la política en el portal.</div></div>'),e.otras.forEach(e=>i.push('<details class="card"><summary><b>'+esc(e.nombre)+'</b><div class="m">Versión '+esc(e.version||"1")+" · "+esc(e.firmante||"")+" · "+esc(UI.corta(e.fecha)||"")+'</div></summary><div class="politica u-mt8">'+parrafos(e.texto)+"</div></details>"));const s=e.revision;i.push('<div class="card"><h2>Revisión por la dirección</h2>'+(s?'<div class="m">Periodo '+esc(s.periodo)+" · "+esc(UI.corta(s.fecha))+" · "+esc(s.gerente||"")+'</div><p class="u-mt8"><b>'+esc(s.conclusion||"")+"</b></p>"+(s.decisiones?"<h3>Decisiones</h3>"+parrafos(s.decisiones):""):'<div class="empty">Aún no hay una revisión por la dirección cerrada.</div>')+"</div>"),$("docsTrab").innerHTML=i.join("")}cargar();</script>
