<div class="wrap">

<!-- ═══════ INICIO ═══════ -->
<div class="screen active" id="screenInicio">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">SSTA-F-005</div>
    <h1>Asistencia a charlas</h1>
    <p>Capacitación, eventos y reuniones</p></div></div>
  </div>
  <div id="avisoServidor"></div>
  <div class="card">
    <h2>✍️ Registrar una charla</h2>
    <div class="field"><label>Lugar de trabajo</label><input type="text" id="inLugar" autocomplete="off" placeholder="Ej. Planta principal · bodega 2"></div>
    <div class="field"><label>Fecha de la charla</label><input type="date" id="inFecha"></div>
    <button class="btn amber" id="btnAbrirCharla">Abrir charla</button>
    <div class="status-msg" id="inicioStatus"></div>
  </div>
  <details class="card" id="cardRango">
    <summary style="font-family:var(--font-display);font-weight:700;font-size:var(--fs-base);cursor:pointer;">🖨️ Exportar a PDF por fechas</summary>
    <div class="mt-12">
      <div class="grid2">
        <div class="field"><label>Desde</label><input type="date" id="rgDesde"></div>
        <div class="field"><label>Hasta</label><input type="date" id="rgHasta"></div>
      </div>
      <div class="field"><label>Lugar de trabajo (vacío = todos)</label><input type="text" id="rgLugar" autocomplete="off" placeholder="Todos los lugares"></div>
      <button class="btn amber" id="btnPdfRango">Exportar</button>
      <div class="status-msg" id="rangoStatus"></div>
    </div>
  </details>
  <div class="sec-t">Semanas recientes <span id="semanasNota"></span></div>
  <div id="semanasList"><div class="status-msg">Cargando…</div></div>
  <div class="version-portal">Portal SSTA · versión v134</div>
</div>

<!-- ═══════ SEMANA ═══════ -->
<div class="screen" id="screenSemana">
  <div class="hdr">
    <a class="back" href="#" id="backSemana">← Semanas</a>
    <div class="eyebrow" id="semLugar">—</div>
    <h1 id="semTitulo">Semana</h1>
    <p id="semSub">—</p>
  </div>
  <div id="semAviso"></div>
  <div id="diasList"></div>
  <button class="btn amber" id="btnPdfSemana">🖨️ Ver / exportar PDF de la semana</button>
  <button class="btn ghost" id="btnRefrescarSemana">↻ Actualizar (ver lo de otros celulares)</button>
</div>

<!-- ═══════ DÍA ═══════ -->
<div class="screen" id="screenDia">
  <div class="hdr">
    <a class="back" href="#" id="backDia">← Semana</a>
    <div class="eyebrow" id="diaLugar">—</div>
    <h1 id="diaTitulo">—</h1>
    <p id="diaSub">SSTA-F-005 · Charla del día</p>
  </div>
  <div class="card">
    <div class="field"><label>Tema de la charla</label><textarea id="inTema" placeholder="Ej. Uso correcto del arnés y línea de vida"></textarea></div>
    <div class="grid2">
      <div class="field"><label>Hora</label><input type="time" id="inHora"></div>
      <div class="field"><label>Duración</label>
        <select id="selDuracion">
          <option value="">Elegir…</option>
          <option>5 min</option><option>10 min</option><option>15 min</option><option>20 min</option><option>30 min</option><option>45 min</option>
          <option>1 hora</option><option>1 hora 30 min</option><option>2 horas</option><option>3 horas</option><option>4 horas</option><option>5 horas</option><option>6 horas</option>
          <option value="otra">Otra…</option>
        </select>
        <input type="text" id="inDuracion" placeholder="Escribe la duración" hidden>
      </div>
    </div>
    <div class="field"><label>Ejecutor (quien da la charla)</label><input type="text" id="inEjecutor" autocomplete="off" placeholder="Nombre (escribe para buscar)"></div>
    <div class="field" id="campoEjecutor2" hidden><label>Segundo ejecutor <button type="button" id="btnQuitarEjecutor2" class="btn-quitar" style="float:right;min-height:26px;padding:2px 10px;font-size:var(--fs-menor);margin-top:-4px;">✕ Quitar</button></label>
      <input type="text" id="inEjecutor2" autocomplete="off" placeholder="Nombre (escribe para buscar)"></div>
    <button type="button" class="btn ghost" id="btnEjecutor2" style="font-size:var(--fs-menor);padding:10px;margin-top:0;">+ Agregar otro ejecutor</button>
  </div>

  <div class="sec-t">Asistentes <span id="cuentaAsis">0</span></div>
  <div id="guardadosList"></div>
  <div id="nuevosList"></div>
  <button class="btn ghost u-fs-base" id="btnAgregarAsis">+ Agregar asistente</button>
  <div class="grid2">
    <button class="btn ghost btn-compacto" id="btnTraerAts">🧭 Traer del ATS</button>
    <button class="btn ghost btn-compacto" id="btnCopiarDia">📋 Lista de otro día</button>
  </div>
  <button class="btn amber mt-16" id="btnGuardarDia">Guardar charla</button>
  <div class="status-msg" id="diaStatus"></div>
</div>

</div>
