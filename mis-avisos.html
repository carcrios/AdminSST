<script>OfflineBanner.init();const $=UI.$,ROLES={admin:"Administrador",sst:"SST",supervisor:"Supervisor / campo",comite:"Integrante de comité",consulta:"Solo consulta"},FREC=[["diario","Cada día, lo que vence hoy y mañana"],["semanal","Los lunes, lo de la semana"],["criticos","Solo lo vencido"],["no","No quiero correos"]];async function cargarMisAvisos(){let e;try{e=await SGSST.consultar({action:"misAvisos"})}catch(e){return}if(!e.ok)return;const a=$("cardAvisos");a.hidden=!1,a.innerHTML="<h2>Tus avisos por correo</h2>"+(e.correo?"":'<div class="aviso amar">Tu usuario no tiene correo: pídele al administrador que lo agregue para recibir avisos.</div>')+'<div class="field"><label for="avFrec">Cuándo</label><select id="avFrec">'+FREC.map(([a,o])=>'<option value="'+a+'"'+(e.pref.frec===a?" selected":"")+">"+esc(o)+"</option>").join("")+'</select></div><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="avFinde"'+(e.pref.finde?" checked":"")+'> También sábados y domingos</label><button type="button" class="btn ghost u-mt8" id="avGuardar">Guardar</button><span class="status-msg" id="avMsg"></span>'+(e.roles?'<h3 class="u-mt10">Por rol (lo que reciben quienes no han elegido)</h3><div class="grid2">'+Object.keys(ROLES).map(a=>'<div class="field"><label for="avR'+a+'">'+esc(ROLES[a])+'</label><select id="avR'+a+'" data-rol="'+a+'">'+FREC.map(([o,s])=>'<option value="'+o+'"'+((e.roles[a]||{}).frec===o||!e.roles[a]&&"diario"===o?" selected":"")+">"+esc(s)+"</option>").join("")+'</select><input type="text" class="u-mt8" id="avC'+a+'" data-correos="'+a+'" aria-label="Correos adicionales para '+esc(ROLES[a])+'" placeholder="Correos que también reciben (separa con coma)" value="'+esc(((e.roles[a]||{}).correos||[]).join(", "))+'"></div>').join("")+'</div><p class="ayuda">Los correos adicionales reciben el resumen de ese rol aunque no tengan usuario en el portal (por ejemplo, el gerente o el correo del COPASST).</p><button type="button" class="btn ghost" id="avRoles">Guardar por rol</button><span class="status-msg" id="avRMsg"></span>':""),$("avGuardar").addEventListener("click",async()=>{const e=await SGSST.enviar({action:"guardarMisAvisos",frec:$("avFrec").value,finde:$("avFinde").checked},null,{sinCola:!0});$("avMsg").textContent=e.ok?" ✓ Guardado":" "+(e.error||"No se pudo")}),$("avRoles")&&$("avRoles").addEventListener("click",async()=>{const e={};a.querySelectorAll("[data-rol]").forEach(a=>{e[a.dataset.rol]=a.value});const o={};a.querySelectorAll("[data-correos]").forEach(e=>{o[e.dataset.correos]=e.value});const s=await SGSST.enviar({action:"avisosPorRol",roles:e,correos:o},null,{sinCola:!0});$("avRMsg").textContent=s.ok?" ✓ Guardado":" "+(s.error||"No se pudo")})}(async()=>{UI.avisoServidor($("avisoSrv"))||(Sesion.modo()&&Sesion.yo()?cargarMisAvisos():($("msg").innerHTML='<div class="aviso info">Entra con tu usuario para elegir tus avisos.</div>',Sesion.pedir&&Sesion.pedir()))})();</script>
