<script>

const $ = UI.$;
/* PURO-INICIO (lo que sigue no toca la pantalla: lo prueba pruebas.js) */
const MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const mesMas = (m, n)=> { const p = String(m).split('-').map(Number); const d = new Date(Date.UTC(p[0], p[1] - 1 + n, 1)); return d.toISOString().slice(0, 7); };
const nombreMes = (m)=> m ? MESES_C[Number(String(m).slice(5, 7)) - 1] + ' ' + String(m).slice(0, 4) : '';
const num = (v, d)=> (Number(v) || 0).toLocaleString('es-CO', { maximumFractionDigits: d == null ? 1 : d });
const pctTxt = (p)=> Math.round(Math.abs(p)) + ' %';
const media = (l)=> l.length ? l.reduce((a, b)=> a + b, 0) / l.length : 0;
const mediana = (l)=> { if (!l.length) return 0; const s = l.slice().sort((a, b)=> a - b), k = Math.floor(s.length / 2); return s.length % 2 ? s[k] : (s[k - 1] + s[k]) / 2; };

/* ── Aspectos e impactos: catálogo (actividad → aspectos típicos → impactos típicos) ──
   Es una guía para no empezar en blanco: cada lista tiene «Otro» para escribir lo propio. */
const IMPACTOS = ['Agotamiento del recurso hídrico', 'Agotamiento de recursos naturales', 'Agotamiento de recursos no renovables', 'Contribución al cambio climático (gases de efecto invernadero)',
  'Contaminación del suelo', 'Contaminación del agua', 'Contaminación del aire', 'Contaminación auditiva', 'Afectación a la comunidad (molestias, salud)', 'Afectación a la salud de las personas',
  'Afectación a la flora y la fauna', 'Presión sobre rellenos sanitarios', 'Pérdida o erosión del suelo', 'Alteración del paisaje', 'Aprovechamiento de residuos (positivo)', 'Ahorro de recursos (positivo)'];
const ASPECTOS = [
  { a: 'Consumo de agua', g: 'Consumo de recursos', i: [0, 6] },
  { a: 'Consumo de energía eléctrica', g: 'Consumo de recursos', i: [1, 3] },
  { a: 'Consumo de combustibles (ACPM, gasolina, gas)', g: 'Consumo de recursos', i: [2, 3, 6] },
  { a: 'Consumo de papel y materiales', g: 'Consumo de recursos', i: [1, 11] },
  { a: 'Uso de sustancias químicas', g: 'Sustancias químicas', i: [4, 5, 9] },
  { a: 'Generación de residuos peligrosos (RESPEL)', g: 'Residuos', i: [4, 5, 9] },
  { a: 'Generación de residuos aprovechables (reciclables)', g: 'Residuos', i: [14, 11] },
  { a: 'Generación de residuos orgánicos', g: 'Residuos', i: [11, 6, 4] },
  { a: 'Generación de residuos ordinarios', g: 'Residuos', i: [11, 4] },
  { a: 'Generación de residuos especiales (escombros, voluminosos)', g: 'Residuos', i: [11, 13, 4] },
  { a: 'Generación de RAEE (aparatos eléctricos y electrónicos)', g: 'Residuos', i: [4, 5] },
  { a: 'Emisiones de gases de combustión (motores, plantas eléctricas)', g: 'Emisiones', i: [6, 3, 8] },
  { a: 'Emisión de humos metálicos y material particulado', g: 'Emisiones', i: [6, 8, 9] },
  { a: 'Emisión de vapores de solventes y pinturas', g: 'Emisiones', i: [6, 9, 8] },
  { a: 'Emisión de ruido', g: 'Emisiones', i: [7, 8] },
  { a: 'Olores', g: 'Emisiones', i: [8] },
  { a: 'Vertimiento de aguas residuales domésticas', g: 'Vertimientos', i: [5] },
  { a: 'Vertimiento de aguas residuales con aceites, químicos o sólidos', g: 'Vertimientos', i: [5, 4] },
  { a: 'Derrame de sustancias químicas o combustibles', g: 'Emergencias', i: [4, 5, 10], c: 'Emergencia' },
  { a: 'Fuga de gases (refrigerantes, cilindros)', g: 'Emergencias', i: [6, 3, 9], c: 'Emergencia' },
  { a: 'Incendio o explosión', g: 'Emergencias', i: [6, 8, 10], c: 'Emergencia' },
  { a: 'Remoción de cobertura vegetal o de suelo', g: 'Uso del suelo', i: [10, 12, 13] },
  { a: 'Siembra, reforestación o zonas verdes', g: 'Uso del suelo', i: [10] }];
const ACTIVIDADES = {
  'Labores administrativas (oficina)': [1, 3, 0, 6, 8, 10],
  'Cafetería, baños y aseo': [0, 7, 8, 16, 4],
  'Mantenimiento de equipos y vehículos': [5, 4, 17, 18, 6, 1, 0],
  'Soldadura y corte': [12, 1, 5, 14, 20, 19],
  'Pintura y recubrimientos': [13, 4, 5, 18, 20],
  'Obra civil y construcción': [9, 14, 12, 21, 0, 2, 6],
  'Montaje mecánico o eléctrico': [6, 9, 10, 14, 1, 5],
  'Almacenamiento de químicos y combustibles': [4, 18, 20, 19, 5],
  'Transporte y conducción de vehículos': [2, 11, 14, 18],
  'Operación de planta eléctrica o compresores': [2, 11, 14, 18, 5],
  'Lavado de equipos, piezas o vehículos': [0, 17, 4, 5],
  'Producción o proceso industrial': [1, 0, 6, 8, 5, 11, 16, 14, 15],
  'Manejo de zonas verdes': [22, 7, 4] };
const NORMAS_AMB = ['Decreto 1076 de 2015 (Único Reglamentario del Sector Ambiente)', 'Decreto 1076 de 2015, residuos peligrosos (antes Decreto 4741 de 2005)', 'Resolución 2184 de 2019 (código de colores de los residuos)',
  'Ley 1672 de 2013 (RAEE)', 'Resolución 0631 de 2015 (vertimientos)', 'Resolución 0627 de 2006 (ruido ambiental)', 'Resolución 0909 de 2008 (emisiones de fuentes fijas)', 'Ley 373 de 1997 (uso eficiente del agua)',
  'Ley 1715 de 2014 (energía)', 'Resolución 0472 de 2017 (residuos de construcción y demolición)', 'Resolución 0839 de 2023 (Registro Único Ambiental, RUA)', 'Decreto 1496 de 2018 (SGA de productos químicos)'];
const aspectoCat = (t)=> ASPECTOS.find((x)=> x.a === t) || null;
const impactosDe = (t)=> { const a = aspectoCat(t); return a ? a.i.map((k)=> IMPACTOS[k]) : []; };
const aspectosDe = (act)=> (ACTIVIDADES[act] || []).map((k)=> ASPECTOS[k].a);

/* Valoración de aspectos (método de referencia del portal; ajústalo al procedimiento de la empresa):
   valor = frecuencia × severidad × alcance (cada uno de 1 a 3). Significativo si el valor es 12 o más,
   si es una situación de emergencia con severidad 3, o si hay un requisito legal aplicable que no se cumple. */
const ESCALA = { frecuencia: ['1 · Ocasional (pocas veces al año)', '2 · Periódica (mensual o semanal)', '3 · Permanente (diaria o continua)'], severidad: ['1 · Baja (reversible, sin daño apreciable)', '2 · Media (daño reversible con medidas)', '3 · Alta (daño grave o irreversible)'], alcance: ['1 · Puntual (dentro del sitio)', '2 · Local (alrededores, vecinos)', '3 · Regional (cuenca, municipio)'] };
function valorar(v){
  v.valor = (Number(v.frecuencia) || 1) * (Number(v.severidad) || 1) * (Number(v.alcance) || 1);
  v.significancia = v.valor >= 12 || (v.condicion === 'Emergencia' && Number(v.severidad) === 3) || v.legal === 'Aplica y NO se cumple' ? 'SIGNIFICATIVO' : 'NO SIGNIFICATIVO';
  if (v.tipoImpacto === 'Positivo') v.significancia = 'POSITIVO';
  return v;
}

/* ── RESPEL: kilos, media móvil de 6 meses y categoría del generador ──
   Decreto 4741 de 2005, compilado en el Decreto 1076 de 2015 (modificado por el Decreto 766 de 2026):
   la categoría sale de la media móvil de los últimos 6 meses de lo generado (kg/mes).
   Lo que no está en kg solo se convierte si hay densidad (kg/L); si no, no se cuenta y se avisa. */
const GALON_L = 3.785411784;
const UNIDADES_RES = ['kg', 'L', 'galones', 'm³', 'unidades'];
function kgResiduo(r){
  if (r.cantidad === '' || r.cantidad == null || !isFinite(Number(r.cantidad))) return { kg: null, motivo: 'sin cantidad' };
  const c = Number(r.cantidad), u = String(r.unidad || 'kg').trim(), d = Number(r.densidad);
  if (/^kg$/i.test(u)) return { kg: c };
  if (/^(l|litros?)$/i.test(u)) return d > 0 ? { kg: c * d } : { kg: null, motivo: 'en litros sin densidad' };
  if (/^gal/i.test(u)) return d > 0 ? { kg: c * GALON_L * d } : { kg: null, motivo: 'en galones sin densidad' };
  return { kg: null, motivo: 'en ' + u + ': no se puede pasar a kg' };
}
const esRespel = (r)=> /Peligroso|RESPEL/i.test(String(r.clase || ''));
function categoriaRespel(m){
  const media = Math.round((Number(m) || 0) * 1e6) / 1e6;   // sin errores de coma flotante en los límites (9,9999999999 es 10)
  const cat = media >= 1000 ? 'Gran generador' : media >= 100 ? 'Mediano generador' : media >= 10 ? 'Pequeño generador' : 'Menos de 10 kg/mes';
  const orden = media >= 1000 ? 3 : media >= 100 ? 2 : media >= 10 ? 1 : 0;
  return { n: cat, orden, k: ['menor', 'pequeno', 'mediano', 'grande'][orden], inscribir: orden >= 1, media };
}
const RANGOS_RESPEL = [{ n: 'No obligado', d: '< 10 kg/mes' }, { n: 'Pequeño', d: '10 a < 100' }, { n: 'Mediano', d: '100 a < 1.000' }, { n: 'Grande', d: '≥ 1.000 kg/mes' }];
/** lista: residuos {fecha|mes, clase, cantidad, unidad, densidad}; mesActual 'AAAA-MM' (no cuenta: está incompleto). */
function analisisRespel(lista, mesActual, n){
  n = n || 6;
  const porMes = {}, sinKg = [];
  lista.filter(esRespel).forEach((r)=> { const k = kgResiduo(r), m = String(r.mes || String(r.fecha || '').slice(0, 7));
    if (k.kg == null) { sinKg.push(Object.assign({ motivo: k.motivo }, r)); return; }
    porMes[m] = (porMes[m] || 0) + k.kg; });
  const ventana = (fin)=> [...Array(n)].map((_, i)=> mesMas(fin, -i)).reverse();
  const mm = (fin)=> ventana(fin).reduce((a, m)=> a + (porMes[m] || 0), 0) / n;
  const fin = mesMas(mesActual, -1), act = ventana(fin), ant = ventana(mesMas(fin, -n));
  const m1 = mm(fin), m0 = mm(mesMas(fin, -n)), c1 = categoriaRespel(m1), c0 = categoriaRespel(m0);
  const hayAnt = ant.some((m)=> porMes[m] != null), hayAct = act.some((m)=> porMes[m] != null);
  const serie = [...Array(12)].map((_, i)=> mesMas(fin, i - 11)).map((m)=> ({ mes: m, kg: porMes[m] || 0, mm: mm(m) }));
  return { porMes, meses: act, media: c1.media, cat: c1, mediaAnterior: c0.media, catAnterior: hayAnt ? c0 : null, cambio: hayAnt && c0.k !== c1.k, sube: hayAnt && c1.orden > c0.orden, hayDatos: hayAct, sinKg, serie };
}
/** Registro Único Ambiental (RUA, Res. 0839 de 2023): reporte anual de lo del año anterior según el último dígito del NIT
    (sin el dígito de verificación): 0 a 4 → 1 de febrero a 15 de marzo; 5 a 9 → 15 de marzo a 30 de abril. */
function fechasRua(nit, anio){
  let s = String(nit || '').trim(); if (!s) return null;
  s = s.split('-')[0].replace(/\D/g, ''); if (!s) return null;
  if (!/-/.test(String(nit)) && s.length === 10) s = s.slice(0, 9);   // escrito sin guion: el décimo es el de verificación
  const dg = Number(s.slice(-1)), a = Number(anio);
  return dg <= 4 ? { digito: dg, desde: a + '-02-01', hasta: a + '-03-15', periodo: a - 1 } : { digito: dg, desde: a + '-03-15', hasta: a + '-04-30', periodo: a - 1 };
}
/** El próximo plazo que sigue abierto (si ya pasó el de este año, el del siguiente). */
function proximoRua(nit, hoy){ const a = Number(String(hoy).slice(0, 4)), f = fechasRua(nit, a); if (!f) return null; return String(hoy) > f.hasta ? fechasRua(nit, a + 1) : f; }

/* ── Consumos: conclusión automática ── */
const RECURSOS = [
  { k: 'agua', n: 'Agua', u: 'm³', sube: ['Revisa fugas: con todo cerrado, el medidor no debe moverse (sanitarios, llaves, tuberías, tanques).', 'Verifica si hubo más personal, lavado de equipos o cambios en el proceso ese mes.'], siempre: 'Ahorradores en llaves y sanitarios; agua lluvia para aseo donde sea viable (Ley 373 de 1997, uso eficiente del agua).' },
  { k: 'energia', n: 'Energía', u: 'kWh', sube: ['Revisa equipos encendidos fuera de horario, fugas de aire comprimido y aires acondicionados.', 'Compara con la producción o las horas trabajadas: puede ser más actividad y no desperdicio.'], siempre: 'Iluminación LED, apagado de equipos al salir y mantenimiento de motores y compresores.' },
  { k: 'combustible', n: 'Combustible', u: 'gal', sube: ['Revisa rutas, tiempos en ralentí y el mantenimiento de motores (filtros, inyectores, presión de llantas).', 'Lleva el indicador por kilómetro o por hora de equipo para ver si es más uso o más gasto.'], siempre: 'Conducción eficiente (PESV), mantenimiento preventivo y control de tanqueos.' },
  { k: 'gas', n: 'Gas', u: 'm³', sube: ['Revisa fugas (agua jabonosa en uniones) y el estado de quemadores y reguladores.'], siempre: 'Mantenimiento de gasodomésticos y equipos a gas.' },
  { k: 'papel', n: 'Papel', u: 'resmas', sube: ['Revisa qué formatos se siguen imprimiendo: el portal permite firmar y guardar en digital.'], siempre: 'Imprime solo lo necesario y a doble cara; formatos digitales.' }];
/** Suma por mes (todas las sedes o una). */
function consumosPorMes(lista, sede){
  const nrm = (s)=> String(s || '').trim().toLowerCase(), g = {};
  lista.filter((r)=> r.mes && (!sede || nrm(r.sede) === nrm(sede))).forEach((r)=> {
    const x = g[r.mes] = g[r.mes] || { mes: r.mes };
    RECURSOS.concat([{ k: 'trabajadores' }, { k: 'produccion' }]).forEach((c)=> { const v = r[c.k]; if (v !== '' && v != null && isFinite(Number(v))) x[c.k] = (x[c.k] || 0) + Number(v); });
    if (r.unidadProduccion && !x.unidadProduccion) x.unidadProduccion = r.unidadProduccion;
  });
  return Object.values(g).sort((a, b)=> a.mes.localeCompare(b.mes));
}
/** serie: [{mes, agua, energia…, trabajadores, produccion}] en orden; rec: uno de RECURSOS. */
function analizarConsumo(serie, rec){
  const k = rec.k, pts = serie.filter((x)=> typeof x[k] === 'number' && x[k] >= 0), r = { pts, textos: [], recs: [], atipicos: [], nivel: 'sin datos', pct: null, resumen: '' };
  if (pts.length < 2) { r.resumen = pts.length ? 'Un solo mes con datos de ' + rec.n.toLowerCase() + ': registra al menos dos para ver la tendencia.' : 'Sin datos de ' + rec.n.toLowerCase() + '.'; return r; }
  const ult = pts[pts.length - 1], prev = pts.slice(-13, -1), prom = media(prev.map((x)=> x[k])); r.ult = ult; r.prom = prom;
  let a, b, per;
  // Con 6 meses o más: valor típico (mediana) de los últimos 3 frente a los 3 anteriores, para que un mes raro no voltee la tendencia.
  if (pts.length >= 6) { a = mediana(pts.slice(-3).map((x)=> x[k])); b = mediana(pts.slice(-6, -3).map((x)=> x[k])); per = 'los últimos 3 meses frente a los 3 anteriores'; }
  else { a = ult[k]; b = pts[pts.length - 2][k]; per = nombreMes(ult.mes) + ' frente a ' + nombreMes(pts[pts.length - 2].mes); }
  const pct = b > 0 ? (a - b) * 100 / b : (a > 0 ? 100 : 0);
  r.pct = pct; r.nivel = Math.abs(pct) < 5 ? 'estable' : pct > 0 ? 'sube' : 'baja';
  r.textos.push('Tendencia: ' + (r.nivel === 'estable' ? 'estable (cambia menos del 5 %)' : (r.nivel === 'sube' ? 'sube ' : 'baja ') + pctTxt(pct)) + ' · ' + per + '.');
  const dp = prom > 0 ? (ult[k] - prom) * 100 / prom : null; r.difProm = dp;
  r.textos.push(nombreMes(ult.mes) + ': ' + num(ult[k]) + ' ' + rec.u + (dp == null ? '' : ', ' + (Math.abs(dp) < 5 ? 'en el promedio' : pctTxt(dp) + (dp > 0 ? ' por encima' : ' por debajo') + ' del promedio') + ' de los ' + prev.length + ' mes(es) anteriores (' + num(prom) + ' ' + rec.u + '/mes)') + '.');
  const ant = pts.find((x)=> x.mes === mesMas(ult.mes, -12));
  if (ant) { const d = ant[k] > 0 ? (ult[k] - ant[k]) * 100 / ant[k] : null; r.anual = d;
    r.textos.push('Frente a ' + nombreMes(ant.mes) + ' (mismo mes del año anterior, ' + num(ant[k]) + ' ' + rec.u + '): ' + (d == null ? 'sin base para comparar' : Math.abs(d) < 5 ? 'casi igual' : (d > 0 ? 'sube ' : 'baja ') + pctTxt(d)) + '.'); }
  else r.textos.push('Aún no hay el mismo mes del año anterior para comparar.');
  const indic = (campo, nombreU)=> { if (!(ult[campo] > 0)) return;
    const i1 = ult[k] / ult[campo], ps = prev.filter((x)=> x[campo] > 0).map((x)=> x[k] / x[campo]), i0 = ps.length ? media(ps) : null, d = i0 ? (i1 - i0) * 100 / i0 : null;
    r[campo === 'trabajadores' ? 'porTrabajador' : 'porProduccion'] = i1;
    r.textos.push('Por ' + nombreU + ': ' + num(i1, 2) + ' ' + rec.u + (i0 ? ' (antes ' + num(i0, 2) + '; ' + (Math.abs(d) < 5 ? 'igual' : (d > 0 ? 'sube ' : 'baja ') + pctTxt(d)) + ')' : '') + '.');

/** Gráfica de barras en SVG (sin librerías): barras por mes, línea opcional (media móvil o promedio) y líneas de referencia. */
function grafica(o){
  const W = 360, H = o.alto || 170, L = 40, R = 8, T = 12, B = 22, n = o.barras.length; if (!n) return '';
  const datos = o.barras.map((b)=> b.v || 0).concat((o.linea || []).filter((v)=> v != null));
  let max = Math.max(1, ...datos) * 1.15; (o.refs || []).forEach((r)=> { if (r.siempre && r.v > max) max = r.v * 1.1; });
  const y = (v)=> T + (H - T - B) * (1 - v / max), bw = (W - L - R) / n, fx = (v)=> v >= 1000 ? num(v / 1000, 1) + ' mil' : num(v, v < 10 ? 1 : 0);
  let s = '<svg class="graf" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.titulo || 'Gráfica') + '"><title>' + esc(o.titulo || '') + '</title>';
  [0, .5, 1].forEach((f)=> { const v = max / 1.15 * f, yy = y(v); s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#e3e8ee" stroke-width="1"/><text x="' + (L - 4) + '" y="' + (yy + 3).toFixed(1) + '" font-size="9.5" fill="#6b7785" text-anchor="end">' + fx(v) + '</text>'; });
  o.barras.forEach((b, i)=> { const v = b.v || 0, x = L + i * bw + bw * .16, yy = y(v);
    s += '<rect x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + (bw * .68).toFixed(1) + '" height="' + Math.max(0, H - B - yy).toFixed(1) + '" rx="2" fill="' + (b.c === 'mal' ? '#d98c7f' : b.c === 'bajo' ? '#9fb7d6' : '#7fb08f') + '"><title>' + esc(b.t || (b.l + ': ' + num(v))) + '</title></rect>' +
      '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" font-size="9.5" fill="#6b7785" text-anchor="middle">' + esc(b.l) + '</text>'; });
  let yEtq = Infinity;   // de arriba hacia abajo: una etiqueta que quedaría encima de otra no se escribe (la línea sí)
  (o.refs || []).filter((r)=> r.v <= max).sort((a, b)=> b.v - a.v).forEach((r)=> { const yy = y(r.v).toFixed(1), ver = Math.abs(Number(yy) - yEtq) >= 12;
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (r.c || '#b3261e') + '" stroke-width="1.2" stroke-dasharray="4 3"/>' + (ver ? '<text x="' + (W - R) + '" y="' + (Number(yy) - 3) + '" font-size="9.5" font-weight="700" fill="' + (r.c || '#b3261e') + '" text-anchor="end">' + esc(r.l) + '</text>' : '');
    if (ver) yEtq = Number(yy); });
  if (o.linea) { const pts = o.linea.map((v, i)=> v == null ? null : (L + i * bw + bw / 2).toFixed(1) + ',' + y(v).toFixed(1)).filter(Boolean);
    s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#1d4a7a" stroke-width="2" stroke-linejoin="round"/>' + pts.map((p)=> '<circle cx="' + p.split(',')[0] + '" cy="' + p.split(',')[1] + '" r="2.4" fill="#1d4a7a"/>').join(''); }
  return s + '</svg>';
}

function pdfResiduos(rp){
  const anio = UI.hoy().slice(0, 4), meses = [...Array(12)].map((_, i)=> anio + '-' + String(i + 1).padStart(2, '0')), R = resRes();
  const cls = CLASES.filter((c)=> c !== 'Otro').concat([...new Set(R.map((x)=> x.clase).filter((c)=> !CLASES.includes(c)))]);
  const suma = (m, c)=> R.filter((x)=> String(x.mes || String(x.fecha).slice(0, 7)) === m && x.clase === c).reduce((a, x)=> a + (kgResiduo(x).kg || 0), 0);
  const reg = respelReg() || {};
  UI.imprimir([UI.cabecera('SG-RESIDUOS', 'REGISTRO DE GENERACIÓN DE RESIDUOS ' + anio, 'RESPEL: ' + rp.cat.n + ' · media móvil ' + num(rp.media) + ' kg/mes') +
    '<table><tr><td class="l">Clase (kg)</td>' + meses.map((m)=> '<td class="l">' + MESES_C[Number(m.slice(5)) - 1] + '</td>').join('') + '<td class="l">Total kg</td></tr>' +
    cls.map((c)=> { const v = meses.map((m)=> suma(m, c)); return '<tr><td>' + esc(c) + '</td>' + v.map((x)=> '<td>' + (x ? num(x) : '') + '</td>').join('') + '<td><b>' + num(v.reduce((a, b)=> a + b, 0)) + '</b></td></tr>'; }).join('') + '</table>' +
    UI.seccion('CATEGORÍA DEL GENERADOR DE RESPEL (MEDIA MÓVIL DE 6 MESES)', UI.tablaDatos([['Meses', nombreMes(rp.meses[0]) + ' a ' + nombreMes(rp.meses[5])], ['kg por mes', rp.meses.map((m)=> nombreMes(m) + ': ' + num(rp.porMes[m] || 0)).join(' · ')], ['Media móvil', num(rp.media) + ' kg/mes'], ['Categoría', rp.cat.n + (rp.cambio ? ' (antes ' + rp.catAnterior.n.toLowerCase() + ')' : '')],
      ['Inscripción RUA', reg.inscrito ? reg.inscrito + (reg.numeroRegistro ? ' · N.º ' + reg.numeroRegistro : '') + (reg.categoriaInscrita ? ' · ' + reg.categoriaInscrita : '') : 'Sin datos'], ['Registros sin kg (no cuentan)', String(rp.sinKg.length)]]) +
      '<p style="font-size:8px;margin:4px 0 0;">Decreto 4741 de 2005 compilado en el Decreto 1076 de 2015: gran generador ≥ 1.000 kg/mes; mediano 100 a &lt; 1.000; pequeño 10 a &lt; 100; con menos de 10 kg/mes no está obligado a inscribirse. Registro Único Ambiental: Res. 0839 de 2023.</p>') +
    UI.seccion('ENTREGAS DE RESIDUOS PELIGROSOS Y RAEE', '<table><tr><td class="l">Fecha</td><td class="l">Residuo</td><td class="l">Cantidad</td><td class="l">kg</td><td class="l">Gestor</td><td class="l">Certificado</td><td class="l">Manifiesto</td></tr>' +
      R.filter((x)=> /Peligroso|RAEE/.test(x.clase) && String(x.fecha).slice(0, 4) === anio).map((x)=> '<tr><td>' + esc(UI.corta(x.fecha)) + '</td><td>' + esc(x.corriente) + '</td><td>' + esc(x.cantidad + ' ' + (x.unidad || 'kg')) + '</td><td>' + (kgResiduo(x).kg == null ? 'sin kg' : num(kgResiduo(x).kg)) + '</td><td>' + esc(x.gestor || '') + '</td><td>' + esc(x.certificado || 'FALTA') + '</td><td>' + esc(x.manifiesto || '') + '</td></tr>').join('') + '</table>')], true);
}

/* ══ Consumos ══ */
function pintarCon(panel){
  const l = de('consumo').sort((a, b)=> String(b.resumen.mes).localeCompare(String(a.resumen.mes)) || String(a.resumen.sede).localeCompare(String(b.resumen.sede)));
  const sedes = [...new Set(l.map((x)=> String(x.resumen.sede || '').trim()).filter(Boolean))];
  if (sedeSel && !sedes.includes(sedeSel)) sedeSel = '';
  const serie = consumosPorMes(l.map((x)=> x.resumen), sedeSel), conDatos = RECURSOS.filter((r)=> serie.some((x)=> typeof x[r.k] === 'number'));
  if (conDatos.length && !conDatos.some((r)=> r.k === recSel)) recSel = conDatos[0].k;
  const rec = RECURSOS.find((r)=> r.k === recSel), an = analizarConsumo(serie, rec), ult12 = an.pts.slice(-12);
  const atip = new Set(an.atipicos.map((x)=> x.mes));
  panel.innerHTML = '<div class="acciones-top"><button type="button" class="btn amber" id="nConB">+ Consumo del mes</button><button type="button" class="btn ghost" id="pCon">Informe de consumos (PDF)</button></div>' +
    (conDatos.length ? '<div class="card" id="cAnalisis"><h2>¿Qué está pasando?</h2>' +
      (sedes.length > 1 ? '<div class="field"><label>Sede</label><select id="cSede" data-sin-otro><option value="">Todas (suma)</option>' + sedes.map((s)=> '<option' + (s === sedeSel ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select></div>' : '') +
      '<div class="chips" id="cRec">' + conDatos.map((r)=> '<button type="button" data-rec="' + r.k + '" class="' + (r.k === recSel ? 'on' : '') + '">' + esc(r.n) + '</button>').join('') + '</div>' +
      '<div class="resumen-c ' + an.nivel + '" style="margin-top:10px;">' + esc(an.resumen) + '</div>' +
      (ult12.length ? grafica({ titulo: rec.n + ' por mes (' + rec.u + ')', barras: ult12.map((x)=> ({ l: MESES_C[Number(x.mes.slice(5)) - 1], v: x[rec.k], c: atip.has(x.mes) ? (x[rec.k] > mediana(ult12.map((y)=> y[rec.k])) ? 'mal' : 'bajo') : '', t: nombreMes(x.mes) + ': ' + num(x[rec.k]) + ' ' + rec.u })),
        refs: an.prom ? [{ v: an.prom, l: 'promedio ' + num(an.prom) + ' ' + rec.u, c: '#1d4a7a' }] : [] }) +
        '<div class="leyenda"><span><i style="background:#7fb08f"></i>' + esc(rec.u) + ' del mes</span><span><i style="background:#d98c7f"></i>atípico alto</span><span><i style="background:#9fb7d6"></i>atípico bajo</span><span><i style="background:#1d4a7a"></i>promedio anterior</span></div>' : '') +
      (an.textos.length ? '<ul class="conclu">' + an.textos.map((t)=> '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
      (an.recs.length ? '<div style="font-weight:700;font-size:13px;margin-top:8px;">Recomendaciones</div><ul class="recs">' + an.recs.map((t)=> '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
      '<p class="ayuda" style="margin-top:8px;">Conclusión automática con los datos registrados: revísala y complétala con lo que sabes del mes. Para el indicador por persona o por producción, anota los trabajadores y la producción de cada mes.</p></div>' : '') +
    (l.length ? l.map((x)=> item(x, esc(nombreMes(x.resumen.mes)) + (x.resumen.sede ? ' · ' + esc(x.resumen.sede) : ''), [RECURSOS.filter((r)=> x.resumen[r.k] !== '' && x.resumen[r.k] != null).map((r)=> esc(num(x.resumen[r.k])) + ' ' + r.u + ' de ' + r.n.toLowerCase()).join(' · '), x.resumen.trabajadores ? esc(x.resumen.trabajadores) + ' trabajadores' : ''])).join('') : '<div class="empty">Sin consumos registrados. Anota cada mes lo que dicen las facturas de agua, energía y combustible.</div>');
  const alistar = (v, el, pref)=> {
    const e = [], mesHoy = UI.hoy().slice(0, 7);
    if (v.mes && !/^\d{4}-\d{2}$/.test(v.mes)) e.push({ k: 'mes', l: 'Mes', m: 'no es un mes válido' });
    else if (v.mes > mesHoy) e.push({ k: 'mes', l: 'Mes', m: 'no puede ser un mes futuro' });
    RECURSOS.map((r)=> r.k).concat(['trabajadores', 'produccion']).forEach((k)=> { if (v[k] !== '' && v[k] != null && !(Number(v[k]) >= 0)) e.push({ k, l: (C_CON.find((c)=> c.k === k) || {}).l, m: 'no puede ser negativo' }); });
    if (v.trabajadores !== '' && !Number.isInteger(v.trabajadores)) e.push({ k: 'trabajadores', l: 'Trabajadores', m: 'número entero' });
    if (!RECURSOS.some((r)=> v[r.k] !== '' && v[r.k] != null)) e.push({ k: 'agua', l: 'Consumos', m: 'anota al menos un consumo (agua, energía, combustible, gas o papel)' });
    if (v.produccion !== '' && v.produccion != null && !String(v.unidadProduccion || '').trim()) e.push({ k: 'unidadProduccion', l: 'Unidad de producción', m: 'escribe la unidad' });
    v.sede = String(v.sede || '').trim();
    if (de('consumo').some((x)=> x.resumen.mes === v.mes && UI.norm(x.resumen.sede) === UI.norm(v.sede) && x.id !== v.id)) e.push({ k: 'mes', l: 'Mes', m: 'ya hay consumos de ese mes y sede: ábrelos en la lista' });
    const msg = errores(el, pref, e); if (msg) return msg;
    v.fecha = v.mes + '-01';
  };
  const abrir = (d)=> Registros.editar({ titulo: (d.nuevo ? 'Nuevo: ' : '') + 'Consumos del mes', campos: C_CON, datos: d,
    alAbrir: (el, pref)=> { const i = el.querySelector('#' + pref + 'mes'); if (i) i.max = UI.hoy().slice(0, 7); },
    borrar: d.nuevo ? null : async ()=> { const ok = await Registros.borrar(d.id, 'Borrado desde Ambiental'); if (ok) cargar(); return ok; },
    alGuardar: async (v, el, pref)=> { const e = alistar(v, el, pref); if (typeof e === 'string') return e;
      const r = await Registros.guardar('consumo', d.id, v, d.nuevo ? 0 : d.version); if (typeof r === 'string') return r; cargar(); return true; } });
  panel.querySelectorAll('[data-id]').forEach((b)=> b.addEventListener('click', async ()=> { const d = await Registros.abrir(b.dataset.id); if (d) abrir(d); }));
  if ($('cRec')) $('cRec').addEventListener('click', (e)=> { const b = e.target.closest('[data-rec]'); if (b) { recSel = b.dataset.rec; pintarCon(panel); } });
  if ($('cSede')) $('cSede').addEventListener('change', (e)=> { sedeSel = e.target.value; pintarCon(panel); });
  const ultimo = l[0] ? l[0].resumen : {};
  $('nConB').addEventListener('click', ()=> abrir({ id: SGSST.nuevoId('CNS'), nuevo: true, mes: mesMas(UI.hoy().slice(0, 7), -1), sede: ultimo.sede || '', trabajadores: ultimo.trabajadores || '', unidadProduccion: ultimo.unidadProduccion || '' }));
  $('pCon').addEventListener('click', ()=> {
    if (!serie.length) { UI.toast('No hay consumos para imprimir.'); return; }
    const s12 = serie.slice(-12);
    UI.imprimir([UI.cabecera('SG-CONSUMOS', 'SEGUIMIENTO DE CONSUMOS DE RECURSOS', (sedeSel || 'Todas las sedes') + ' · ' + nombreMes(s12[0].mes) + ' a ' + nombreMes(s12[s12.length - 1].mes)) +
      '<table><tr><td class="l">Mes</td>' + RECURSOS.map((r)=> '<td class="l">' + esc(r.n) + ' (' + esc(r.u) + ')</td>').join('') + '<td class="l">Trabajadores</td><td class="l">Producción</td></tr>' +
      s12.map((x)=> '<tr><td>' + esc(nombreMes(x.mes)) + '</td>' + RECURSOS.map((r)=> '<td>' + (x[r.k] != null ? num(x[r.k]) : '') + '</td>').join('') + '<td>' + (x.trabajadores || '') + '</td><td>' + (x.produccion != null ? num(x.produccion) + ' ' + esc(x.unidadProduccion || '') : '') + '</td></tr>').join('') + '</table>' +
      RECURSOS.map((r)=> { const a = analizarConsumo(serie, r); return a.pts.length ? UI.seccion(r.n.toUpperCase() + ': ' + a.resumen.replace(/^[^:]+: /, '').toUpperCase(), '<table><tr><td>' + a.textos.map(esc).join('<br>') + (a.recs.length ? '<br><b>Recomendaciones:</b> ' + a.recs.map(esc).join(' ') : '') + '</td></tr></table>') : ''; }).join('')], true);
  });
}
$('tabs').addEventListener('click', (e)=>{ const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
window.addEventListener('outbox-enviado', ()=> cargar());
cargar().then(async ()=> { const h = decodeURIComponent(location.hash.slice(1));
  if (['residuos', 'consumos', 'aspectos'].includes(h)) document.querySelector('#tabs [data-tab="' + h + '"]').click();
  else if (/^ASP-/.test(h)) { const d = await Registros.abrir(h); if (d) editarAspecto(d); }
  else if (/^(RES|RESPEL)-/.test(h)) document.querySelector('#tabs [data-tab="residuos"]').click();
  else if (/^CNS-/.test(h)) document.querySelector('#tabs [data-tab="consumos"]').click(); });
</script>
</body>
