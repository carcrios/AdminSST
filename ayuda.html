<script>OfflineBanner.init(),"undefined"!=typeof UpdateManager&&UpdateManager.init();const $=UI.$,FAQ=[["¿Qué pasa si no hay señal?","Todo se guarda en el celular y queda «⏳ pendiente». Se envía solo cuando vuelve la señal (el número en la barra muestra cuántos faltan). No borres los datos del navegador ni desinstales la app mientras haya pendientes."],["Olvidé la clave del portal","Pídela al responsable de SST. Si la empresa usa usuarios con nombre, el administrador te puede dar una clave temporal."],["¿Dónde quedan los datos?","En la cuenta de Google de la empresa (hojas de cálculo en su Drive), no en el celular ni en el sitio. Cada semana se hace una copia de respaldo."],["No veo el plan, los comités ni los indicadores","Están en «Sistema de gestión», al final del inicio: entra con tu usuario. Si con tu usuario no aparece un módulo, tu rol no lo tiene: pídeselo al administrador."],["¿Quién ve los datos de salud?","Solo administrador y SST. Del concepto médico se guarda si es apto y sus restricciones; nunca el diagnóstico."],["¿Cómo saco un PDF?","Toca el botón «PDF» (con el dibujo de la impresora); en la ventana de impresión elige «Guardar como PDF»."],["¿Cómo cambio de empresa?","Al pie del inicio, «cambiar», o abre el enlace de la otra empresa. Primero deben estar enviados los pendientes."],["Algo no funciona","Abre «Estado del sistema» (abajo, al final del inicio): prueba cada servidor y dice qué falla. Envíale una captura al responsable de SST."]];let rol="undefined"!=typeof Sesion&&Sesion.token&&Sesion.token()?"todos":"campo";function guiaVisible(e){return"undefined"==typeof Empresa||!(Empresa.visible&&!Empresa.visible("ayuda",e.id))&&(!e.mod||!Empresa.moduloActivo||e.mod.some(e=>Empresa.moduloActivo(e)))}$("roles").innerHTML=ROLES_AYUDA.map(([e,a])=>'<button type="button" data-rol="'+e+'"'+(e===rol?' class="on"':"")+">"+esc(a)+"</button>").join("");const visibles=()=>{const e=UI.norm($("buscar").value).trim();return GUIAS.filter(a=>guiaVisible(a)&&("todos"===rol||a.rol.includes(rol)||a.rol.includes("todos"))&&(!e||UI.norm([a.t].concat(a.pasos,a.tips||[]).join(" ")).includes(e)))};function pintar(){const e=visibles();$("lista").innerHTML=e.length?e.map(e=>'<details class="guia" id="g-'+e.id+'"><summary><span class="ic">'+e.ic+"</span><span>"+esc(e.t)+'</span></summary><div class="cuerpo"><ol>'+e.pasos.map(e=>"<li>"+esc(e)+"</li>").join("")+"</ol>"+(e.tips||[]).map(e=>'<div class="tip">💡 '+esc(e)+"</div>").join("")+'<div class="acc">'+(e.href?'<a class="btn-mini" href="'+esc(e.href)+'">Abrir el módulo →</a>':"")+(e.video?'<button type="button" class="btn-mini" style="background:var(--rojo-900);" data-video="'+esc(e.video)+'" data-t="'+esc(e.t)+'">▶ Ver video</button>':"")+"</div></div></details>").join(""):'<div class="empty">Nada con esa búsqueda.</div>'}function responder(e){if(!(e=String(e||"").trim()))return;const a=GUIA_PREGUNTAS.preguntar(e),s=a[0];s||GUIA_PREGUNTAS.reportar(e),$("pregRes").innerHTML='<div class="preg-r"><div class="q">Tu pregunta: '+esc(e)+"</div>"+(s?"<b>"+esc(s.t)+'</b><div class="r">'+esc(s.r)+"</div>"+s.a.map(([e,a])=>'<a class="btn-mini" href="'+esc(a)+'">'+esc(e)+" →</a>").join(" ")+(a.length>1?'<div class="otra">También puede servirte: '+a.slice(1).map(e=>'<button type="button" class="btn-mini gris" data-preg="'+esc(e.t)+'">'+esc(e.t)+"</button>").join(" ")+"</div>":""):'<div class="r">No encontré una respuesta para eso. Ya quedó anotada para agregar la respuesta. Mientras tanto, prueba con otras palabras (por ejemplo «permiso», «FURAT», «COPASST») o busca en el manual de abajo.</div>')+"</div>"}$("faq").innerHTML="<h2>Preguntas frecuentes</h2>"+FAQ.map(([e,a])=>"<b>"+esc(e)+'</b><div style="font-size:var(--fs-base);line-height:1.5;">'+esc(a)+"</div>").join(""),$("roles").addEventListener("click",e=>{const a=e.target.closest("[data-rol]");a&&(rol=a.dataset.rol,$("roles").querySelectorAll("button").forEach(e=>e.classList.toggle("on",e===a)),pintar())}),$("buscar").addEventListener("input",p
