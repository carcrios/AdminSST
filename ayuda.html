<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Manual de uso · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.roles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.roles button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);}
.roles button.on{background:#151b24;color:#fff;border-color:#151b24;}
details.guia{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden;}
details.guia summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:800;font-size:15px;display:flex;gap:10px;align-items:center;}
details.guia summary::-webkit-details-marker{display:none;}
details.guia summary .ic{font-size:20px;width:26px;text-align:center;flex:none;}
details.guia summary small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:1px;}
details.guia[open] summary{border-bottom:1px solid var(--line);}
.guia .cuerpo{padding:10px 16px 14px;font-size:14px;line-height:1.5;}
.guia ol{padding-left:20px;margin:4px 0 8px;} .guia li{margin-bottom:4px;}
.guia .tip{background:#f4f7fb;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0;}
.guia .acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.faq b{display:block;margin-top:10px;}
video{width:100%;max-height:70vh;background:#000;border-radius:12px;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Ayuda</div>
    <h1>Manual de uso</h1>
    <p>Cómo se usa cada módulo, paso a paso, con videos cortos</p></div></div>
  </div>
  <input type="search" class="buscar" id="buscar" placeholder="Buscar: permiso, inspección, PQRS, clave…">
  <div class="roles" id="roles"></div>
  <div id="lista"></div>
  <div class="card faq" id="faq"></div>
  <div class="version-portal">Portal SSTA · versión v125</div>
</div>
</div>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="iconos-emoji.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script>
OfflineBanner.init();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();
const $ = UI.$;
/* Cada guía: rol(es), módulo, pasos, consejos y video (videos/<id>.mp4, si se subió). */
const ROLES = [['todos', 'Todos'], ['campo', 'Trabajador y supervisor'], ['sst', 'SST'], ['comite', 'Comités'], ['gerencia', 'Gerencia']];
const GUIAS = [
  { id: 'empezar', ic: '🚀', rol: ['todos'], t: 'Entrar al portal e instalarlo en el celular', href: 'index.html', video: 'entrar',
    pasos: ['Abre el enlace que te dio el responsable de SST (o escanea el QR). Si te pide el código de la empresa, escríbelo una sola vez.', 'Si aparece 🔑 Clave, escribe la clave del portal que te dieron: queda guardada en ese celular.', 'Si la empresa usa usuarios con nombre, toca 👤 Entrar y escribe tu usuario y tu clave.', 'Para tenerlo como app: en Android, menú ⋮ → «Instalar aplicación»; en iPhone, Safari → Compartir → «Agregar a inicio».', 'El inicio tiene dos partes: «En cada jornada» (ATS, permisos, charlas, preoperacionales, reportar), que abre cualquiera, y el «Sistema de gestión» (pasos 1 a 5, cronograma del mes y pendientes), que pide entrar con tu usuario.'],
    tips: ['Sin señal también funciona: lo que guardes queda «⏳ pendiente» y se envía solo cuando vuelva la señal. No borres los datos del navegador mientras haya pendientes.'] },
  { id: 'sistema', ic: '🔐', rol: ['todos'], t: 'El Sistema de gestión: quién ve qué', href: 'index.html', video: '',
    pasos: ['Sin usuario ni contraseña solo se hacen el preoperacional y los reportes (evento, PQRS y «¿Qué peligros ves?»): están arriba, en el inicio.', 'Todo lo demás (permisos de trabajo, ATS, charlas, inspección de EPP, personal autorizado, tablero de permisos y el SG-SST) está en «Sistema de gestión»: toca «Entrar con mi usuario» y escribe tu usuario y tu contraseña.', 'Cada rol ve sus módulos: Supervisor, la obra (permisos, ATS, charlas, EPP, tablero) y control (inspecciones, plan de acción, contratistas, emergencias…); Comité, COPASST, Convivencia, inspecciones e indicadores; Solo consulta, el tablero de la gerencia, indicadores y evidencias; Administrador y SST, todo.', 'Si abres un módulo que tu rol no tiene, el portal te lo dice; pídeselo al administrador.', 'Para salir, «Salir» junto a tu nombre, arriba del sistema de gestión.', 'Con tu usuario aparece abajo una barra: Inicio, Permisos (el tablero), Gestión y Ayuda.'],
    tips: ['Si la empresa aún no activa los usuarios, el sistema de gestión se abre con «Abrir el sistema de gestión» y lo ve cualquiera con el enlace: el administrador lo cierra activando los usuarios en «Usuarios y respaldo».', 'Los datos de salud los protege el servidor: solo Administrador y SST, aunque alguien abra la página.'] },
  { id: 'permisos', ic: '📝', rol: ['campo'], t: 'Permisos de trabajo (alturas, caliente, confinados, izajes, eléctrico)', href: 'index.html', video: '',
    pasos: ['En el inicio, entra al permiso que necesitas.', 'Diligencia cada sección: trabajo, ubicación, personal, verificaciones y peligros. Debajo de cada cédula aparece si la persona está habilitada.', 'Firman en pantalla quienes deben firmar y toca Guardar: el permiso queda con su código.', 'Para cerrarlo al terminar, abre el permiso con su código y registra el cierre con su firma.'],
    tips: ['Si alguien no está habilitado (curso vencido, sin concepto médico), el permiso lo advierte antes de guardar.'] },
  { id: 'ats', ic: '🧭', rol: ['campo'], t: 'ATS y charlas de seguridad', href: 'ats.html', video: '',
    pasos: ['ATS: elige el cliente o centro, la tarea y el personal; revisa los pasos, peligros y controles que propone y ajústalos.', 'Firma el equipo y guarda. Desde el ATS puedes abrir el permiso que requiera la tarea.', 'Charlas: en Asistencia a charlas registra el tema y que cada asistente firme; queda el formato de asistencia en PDF.'] },
  { id: 'reportes', ic: '⚠️', rol: ['campo', 'sst'], t: 'Reportar un acto, una condición, un incidente o un accidente', href: 'reportes.html', video: 'reporte',
    pasos: ['Entra a Reportes e investigación → Reportar.', 'Elige qué pasó, dónde y cuándo; describe lo que viste y agrega una foto si puedes. Se puede reportar de forma anónima.', 'Guarda: SST lo recibe y, si hace falta, lo convierte en una acción.', 'SST: en un accidente de trabajo el portal lleva el plazo del FURAT (2 días hábiles) y la investigación (15 días), con equipo investigador, causas y firmas.'],
    tips: ['Reportar una condición insegura a tiempo es la mejor forma de evitar un accidente.'] },
  { id: 'inspecciones', ic: '🔍', rol: ['campo', 'sst', 'comite'], t: 'Hacer una inspección', href: 'inspecciones.html', video: 'inspeccion',
    pasos: ['En Inspecciones toca ✅ Inspeccionar y elige qué vas a inspeccionar (extintor, arnés, área…) y cuál del inventario.', 'Responde cada pregunta C (cumple), NC (no cumple) o NA. «Todo cumple» marca lo que falte.', 'En cada NC escribe qué encontraste y toma la foto.', 'Escribe tu nombre, firma y guarda. Cada NC se vuelve una acción del plan de acción.', 'Gerenciales y del COPASST: elige ese «Tipo de inspección» y anota a los participantes; cada uno firma.'],
    tips: ['La pestaña Cronograma muestra lo programado frente a lo hecho en el año; toca una celda para hacer esa inspección.'] },
  { id: 'preop', ic: '🔧', rol: ['campo', 'sst'], t: 'Preoperacional de un equipo', href: 'preoperacional.html', video: '',
    pasos: ['En el inicio, «En cada jornada» → Preoperacional → el equipo (o escanea la etiqueta QR del equipo).', 'Responde cada página como en el formulario de siempre; las preguntas con * son obligatorias. Tu nombre se elige del personal y trae la cédula.', 'Si algo está «Malo», escribe qué encontraste y toma la foto.', 'Envía: queda en el SG-SST aunque no haya señal (se envía al volver). Si hubo algo en mal estado, puedes crear la acción para corregirlo.'],
    tips: ['En Preoperacionales → Registros están todos, con su PDF y las respuestas en Excel (como la hoja de Google).', 'El de condiciones de salud solo lo ven Administrador y SST.'] },
  { id: 'pendientes', ic: '📌', rol: ['todos'], t: 'Mis pendientes y el resumen del lunes', href: 'index.html', video: '',
    pasos: ['En el inicio, debajo del cronograma del mes, está «Pendientes»: lo vencido primero y luego lo que vence pronto, de todos los módulos.', 'Con tu usuario, «Míos» muestra lo que tiene tu nombre como responsable; «Todos», lo de la empresa.', 'Toca un pendiente para abrirlo en su módulo y resolverlo.', 'Cada lunes llega a tu correo el resumen de lo tuyo para la semana (si tu usuario tiene correo).'],
    tips: ['Para que algo te llegue a ti, tu nombre debe estar igual en el responsable de la acción o de la actividad del plan.', 'Los exámenes médicos solo los ven Administrador y SST.'] },
  { id: 'plananual', ic: '🗓️', rol: ['sst'], t: 'Armar el plan anual de trabajo según la empresa', href: 'plan-anual.html', video: '',
    pasos: ['Primero define el perfil de la empresa (trabajadores y clase de riesgo) y carga la matriz de peligros, los químicos y los vehículos si los hay.', 'En Plan anual de trabajo toca «Armar el plan según la empresa»: cada actividad propuesta dice por qué (estándar, peligro de la matriz, inventario).', 'Desmarca lo que no aplique y crea el plan; luego ajusta meses y responsables.', 'Con un plan ya hecho, «Sugerencias según la empresa» propone solo lo que le falta.'],
    tips: ['Las actividades del mes aparecen en los pendientes de su responsable y en su correo del lunes.'] },
  { id: 'cierre', ic: '📅', rol: ['sst', 'gerencia'], t: 'Cerrar el mes y sacar el informe mensual', href: 'cierre-mes.html', video: '',
    pasos: ['En los últimos días del mes (o los primeros del siguiente) abre Cerrar el mes.', 'La lista de cierre revisa sola los datos de indicadores, los accidentes, las inspecciones, el COPASST, el plan anual, las acciones y el personal habilitado.', 'Resuelve lo que puedas con el botón Abrir de cada punto; lo que quede pendiente se explica en las observaciones.', 'Toca Cerrar el mes y saca el Informe del mes (PDF) para la gerencia, el COPASST o la ARL.'],
    tips: ['Si el mes no se cierra, aparece en los pendientes del inicio hasta el día 10 del mes siguiente.'] },
  { id: 'qr', ic: '🏷️', rol: ['sst', 'campo'], t: 'Etiquetas QR en los equipos', href: 'inspecciones.html', video: '',
    pasos: ['En Inspecciones toca «Etiquetas QR del inventario» (o, dentro de un equipo, «Etiqueta QR»).', 'Imprime la hoja, recorta y pega cada etiqueta en su equipo (mejor plastificada).', 'Para inspeccionar, escanea la etiqueta con la cámara del celular: se abre la inspección de ese equipo.'],
    tips: ['En el sitio de tu marca, la etiqueta lleva el código de la empresa: un celular nuevo entra a la empresa correcta sin escribirlo.'] },
  { id: 'evidencias', ic: '🗂️', rol: ['sst'], t: 'Carpeta de evidencias y autoevaluación', href: 'evidencias.html', video: '',
    pasos: ['Abre Carpeta de evidencias: cada estándar mínimo que le aplica a la empresa aparece con la evidencia que ya está en el portal.', 'Filtra por «Falta» o «Incompletos» y usa Abrir para ir al módulo donde se resuelve.', 'Saca el Índice de evidencias (PDF) para el auditor.', 'Con «Llevar a una autoevaluación» se crea la autoevaluación con la evidencia escrita y «cumple» sugerido en lo que está al día: revisa cada estándar y guarda.'],
    tips: ['El porcentaje de la carpeta es una guía, no la calificación oficial de la Res. 0312.'] },
  { id: 'plan', ic: '✅', rol: ['sst', 'campo', 'comite'], t: 'Plan de acción: avances y cierre', href: 'plan-accion.html', video: 'plan',
    pasos: ['Todas las acciones (de inspecciones, reportes, auditorías, comités, calidad…) llegan aquí con su origen.', 'Abre una acción y anota los avances.', 'Al terminarla, ciérrala con la evidencia (foto o documento) y di si fue eficaz.', 'El correo diario avisa lo que vence o se venció.'] },
  { id: 'habilitacion', ic: '🪪', rol: ['sst'], t: 'Personal habilitado y carga desde Excel', href: 'habilitacion.html', video: 'excel',
    pasos: ['Agrega cada persona con su cédula y registra la fecha de cada requisito (seguridad social, inducción, concepto médico, cursos); el vencimiento se calcula solo.', 'Para cargar a muchos: «⬆️ Cargar desde Excel» → descarga la plantilla, llénala, copia las celdas con los títulos y pégalas.', 'Antes de guardar verás qué es nuevo, qué actualiza y qué tiene errores; las filas con error no se cargan.'],
    tips: ['Del concepto médico solo se guarda si es apto y sus restricciones, nunca el diagnóstico. La misma carga desde Excel está en Inspecciones (inventario), Sustancias químicas, Matriz legal y Matriz de peligros.'] },
  { id: 'peligros', ic: '☢️', rol: ['sst'], t: 'Matriz de peligros (GTC 45)', href: 'peligros.html', video: '',
    pasos: ['+ Identificar peligro: proceso, tarea, clasificación, descripción y controles existentes.', 'Elige ND, NE y NC: el portal calcula NP, NR, el nivel y la aceptabilidad.', 'Escribe las medidas de intervención por jerarquía; las que estén «por implementar» van al plan de acción.', 'Registra la revisión anual con la participación de los trabajadores.'] },
  { id: 'quimicos', ic: '⚗️', rol: ['sst'], t: 'Sustancias químicas (SGA y Res. 773)', href: 'quimicos.html', video: 'quimicos',
    pasos: ['+ Agregar sustancia: nombre, dónde se almacena, pictogramas (como en la etiqueta), ficha de datos de seguridad y etiqueta. Adjunta la ficha en PDF.', 'Almacenamiento: muestra por cada lugar qué no puede ir junto (p. ej. inflamable con comburente, ácido con base) y por qué.', 'Res. 773: semáforo de las obligaciones; «Acciones de lo que falta» las crea en el plan.'] },
  { id: 'kit', ic: '📄', rol: ['sst'], t: 'Kit documental: política, reglamento, procedimientos', href: 'documentos.html', video: 'kit',
    pasos: ['Completa los datos de la empresa (representante legal, ARL, responsable del SG-SST).', 'Abre cada documento con 👁 Ver; sácalo en 🖨️ PDF o en 📝 Word para ajustarlo.', 'Cuando esté revisado, ✓ Aprobar: queda en el listado maestro con su versión y próxima revisión. Adjunta allí la versión firmada.'],
    tips: ['Cada documento dice qué estándar de la Res. 0312 cubre y si le aplica a la empresa (7, 21 o 60).'] },
  { id: 'auditorias', ic: '🧾', rol: ['sst'], t: 'Autoevaluación de estándares mínimos y auditorías', href: 'auditorias.html', video: '',
    pasos: ['Define el perfil (trabajadores y clase de riesgo): el portal sabe si te aplican 7, 21 o 60 estándares.', '+ Nueva → la autoevaluación que te aplica (sale de primera) o una auditoría (Decreto 1072, ISO 45001, 14001, 9001, RUC, de clientes).', 'Califica cada ítem; las pistas muestran lo que el portal ya sabe. Cada no cumplimiento crea su acción.'] },
  { id: 'calidad', ic: '🏅', rol: ['sst', 'gerencia'], t: 'Calidad: PQRS, no conformes y satisfacción', href: 'calidad.html', video: 'calidad',
    pasos: ['PQRS: registra la queja o reclamo del cliente; el plazo de respuesta se calcula solo. Escribe la respuesta para cerrarla; si procede, crea la acción correctiva.', 'No conforme: registra lo que no cumple, su tratamiento y su costo.', 'Satisfacción: registra cada encuesta; el portal calcula la satisfacción y el NPS. Hay encuesta en blanco para imprimir.', 'Contexto, riesgos y objetivos de calidad completan la ISO 9001.'] },
  { id: 'ambiental', ic: '🌱', rol: ['sst'], t: 'Gestión ambiental', href: 'ambiental.html', video: '',
    pasos: ['Aspectos e impactos: valora cada aspecto; los significativos van al plan de acción.', 'Residuos: registra cada entrega con su certificado; el portal calcula la categoría de generador de RESPEL.', 'Consumos: agua, energía y combustible de cada mes, con gráfica.'] },
  { id: 'comites', ic: '🤝', rol: ['comite'], t: 'COPASST y Comité de Convivencia', href: 'copasst.html', video: '',
    pasos: ['Conforma el comité por periodo con sus integrantes; el portal dice cuántos requiere la norma.', 'Cada reunión: acta con asistentes, quórum, temas, compromisos (van al plan de acción) y firmas.', 'Convivencia: las quejas quedan cifradas con la clave del comité; solo sus integrantes las abren.'] },
  { id: 'gerencia', ic: '📊', rol: ['gerencia'], t: 'Tablero de la gerencia', href: 'gerencia.html', video: 'gerencia',
    pasos: ['Todo el SG-SST en una pantalla con semáforos: autoevaluación, accidentalidad, plan de acción, comités, programas y más.', 'El informe en PDF sirve para la revisión por la dirección.', 'Desde el 15 de noviembre recuerda el reporte anual de estándares mínimos.'] },
  { id: 'usuarios', ic: '👥', rol: ['sst'], t: 'Usuarios, roles y respaldo', href: 'usuarios.html', video: '',
    pasos: ['El primer administrador entra con el código que da el servidor (▶ codigoAdministrador).', 'Crea los usuarios con su rol: administrador, SST, supervisor, comité o consulta. Cada uno cambia su clave temporal al entrar.', 'La bitácora muestra quién hizo qué; el respaldo semanal copia las hojas a Drive.'] },
  { id: 'informe', ic: '📈', rol: ['sst', 'gerencia'], t: 'Informe del SG-SST con gráficas y sugerencias', href: 'informe.html', video: '',
    pasos: ['Abre «Informe del SG-SST» (o desde el tablero de la gerencia, «Informe con gráficas y sugerencias»).', 'Elige el periodo: mes, trimestre o año. El informe junta todo lo registrado: accidentalidad, plan anual, plan de acción, inspecciones, comités, emergencias, químicos, ambiental, contratistas, EPP y evidencias de los estándares.', 'Revisa las sugerencias de mejora (alta, media y baja): cada una dice por qué sale, la norma y dónde se arregla. Con «Crear acción» queda en el plan de acción con responsable y fecha; «Abrir el módulo» te lleva a corregirlo.', '«Sacar el PDF con firma»: escribe el responsable del SG-SST, las conclusiones y firma en la pantalla (o deja la línea para firmar a mano). Sale con el resumen, las gráficas, las sugerencias y las cifras.'],
    tips: ['La gerencia (rol consulta) ve el informe sin datos de salud individual; el área SST sí los ve.', 'Sirve como insumo para la revisión por la dirección y la rendición de cuentas (Dec. 1072 de 2015, arts. 2.2.4.6.31 y 2.2.4.6.8).'] }
];
const FAQ = [['¿Qué pasa si no hay señal?', 'Todo se guarda en el celular y queda «⏳ pendiente». Se envía solo cuando vuelve la señal (el número en la barra muestra cuántos faltan). No borres los datos del navegador ni desinstales la app mientras haya pendientes.'],
  ['Olvidé la clave del portal', 'Pídela al responsable de SST. Si la empresa usa usuarios con nombre, el administrador te puede dar una clave temporal.'],
  ['¿Dónde quedan los datos?', 'En la cuenta de Google de la empresa (hojas de cálculo en su Drive), no en el celular ni en el sitio. Cada semana se hace una copia de respaldo.'],
  ['No veo el plan, los comités ni los indicadores', 'Están en «Sistema de gestión», al final del inicio: entra con tu usuario. Si con tu usuario no aparece un módulo, tu rol no lo tiene: pídeselo al administrador.'],
  ['¿Quién ve los datos de salud?', 'Solo administrador y SST. Del concepto médico se guarda si es apto y sus restricciones; nunca el diagnóstico.'],
  ['¿Cómo saco un PDF?', 'Toca el botón 🖨️; en la ventana de impresión elige «Guardar como PDF».'],
  ['¿Cómo cambio de empresa?', 'Al pie del inicio, «cambiar», o abre el enlace de la otra empresa. Primero deben estar enviados los pendientes.'],
  ['Algo no funciona', 'Abre Estado (arriba en el inicio): prueba cada servidor y dice qué falla. Envíale una captura al responsable de SST.']];
let rol = 'todos';
$('roles').innerHTML = ROLES.map(([k, n])=> '<button type="button" data-rol="' + k + '"' + (k === rol ? ' class="on"' : '') + '>' + esc(n) + '</button>').join('');
const visibles = ()=> { const q = UI.norm($('buscar').value).trim();
  return GUIAS.filter((g)=> (rol === 'todos' || g.rol.includes(rol) || g.rol.includes('todos')) && (!q || UI.norm([g.t].concat(g.pasos, g.tips || []).join(' ')).includes(q))); };
function pintar(){
  const l = visibles();
  $('lista').innerHTML = l.length ? l.map((g)=> '<details class="guia" id="g-' + g.id + '"><summary><span class="ic">' + g.ic + '</span><span>' + esc(g.t) + '</span></summary><div class="cuerpo"><ol>' + g.pasos.map((x)=> '<li>' + esc(x) + '</li>').join('') + '</ol>' +
    (g.tips || []).map((x)=> '<div class="tip">💡 ' + esc(x) + '</div>').join('') + '<div class="acc">' + (g.href ? '<a class="btn-mini" href="' + esc(g.href) + '">Abrir el módulo →</a>' : '') + (g.video ? '<button type="button" class="btn-mini" style="background:#8a2a1c;" data-video="' + esc(g.video) + '" data-t="' + esc(g.t) + '">▶ Ver video</button>' : '') + '</div></div></details>').join('')
    : '<div class="empty">Nada con esa búsqueda.</div>';
}
$('faq').innerHTML = '<h2>Preguntas frecuentes</h2>' + FAQ.map(([q, r])=> '<b>' + esc(q) + '</b><div style="font-size:14px;line-height:1.5;">' + esc(r) + '</div>').join('');
$('roles').addEventListener('click', (e)=> { const b = e.target.closest('[data-rol]'); if (!b) return; rol = b.dataset.rol; $('roles').querySelectorAll('button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
$('buscar').addEventListener('input', pintar);
document.addEventListener('click', (e)=> { const b = e.target.closest('[data-video]'); if (!b) return;
  const m = UI.modal('<h3>' + esc(b.dataset.t) + '</h3><video controls playsinline preload="metadata" src="videos/' + encodeURIComponent(b.dataset.video) + '.mp4"></video><div class="status-msg" data-msg></div><button type="button" class="btn ghost" data-cerrar>Cerrar</button>', true);

if (location.hash.length > 1) { const d = document.getElementById('g-' + location.hash.slice(1)); if (d) { d.open = true; d.scrollIntoView(); } }
