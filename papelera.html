<script>OfflineBanner.init(),"undefined"!=typeof UpdateManager&&UpdateManager.init();const $=a=>document.getElementById(a),NOMBRES={reporte:"Reporte",accion:"Acción",inspeccion:"Inspección",equipo:"Equipo",trabajador:"Persona",reunion:"Reunión",mes:"Mes",auditoria:"Auditoría",documento:"Documento",preop:"Preoperacional",plantillaform:"Plantilla"};let filas=[];function pintar(){const a=$("papBuscar").value.trim().toLowerCase(),e=filas.filter(e=>!a||-1!==(e.titulo+" "+e.tipo+" "+e.motivo+" "+e.responsable).toLowerCase().indexOf(a));e.length?($("lista").innerHTML=e.map(a=>'<div class="pap-item"><div><b>'+esc(a.titulo||a.id)+"</b><small>"+esc(NOMBRES[a.tipo]||a.tipo)+(a.fecha?" · "+esc(a.fecha):"")+" · eliminado el "+esc(formatSavedAt(a.borradoEn))+(a.motivo?" · "+esc(a.motivo):"")+'</small></div><button type="button" class="btn btn-sec" data-id="'+esc(a.id)+'">Recuperar</button></div>').join(""),$("lista").querySelectorAll("[data-id]").forEach(a=>a.addEventListener("click",async()=>{a.disabled=!0,a.textContent="Recuperando…";const e=await SGSST.enviar({action:"restaurar",id:a.dataset.id});e&&e.ok?(UI.toast(e.enCola?"Se recupera al volver la señal.":"Recuperado. Volvió a las listas."),filas=filas.filter(e=>e.id!==a.dataset.id),pintar()):(UI.toast(e&&e.error||"No se pudo recuperar.","mal"),a.disabled=!1,a.textContent="Recuperar")}))):$("lista").innerHTML='<div class="empty">'+(filas.length?"Nada coincide con la búsqueda.":"La papelera está vacía. Lo que se elimine aparece aquí durante 30 días.")+"</div>"}async function cargar(){if(UI.avisoServidor($("avisoSrv")))return void($("lista").innerHTML='<div class="empty">Sin servidor no hay papelera.</div>');const a=await SGSST.consultar({action:"papelera"}).catch(a=>({ok:!1,error:a.message}));a&&a.ok?(filas=a.rows||[],pintar()):$("lista").innerHTML='<div class="empty">'+esc(a&&a.error||"No se pudo leer la papelera.")+"</div>"}$("papBuscar").addEventListener("input",pintar),cargar();</script>
