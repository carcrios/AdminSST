<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Responder la inducción · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.pasos-ind{display:flex;gap:6px;margin:4px 0 14px;}
.pasos-ind span{flex:1;height:6px;border-radius:4px;background:#dfe5ea;}
.pasos-ind span.on{background:#1d6b45;}
.paso-tit{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.tema{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;background:#fff;display:block;cursor:pointer;}
.tema.on{border-color:#1d6b45;background:#f1faf4;}
.tema > div{display:flex;gap:10px;align-items:flex-start;}
.tema input{width:22px;height:22px;flex:0 0 22px;margin-top:1px;}
.tema b{display:block;font-size:15px;line-height:1.3;}
.tema small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:4px;}
.pq{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;}
.pq.sin-resp{border-color:#d99a8f;background:#fff8f6;}
.pq .q{font-weight:700;font-size:15px;line-height:1.35;margin-bottom:8px;}
.pq .op{display:flex;flex-direction:column;gap:7px;}
.pq .op button{min-height:46px;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:#fcfbf8;padding:9px 12px;font:inherit;font-size:14px;line-height:1.3;color:var(--ink);cursor:pointer;}
.pq .op button.on{border-color:#1f3b57;background:#eaf1f8;font-weight:700;}
.pq.revisada .op button.correcta{border-color:#1d6b45;background:#e3f4ea;}
.pq.revisada .op button.on:not(.correcta){border-color:#b3261e;background:#fdf1ef;}
.cuenta{font-size:13px;color:var(--muted);margin:-4px 0 10px;}
.nota{font-size:40px;font-weight:800;text-align:center;margin:6px 0 2px;}
.listo{text-align:center;padding:22px 8px;}
.listo .ic{font-size:44px;}
.nav-ind{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:6px;}
.nav-ind .btn{margin:0;}
</style>
</head>
<body>
<div class="wrap">
<div class="screen active" id="scrInd">
  <div class="hdr">
    <a class="back" href="index.html">← Portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Inducción en SST</div>
    <h1>Responder la inducción</h1>
    <p>Tus datos, los temas, una evaluación corta y tu firma. Toma unos 10 minutos.</p></div></div>
  </div>
  <div id="avisoSrv"></div>
  <div class="pasos-ind" id="barra" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div id="paso"></div>
  <div class="status-msg" id="msg"></div>
  <div class="nav-ind"><button type="button" class="btn ghost" id="atras">← Atrás</button><button type="button" class="btn amber" id="sig">Siguiente →</button></div>
  <div class="version-portal">Portal SSTA · versión v119</div>
</div>
<div class="screen" id="scrListo"><div class="card listo" id="listo"></div></div>
</div>
<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script src="induccion-banco.js"></script>
<script src="autorizacion-datos.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

/* Inducción que responde la persona desde el inicio, sin usuario (v109).
   El área SST la ve en Sistema de gestión → Inducción y reinducción, marcada «respondida en el portal».
   El servidor (tipo induccion, solo crear) pone la fecha de hoy, acota los textos y recalcula la nota. */
const $ = UI.$;
const d = { tipoInduccion: 'Inducción', nombre: '', cedula: '', cargo: '', empresa: '', dicto: '', temas: [], resp: {} };
let paso = 0, revisada = false;
const NOMBRES = ['Tus datos', 'Los temas', 'Evaluación', 'Tu firma'];
const visitante = ()=> d.tipoInduccion === 'Visitante';
function barra(){ $('barra').querySelectorAll('span').forEach((s, i)=> s.classList.toggle('on', i <= paso)); }
function pintar(){
  barra(); $('msg').textContent = ''; $('atras').style.visibility = paso ? 'visible' : 'hidden';
  $('sig').textContent = paso === 3 ? 'Enviar mi inducción' : 'Siguiente →';
  const c = $('paso');
  if (paso === 0) {
    c.innerHTML = '<div class="card"><div class="paso-tit">Paso 1 de 4 · ' + NOMBRES[0] + '</div>' +
      '<div class="field"><label>¿Qué inducción es? *</label><select id="fTipo">' + TIPOS.map((t)=> '<option' + (t === d.tipoInduccion ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Nombre completo *</label><input type="text" id="fNom" maxlength="120" autocomplete="name" value="' + esc(d.nombre) + '"></div>' +
      '<div class="grid2"><div class="field"><label>Cédula *</label><input type="text" id="fCed" inputmode="numeric" value="' + esc(d.cedula) + '"></div>' +
      '<div class="field"><label>Cargo</label><input type="text" id="fCargo" maxlength="80" value="' + esc(d.cargo) + '"></div></div>' +
      '<div class="field" id="fEmpF"><label>Empresa (si eres contratista o visitante)</label><input type="text" id="fEmp" maxlength="120" value="' + esc(d.empresa) + '"></div>' +
      '<div class="field"><label>¿Quién te dio la inducción? (opcional)</label><input type="text" id="fDicto" maxlength="120" value="' + esc(d.dicto) + '" placeholder="Nombre de la persona de SST o del supervisor"></div></div>';
    Valida.soloNombre($('fNom')); Valida.soloDigitos($('fCed'), 10);
  } else if (paso === 1) {
    c.innerHTML = '<div class="card"><div class="paso-tit">Paso 2 de 4 · ' + NOMBRES[1] + '</div><p class="ayuda">Lee cada tema y márcalo cuando lo hayas entendido. Si tienes dudas, pregúntale al área SST antes de seguir.</p>' +
      TEMAS.map((t, i)=> '<label class="tema' + (d.temas.indexOf(t) !== -1 ? ' on' : '') + '"><div><input type="checkbox" data-t="' + i + '"' + (d.temas.indexOf(t) !== -1 ? ' checked' : '') + '><span><b>' + esc(t) + '</b>' +
        (DETALLE_TEMAS[t] ? '<small>' + esc(DETALLE_TEMAS[t]) + '</small>' : '') + '</span></div></label>').join('') +
      '<button type="button" class="btn ghost" id="todos">Los leí y entendí todos</button></div>';
    // El contenedor se reutiliza en los otros pasos: si ya no están los temas, no hace nada.
    const marcar = ()=> { if (!c.querySelector('[data-t]')) return; d.temas = TEMAS.filter((t, i)=> c.querySelector('[data-t="' + i + '"]').checked); c.querySelectorAll('.tema').forEach((l)=> l.classList.toggle('on', l.querySelector('input').checked)); };
    c.addEventListener('change', marcar);
    $('todos').addEventListener('click', ()=> { c.querySelectorAll('[data-t]').forEach((x)=> { x.checked = true; }); marcar(); });
  } else if (paso === 2) {
    if (visitante()) { c.innerHTML = '<div class="card"><div class="paso-tit">Paso 3 de 4 · ' + NOMBRES[2] + '</div><p>Los visitantes no presentan evaluación. Sigue a la firma.</p></div>'; return; }
    c.innerHTML = '<div class="card"><div class="paso-tit">Paso 3 de 4 · ' + NOMBRES[2] + '</div><p class="ayuda">Elige una respuesta en cada pregunta. Apruebas con ' + APRUEBA + '% o más.</p><div class="cuenta" id="cuenta"></div>' +
      PREGUNTAS.map((q, i)=> '<div class="pq' + (revisada ? ' revisada' : '') + '" data-q="' + i + '"><div class="q">' + (i + 1) + '. ' + esc(q[0]) + '</div><div class="op">' +
        q[1].map((o, j)=> '<button type="button" data-o="' + j + '" class="' + (d.resp[i] === j ? 'on' : '') + (revisada && j === q[2] ? ' correcta' : '') + '">' + esc(o) + '</button>').join('') + '</div></div>').join('') + '</div>';
    const contar = ()=> { $('cuenta').textContent = Object.keys(d.resp).length + ' de ' + PREGUNTAS.length + ' respondidas'; };
    c.addEventListener('click', (e)=> { const b = e.target.closest('[data-o]'); if (!b || revisada) return; const pq = b.closest('[data-q]'), i = +pq.dataset.q;
      d.resp[i] = +b.dataset.o; pq.querySelectorAll('[data-o]').forEach((x)=> x.classList.toggle('on', x === b)); pq.classList.remove('sin-resp'); contar(); });
    contar();
  } else {
    c.innerHTML = '<div class="card"><div class="paso-tit">Paso 4 de 4 · ' + NOMBRES[3] + '</div>' + (visitante() ? '' : resultadoHTML()) +
      '</div>' + AutorizacionDatos.html('aut') +
      '<div class="card"><div class="field"><label>Firma de ' + esc(d.nombre) + ' *</label>' + UI.padHTML('fFirma') + '</div>' +
      '<p class="ayuda">Con tu firma declaras que recibiste la inducción, entendiste los temas y que lo que marcaste en la autorización de datos es tu decisión.</p></div>';
    UI.activarPad('fFirma');
  }
}
function nota(){ const bien = PREGUNTAS.filter((q, i)=> d.resp[i] === q[2]).length; return Math.round(bien * 100 / PREGUNTAS.length); }
function resultadoHTML(){ const n = nota(), ok = n >= APRUEBA;
  return '<div class="nota" style="color:' + (ok ? 'var(--ok)' : 'var(--mal)') + ';">' + n + '%</div><p style="text-align:center;margin:0 0 12px;">' + (ok ? '¡Aprobaste la evaluación!' : 'No alcanzaste el ' + APRUEBA + '%.') + '</p>'; }
function validar(){
  const prob = [];
  if (paso === 0) {
    d.tipoInduccion = $('fTipo').value; d.nombre = $('fNom').value.trim(); d.cedula = $('fCed').value.trim(); d.cargo = $('fCargo').value.trim(); d.empresa = $('fEmp').value.trim(); d.dicto = $('fDicto').value.trim();
    return Valida.revisar($('paso'), [{ el: $('fNom'), etiqueta: 'Nombre completo', error: Valida.nombre(d.nombre) }, { el: $('fCed'), etiqueta: 'Cédula', error: Valida.cedula(d.cedula) },
      { el: $('fEmp'), etiqueta: 'Empresa', error: (d.tipoInduccion === 'Inducción de contratista' || visitante()) && !d.empresa ? 'falta' : '' }], null);
  }
  if (paso === 1 && d.temas.length < TEMAS.length) {
    const faltan = TEMAS.filter((t)=> d.temas.indexOf(t) === -1);
    prob.push('Marca los temas que faltan: ' + faltan.join('; '));
  }
  if (paso === 2 && !visitante()) {
    const sin = PREGUNTAS.map((q, i)=> i).filter((i)=> d.resp[i] == null);
    $('paso').querySelectorAll('.pq').forEach((el)=> el.classList.toggle('sin-resp', sin.indexOf(+el.dataset.q) !== -1));
    if (sin.length) { prob.push('Faltan las preguntas ' + sin.map((i)=> i + 1).join(', ')); const p0 = $('paso').querySelector('.pq.sin-resp'); if (p0) p0.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    else if (!revisada && nota() < APRUEBA) {
      revisada = true; pintar();
      $('msg').innerHTML = '<div class="aviso amar">Tu nota es ' + nota() + '% (apruebas con ' + APRUEBA + '%). En verde está la respuesta correcta de cada pregunta. Repásalas y vuelve a intentarlo.</div>' +
        '<button type="button" class="btn" id="otraVez">Volver a intentarlo</button><button type="button" class="btn ghost" id="asi">Enviar así (quedará como no aprobada)</button>';
      $('otraVez').addEventListener('click', ()=> { revisada = false; d.resp = {}; pintar(); window.scrollTo(0, 0); });
      $('asi').addEventListener('click', ()=> { paso = 3; pintar(); window.scrollTo(0, 0); });
      return ['__revisar'];
    }
  }
  return prob;
}
async function enviar(){
  const firma = UI.firma('fFirma');
  const faltan = [AutorizacionDatos.falta('aut'), firma ? '' : 'Tu firma'].filter(Boolean);
  if (faltan.length) { $('msg').innerHTML = '<div class="v-resumen"><b>Falta:</b><br>• ' + faltan.map(esc).join('<br>• ') + '</div>'; return; }
  if (!SGSST.url()) { $('msg').textContent = 'El portal no tiene servidor configurado. Pídele al área SST que haga tu inducción.'; return; }
  const respuestas = visitante() ? [] : PREGUNTAS.map((q, i)=> ({ pregunta: q[0], respuesta: q[1][d.resp[i]], correcta: d.resp[i] === q[2] }));
  const doc = { tipoInduccion: d.tipoInduccion, fecha: UI.hoy(), nombre: d.nombre, cedula: d.cedula, cargo: d.cargo, empresa: d.empresa, dicto: d.dicto, temas: d.temas,
    preguntas: respuestas.length, respuestas, puntaje: visitante() ? '' : nota(), aprueba: APRUEBA, resultado: visitante() ? 'REALIZADA' : nota() >= APRUEBA ? 'APROBADA' : 'REPROBADA',
    vence: '', firma, autoservicio: true, autorizacionDatos: AutorizacionDatos.valor('aut'), autorizaDatos: AutorizacionDatos.valor('aut').general ? 'SÍ' : 'NO', autorizaSalud: AutorizacionDatos.valor('aut').sensibles ? 'SÍ' : 'NO' };
  const b = $('sig'); b.disabled = true; $('msg').textContent = 'Enviando…';
  const r = await SGSST.enviar({ action: 'guardar', tipo: 'induccion', id: SGSST.nuevoId('IND'), doc });
  b.disabled = false;
  if (!r.ok) { $('msg').textContent = 'No se pudo enviar: ' + (r.error || 'intenta de nuevo'); return; }
  $('listo').innerHTML = '<div class="ic">✓</div><h2>¡Gracias, ' + esc(d.nombre.split(' ')[0]) + '!</h2>' +
    '<p>' + (r.enCola ? 'Tu inducción quedó guardada en este celular y se envía sola cuando haya señal.' : 'Tu inducción llegó al área SST.') + '</p>' +
    (visitante() ? '' : '<p><b>' + doc.resultado.replace('REPROBADA', 'NO APROBADA') + '</b> · nota ' + doc.puntaje + '%</p>') +
    '<a class="btn ghost" href="index.html">Volver al portal</a><button type="button" class="btn" id="otra">Responder otra persona</button>';
  document.querySelectorAll('.screen').forEach((s)=> s.classList.toggle('active', s.id === 'scrListo')); window.scrollTo(0, 0);
  $('otra').addEventListener('click', ()=> location.reload());
}
$('sig').addEventListener('click', async ()=> {
  if (paso === 3) { await enviar(); return; }
  const prob = validar();
  if (prob[0] === '__revisar') return;
  if (prob.length) { $('msg').innerHTML = '<div class="v-resumen"><b>Para seguir falta:</b><br>• ' + prob.map(esc).join('<br>• ') + '</div>'; return; }
  paso++; pintar(); window.scrollTo(0, 0);
});
$('atras').addEventListener('click', ()=> { if (paso === 0) return; paso--; revisada = false; pintar(); window.scrollTo(0, 0); });
UI.avisoServidor($('avisoSrv'));
pintar();
</script>
</body>
</html>
