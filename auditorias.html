<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#151b24">
<title>Auditorías · Portal SSTA</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="sgsst.css">
<style>
.preg .op button.on[data-v="OBS"]{background:var(--amber);border-color:var(--amber);color:#151b24;}
.preg .ref{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.03em;margin-right:4px;}
.preg .peso{float:right;font-size:11px;color:var(--muted);font-weight:700;}
.preg .pista{font-size:11.5px;color:#1d4a7a;background:#eef5fd;border-radius:7px;padding:5px 8px;margin:6px 0 0;line-height:1.35;}
.preg .extra{margin-top:8px;}
.preg .extra input,.preg .extra textarea,.preg .extra select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px;font-family:inherit;background:#fcfbf8;margin-top:5px;}
.preg.es-obs{background:#fffbef;margin:0 -15px;padding:10px 15px;}
.grupo-h{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px;}
.barra{height:12px;border-radius:7px;background:#eef1f4;overflow:hidden;margin:6px 0 2px;}
.barra > div{height:100%;background:var(--ok);}
.barra.mal > div{background:var(--mal);} .barra.pronto > div{background:var(--amber);}
.puntaje{position:sticky;top:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06);}
.puntaje b{font-family:var(--font-display);font-size:20px;}
.faltan-r{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px;font-size:12.5px;color:#7a1c14;font-weight:600;}
.faltan-r.ok{color:var(--ok);}
.faltan-r button{font:inherit;font-size:12px;font-weight:700;border:1px solid #f0c8c1;background:#fdf1ef;color:#9c2a1f;border-radius:7px;padding:2px 7px;min-height:30px;cursor:pointer;}
.preg.sin-resp{border-left:4px solid #e3b2aa;}
.preg.bloq{opacity:.55;background:#f3f5f7;}
.preg.bloq .no-aplica-g{font-size:12.5px;color:var(--muted);margin-top:5px;}
.preg.resaltar{box-shadow:0 0 0 3px #c79100;}
.ciclos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);margin-top:4px;}
.hall{border:1px solid var(--line);border-left:4px solid var(--mal);border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:13px;line-height:1.4;}
.hall.obs,.hall.om{border-left-color:var(--amber);}
.hall small{display:block;color:var(--muted);font-size:11.5px;}
</style>
</head>
<body>
<div class="wrap">

<div class="screen active" id="scrLista">
  <div class="hdr">
    <a class="back" href="index.html">← Volver al portal</a>
    <div class="marca-titulo"><span class="marca" role="img" aria-label="Logo de la empresa"></span><div><div class="eyebrow">Gestión SST</div>
    <h1>Auditorías</h1>
    <p>Programa anual, estándares mínimos, auditoría interna, ISO 45001 y clientes</p></div></div>
  </div>
  <div id="avisoSrv"></div>
  <div id="avisoCopia"></div>
  <div id="alertas"></div>
  <div class="kpis" id="kpis"></div>
  <div class="tabs" id="tabs">
    <button type="button" class="on" data-tab="programa">Programa <span id="anioTab"></span></button>
    <button type="button" data-tab="todas">Todas <span class="n" id="nTodas">0</span></button>
    <button type="button" data-tab="hallazgos">Acciones abiertas <span class="n" id="nHall">0</span></button>
  </div>
  <div id="fLista"></div>
  <div id="lista"><div class="empty">Cargando…</div></div>
  <button type="button" class="btn amber" id="btnNueva">+ Programar auditoría</button>
  <button type="button" class="btn ghost" id="btnPrograma">🖨️ Programa anual de auditorías (PDF)</button>
  <div class="version-portal">Portal SSTA · versión v125</div>
</div>

<div class="screen" id="scrAud"></div>

</div>

<script src="empresa.js"></script>
<script src="empresa-motor.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="iconos-emoji.js"></script>
<script src="valida.js"></script>
<script src="sgsst-ui.js"></script>
<script src="registros.js"></script>
<script src="auditorias-plantillas.js"></script>
<script>
OfflineBanner.init();
OutboxBadge.init();
if (typeof Outbox !== 'undefined') Outbox.flush();
if (typeof UpdateManager !== 'undefined') UpdateManager.init();

const $ = UI.$;
const ORIGENES_AUD = ['Auditoría', 'Autoevaluación Res. 0312'];
 let perfil = null;
let filas = [], acciones = [], tab = 'programa', aud = null, pistas = {}, pistasCargadas = false;
/* v109: filtro de cada lista (lo dejan las cifras de arriba). */
const fAud = { programa: '', todas: '', hallazgos: '' };
window.filtrarKpi = (v)=> { fAud[tab] = v || ''; pintar(); };
const chipsAud = (ops)=> { $('fLista').innerHTML = UI.chipsFiltro(ops, fAud[tab]); $('fLista').querySelectorAll('[data-f]').forEach((b)=> b.addEventListener('click', ()=> window.filtrarKpi(b.dataset.f))); };

function show(id){ document.querySelectorAll('.screen').forEach((s)=>s.classList.toggle('active', s.id === id)); window.scrollTo(0, 0); }
const anio = ()=> UI.hoy().slice(0, 4);
const fechaDe = (x)=> x.resumen.fechaEjecucion || x.resumen.fechaPlan || '';
function claseDe(x){
  if (x.estado === 'CERRADA') return 'ok';
  if (x.estado === 'PROGRAMADA') return UI.semaforo(x.resumen.fechaPlan, 15);
  return 'pronto';
}

async function cargar(){
  if (UI.avisoServidor($('avisoSrv'))) { $('lista').innerHTML = ''; $('btnNueva').disabled = true; return; }
  const [r, ra] = await Promise.all([SGSST.listar('auditoria,empresa'), SGSST.listar('accion')]);
  UI.avisoCopia($('avisoCopia'), r);
  perfil = await UI.perfilEmpresa(r.rows);
  filas = r.rows.filter((x)=> x.tipo === 'auditoria'); acciones = ra.rows.filter((x)=> ORIGENES_AUD.indexOf(x.resumen.origen) !== -1);
  pintar();
}
function pintar(){
  const a = anio(), delAnio = filas.filter((x)=> fechaDe(x).slice(0, 4) === a);
  const hechas = delAnio.filter((x)=> x.estado === 'CERRADA');
  const ab = acciones.filter((x)=> x.estado !== 'CERRADA');
  const ultima = filas.filter((x)=> /^RES0312/.test(x.resumen.plantilla) && x.estado === 'CERRADA' && x.resumen.puntaje != null).sort((p, q)=> String(fechaDe(q)).localeCompare(String(fechaDe(p))))[0];
  const v = ultima ? valoracion0312(ultima.resumen.puntaje) : null;
  $('anioTab').textContent = a; $('nTodas').textContent = filas.length; $('nHall').textContent = ab.length;
  const venAb = ab.filter((x)=> x.resumen.fechaCompromiso && x.resumen.fechaCompromiso < UI.hoy());
  window.verUltima0312 = ()=> { if (ultima) abrir(ultima.id); };
  $('kpis').innerHTML = '<div class="kpi" data-ir="tab:programa|filtro:' + (hechas.length < delAnio.length ? 'pendientes' : '') + '"><div class="v">' + hechas.length + ' / ' + delAnio.length + '</div><div class="n">auditorías del programa ' + a + ' realizadas</div></div>' +
    '<div class="kpi ' + (venAb.length ? 'mal' : '') + '" data-ir="tab:hallazgos|filtro:' + (venAb.length ? 'vencidas' : '') + '"><div class="v">' + ab.length + '</div><div class="n">acciones de auditoría abiertas</div></div>' +
    '<div class="kpi ' + (v ? v.c : '') + '" data-ir="' + (ultima ? 'fn:verUltima0312' : 'tab:todas') + '"><div class="v">' + (ultima ? String(ultima.resumen.puntaje.toFixed(1)).replace('.', ',') + ' %' : '—') + '</div><div class="n">última autoevaluación Res. 0312</div>' + (v ? '<div class="f">' + esc(v.n) + ' · ' + esc(UI.corta(fechaDe(ultima))) + '</div>' : '') + '</div>';
  const al = [];
  // Qué estándares le aplican a la empresa (perfil: trabajadores y clase de riesgo)
  al.push(perfil ? '<div class="aviso info">🏢 ' + esc(perfil.trabajadores) + ' trabajadores · riesgo ' + esc(perfil.claseRiesgo) + ' → le aplican <b>' + esc(UI.textoGrupo(Number(perfil.grupo0312))) + '</b>. <button type="button" class="btn-mini" id="btnPerfil">Cambiar</button></div>'
    : '<div class="aviso amar">🏢 Falta el perfil de la empresa (número de trabajadores y clase de riesgo): define si le aplican 7, 21 o 60 estándares. <button type="button" class="btn-mini" id="btnPerfil">Definirlo</button></div>');
  if (!filas.some((x)=> !/^RES0312/.test(x.resumen.plantilla) && x.estado === 'CERRADA' && fechaDe(x) >= Festivos.sumarDias(UI.hoy(), -365))) al.push('<div class="aviso amar">No hay una auditoría del SG-SST cerrada en los últimos 12 meses. La auditoría es anual y se planifica con el COPASST (Decreto 1072, art. 2.2.4.6.29; estándares 6.1.2 y 6.1.4).</div>');
  if (!filas.some((x)=> /^RES0312/.test(x.resumen.plantilla) && fechaDe(x).slice(0, 4) === a)) al.push('<div class="aviso info">La autoevaluación de estándares mínimos se hace cada año (Res. 0312, art. 28). Prográmala con «+ Programar auditoría».</div>');
  $('alertas').innerHTML = al.join('');
  if ($('btnPerfil')) $('btnPerfil').addEventListener('click', ()=> UI.editarPerfil(()=> cargar()));
  const pendientes = delAnio.filter((x)=> x.estado !== 'CERRADA'), atrasadas = filas.filter((x)=> x.estado === 'PROGRAMADA' && x.resumen.fechaPlan < UI.hoy());
  if (tab === 'programa') chipsAud(delAnio.length ? [['', 'Todas (' + delAnio.length + ')'], ['pendientes', 'Por realizar (' + pendientes.length + ')']] : []);
  else if (tab === 'todas') chipsAud(filas.length ? [['', 'Todas (' + filas.length + ')'], ['atrasadas', 'Atrasadas (' + atrasadas.length + ')']] : []);
  else chipsAud(ab.length ? [['', 'Todas (' + ab.length + ')'], ['vencidas', 'Vencidas (' + venAb.length + ')']] : []);
  if (!delAnio.length && tab === 'programa' || !filas.length && tab === 'todas' || !ab.length && tab === 'hallazgos') $('fLista').innerHTML = '';
  const l = tab === 'programa' ? (fAud.programa === 'pendientes' ? pendientes : delAnio) : tab === 'todas' ? (fAud.todas === 'atrasadas' ? atrasadas : filas) : null;
  if (tab === 'hallazgos') {
    const h = UI.hoy(), lst = (fAud.hallazgos === 'vencidas' ? venAb : ab).slice().sort((p, q)=> String(p.resumen.fechaCompromiso).localeCompare(String(q.resumen.fechaCompromiso)));
    $('lista').innerHTML = lst.length ? lst.map((x)=>{ const s = x.resumen, c = UI.semaforo(s.fechaCompromiso, 5);
      return '<a class="item ' + c + '" href="plan-accion.html#' + encodeURIComponent(x.id) + '"><div class="fila"><div><div class="t">' + esc(s.accion) + '</div><div class="m">' + esc(s.hallazgo) + '</div><div class="m">👤 ' + esc(s.responsable) + ' · ' + esc(s.origenRef) + '</div></div>' +
        '<span class="chip ' + c + '">' + (s.fechaCompromiso < h ? 'Venció ' : '') + esc(UI.corta(s.fechaCompromiso)) + '</span></div></a>'; }).join('') : '<div class="empty">' + (fAud.hallazgos ? 'Ninguna acción de auditoría vencida ✓' : 'No hay acciones de auditoría abiertas.') + '</div>';
    return;
  }
  const ord = l.slice().sort((p, q)=> String(fechaDe(p)).localeCompare(String(fechaDe(q))) * (tab === 'todas' ? -1 : 1));
  $('lista').innerHTML = ord.length ? ord.map((x)=>{
    const s = x.resumen, c = claseDe(x), hh = s.hallazgos || {};
    const res = /^RES0312/.test(s.plantilla) && s.puntaje != null ? String(s.puntaje.toFixed(1)).replace('.', ',') + ' % · ' + s.valoracion : [hh.ncMayor && hh.ncMayor + ' NC mayor', hh.ncMenor && hh.ncMenor + ' NC menor', hh.obs && hh.obs + ' obs.', hh.om && hh.om + ' OM'].filter(Boolean).join(' · ');
    return '<button type="button" class="item ' + c + '" data-id="' + esc(x.id) + '"><div class="fila"><div><div class="t">' + esc(s.titulo || s.tipoAuditoria) + '</div>' +
      '<div class="m">' + esc(s.tipoAuditoria) + (s.auditor ? ' · 👤 ' + esc(s.auditor) : '') + (x.pendiente ? ' · <span class="pend">⏳ pendiente de enviar</span>' : '') + '</div>' +
      (x.estado === 'EN EJECUCIÓN' ? '<div class="m">Avance: ' + s.respondidos + ' de ' + s.items + ' puntos</div>' : '') + (res && x.estado === 'CERRADA' ? '<div class="m">Resultado: ' + esc(res) + '</div>' : '') + '</div>' +
      '<span class="chip ' + c + '">' + esc(x.estado === 'PROGRAMADA' ? (s.fechaPlan < UI.hoy() ? 'Atrasada ' : 'Programada ') + UI.corta(s.fechaPlan) : x.estado === 'CERRADA' ? 'Cerrada ' + UI.corta(s.fechaEjecucion) : 'En ejecución') + '</span></div></button>';
  }).join('') : '<div class="empty">' + (fAud[tab] ? 'Nada pendiente en este filtro ✓' : tab === 'programa' ? 'No hay auditorías programadas para ' + anio() + '.' : 'No hay auditorías.') + '</div>';
}

/* ── Programar / abrir ── */
function nuevaAuditoria(){
  // De las autoevaluaciones 0312 se ofrece la que le aplica a la empresa (las otras, abajo).
  const g = perfil ? Number(perfil.grupo0312) : 60;
  const rango = (k)=> { const x = PLANTILLAS_AUDITORIA[k].grupo0312; return x === g ? 0 : x ? 2 : 1; };
  const orden = Object.keys(PLANTILLAS_AUDITORIA).sort((a, b)=> rango(a) - rango(b));
  const m = UI.modal('<h3>¿Qué auditoría?</h3><div class="chips" id="plChips">' + orden.map((k)=> { const P = PLANTILLAS_AUDITORIA[k], otra = P.grupo0312 && P.grupo0312 !== g;
    return '<button type="button" data-p="' + k + '"' + (otra ? ' style="opacity:.55;"' : '') + '>' + esc(P.nombre) + (P.grupo0312 === g ? ' ← la que le aplica' : '') + '</button>'; }).join('') + '</div>' +
    (perfil ? '' : '<p class="ayuda">Define el perfil de la empresa para saber si le aplican 7, 21 o 60 estándares.</p>') + '<button type="button" class="btn ghost" data-cerrar>Cancelar</button>');
  m.el.querySelector('#plChips').addEventListener('click', (e)=>{
    const b = e.target.closest('[data-p]'); if (!b) return; m.cerrar();
    const P = PLANTILLAS_AUDITORIA[b.dataset.p];
    aud = { id: SGSST.nuevoId('AUD'), nuevo: true, plantilla: b.dataset.p, tipoAuditoria: P.corto, titulo: P.corto + ' ' + anio(), fechaPlan: Festivos.sumarDias(UI.hoy(), 15), fechaEjecucion: '',
      estado: 'PROGRAMADA', auditor: { nombre: '', cargo: '', independiente: true }, equipo: '', alcance: '', objetivo: '', criterios: P.criterios, areas: '', copasst: { participo: false, nombre: '' },
      items: P.items.map((i)=> ({ id: i[0], grupo: i[1], ref: i[2], valor: i[3], texto: i[4], r: '', just: '', evid: '', sev: 'ncMenor', hdesc: '' })),
      hallazgos: [], auditados: '', conclusiones: '', fortalezas: '', firmaAuditor: '', firmaAuditado: '', auditadoNombre: '', acciones: [] };
    pintarAud();
  });
}
async function abrir(id){
  if (SGSST._lsGet('ssta-sgsst-pend', {})[id]) { UI.toast('Esta auditoría tiene cambios sin enviar desde este equipo. Ábrela cuando se envíen.', 'mal'); return; }
  $('scrAud').innerHTML = '<div class="hdr"><a class="back" href="#" data-volver>← Volver</a><h1>Abriendo…</h1></div>'; show('scrAud');
  const d = await SGSST.doc(id);
  if (!d) { const f = filas.find((x)=> x.id === id); $('scrAud').innerHTML += '<div class="aviso">No se pudo abrir' + (f && f.pendiente ? ' (aún está pendiente de enviar)' : '') + '.</div>'; return; }
  aud = d; pintarAud();
}

/* Lo que el portal ya sabe, como pista al lado de cada estándar (no responde por ti). */
async function cargarPistas(){
  pistas = {};
  try {
    const r = await SGSST.listar('comite,reporte,mes,inspeccion,auditoria,reunion,accion,trabajador,politica,plananual,peligro,revmatriz,sustancia,medicion,emergencia,simulacro,legal,documento,cambio,proveedor,revision,rendicion,examen,perfil,psico,sve,induccion,entrega,eppcargo');
    const rows = r.rows, h = UI.hoy(), hace12 = Festivos.sumarDias(h, -365);
    const cm = (k)=> rows.find((x)=> x.tipo === 'comite' && x.resumen.comite === k);
    const reu = (k)=> rows.filter((x)=> x.tipo === 'reunion' && x.resumen.comite === k && x.resumen.tipo === 'Ordinaria' && x.resumen.fecha >= hace12).length;
    const est = (c)=> !c || !c.resumen.periodo ? 'no está conformado en el portal' : (c.resumen.periodo.fin >= h ? 'periodo vigente hasta ' + UI.corta(c.resumen.periodo.fin) : 'periodo VENCIDO el ' + UI.corta(c.resumen.periodo.fin));
    const cop = cm('copasst'), con = cm('convivencia');
    pistas['1.1.6'] = 'COPASST: ' + est(cop) + ' · ' + reu('copasst') + ' reuniones ordinarias en 12 meses.';
    pistas['1.1.7'] = 'COPASST: ' + (cop ? cop.resumen.capacitaciones : 0) + ' capacitación(es) registradas.';
    pistas['1.1.8'] = 'Convivencia: ' + est(con) + ' · ' + reu('convivencia') + ' reuniones ordinarias en 12 meses.';
    const at = rows.filter((x)=> x.tipo === 'reporte' && x.resumen.clase === 'Accidente de trabajo' && x.resumen.fecha >= hace12);
    const aTiempo = at.filter((x)=> x.resumen.furat && x.resumen.furat.radicado && x.resumen.furat.fecha && x.resumen.furat.fecha <= Festivos.sumarHabiles(x.resumen.fecha, 2)).length;
    pistas['3.2.1'] = at.length ? at.length + ' accidente(s) en 12 meses; FURAT dentro de 2 días hábiles: ' + aTiempo + '.' : 'Sin accidentes registrados en 12 meses.';
    const inv = rows.filter((x)=> x.tipo === 'reporte' && /Accidente|Incidente/.test(x.resumen.clase) && x.resumen.fecha >= hace12);
    pistas['3.2.2'] = inv.length ? inv.filter((x)=> x.resumen.investigacion && x.resumen.investigacion.estado === 'CERRADA').length + ' de ' + inv.length + ' incidentes/accidentes con investigación cerrada.' : 'Sin incidentes ni accidentes en 12 meses.';
    const meses = rows.filter((x)=> x.tipo === 'mes' && x.resumen.mes >= hace12.slice(0, 7)).length;
    ['3.3.1', '3.3.2', '3.3.6'].forEach((k)=> { pistas[k] = 'Indicadores: ' + meses + ' mes(es) con datos en los últimos 12.'; });
    pistas['6.1.1'] = pistas['3.3.1'];
    const ins12 = rows.filter((x)=> x.tipo === 'inspeccion' && x.resumen.fecha >= hace12), ins = ins12.length;
    const insCop = ins12.filter((x)=> x.resumen.tipoInspeccion === 'COPASST').length, insGer = ins12.filter((x)=> x.resumen.tipoInspeccion === 'Gerencial').length;
    pistas['4.2.4'] = ins + ' inspección(es) planeadas en 12 meses' + (insCop || insGer ? ': ' + insCop + ' del COPASST y ' + insGer + ' gerencial(es), con participantes y firmas.' : ' (ninguna marcada como del COPASST: regístralas con tipo «COPASST» y sus participantes).') + ' El cronograma programado frente a ejecutado está en Inspecciones.';
    const trab = rows.filter((x)=> x.tipo === 'trabajador' && x.resumen.activo !== false), conInd = trab.filter((x)=> x.resumen.req && x.resumen.req.induccion && x.resumen.req.induccion.vence >= h).length;
    if (trab.length) pistas['1.2.2'] = 'Personal habilitado: ' + conInd + ' de ' + trab.length + ' con inducción vigente.';
    const ind12 = rows.filter((x)=> x.tipo === 'induccion' && String(x.fecha) >= hace12);
    if (ind12.length) pistas['1.2.2'] = (pistas['1.2.2'] ? pistas['1.2.2'] + ' ' : '') + ind12.length + ' inducción(es)/reinducción(es) en 12 meses (' + ind12.filter((x)=> x.estado === 'APROBADA').length + ' aprobadas con evaluación).';
    const ent = rows.filter((x)=> x.tipo === 'entrega'), mat = rows.filter((x)=> x.tipo === 'eppcargo');
    pistas['4.2.6'] = mat.length || ent.length ? mat.length + ' cargo(s) con matriz de EPP; ' + ent.filter((x)=> String(x.fecha) >= hace12).length + ' entrega(s) con firma en 12 meses (' + ent.filter((x)=> x.resumen.capacitado === false).length + ' sin capacitación en el uso).' : 'Sin matriz ni entregas de EPP en el portal.';
    const aud12 = rows.filter((x)=> x.tipo === 'auditoria' && !/^RES0312/.test(x.resumen.plantilla) && x.estado === 'CERRADA' && (x.resumen.fechaEjecucion || '') >= hace12);
    pistas['6.1.2'] = aud12.length ? aud12.length + ' auditoría(s) cerradas en 12 meses.' : 'Sin auditorías cerradas en 12 meses en el portal.';
    const acc = rows.filter((x)=> x.tipo === 'accion');
    const accAT = acc.filter((x)=> /Accidente|Incidente/.test(x.resumen.origen));
    pistas['7.1.3'] = accAT.length + ' acción(es) del plan salen de incidentes/accidentes (' + accAT.filter((x)=> x.estado === 'CERRADA').length + ' cerradas).';
    pistas['7.1.1'] = acc.filter((x)=> /Inspección/.test(x.resumen.origen)).length + ' acción(es) salen de inspecciones; ' + acc.length + ' en total en el plan.';
    // Planeación, salud y documental (v93)
    const de = (t)=> rows.filter((x)=> x.tipo === t), ultimo = (t, f)=> de(t).map((x)=> x.resumen[f]).filter(Boolean).sort().pop() || '';
    const pol = de('politica').sort((p, q)=> String(q.resumen.fechaFirma).localeCompare(String(p.resumen.fechaFirma)))[0];

  const th = hl.length ? '<table><tr><th style="width:4%">N°</th><th style="width:15%">Tipo</th><th style="width:14%">Requisito</th><th>Hallazgo</th><th style="width:16%">Acción</th></tr>' + hl.map((h, i)=> '<tr><td class="a">' + (i + 1) + '</td><td>' + esc(es0312 ? 'No cumple' : TIPOS_HALLAZGO[h.tipo] || h.tipo) + '</td><td>' + esc(h.requisito || '') + '</td><td>' + esc(h.descripcion) + (h.evidencia ? '<br><span class="nota">Evidencia: ' + esc(h.evidencia) + '</span>' : '') + '</td><td>' + esc(h.accionId || '—') + '</td></tr>').join('') + '</table>' : '<table><tr><td>Sin hallazgos.</td></tr></table>';
  const fotosH = hl.filter((h)=> h.fotos && h.fotos.length).map((h)=> UI.fotosHoja(h.fotos)).join('');
  hojas.push(UI.cabecera('SG-AUDITORIA', 'INFORME DE AUDITORÍA', a.titulo) + UI.seccion(es0312 ? 'PLAN DE MEJORAMIENTO (ESTÁNDARES QUE NO SE CUMPLEN)' : 'HALLAZGOS', th + fotosH) +
    UI.seccion('PERSONAS AUDITADAS', UI.textoLargo(a.auditados)) + UI.seccion('FORTALEZAS', UI.textoLargo(a.fortalezas)) + UI.seccion('CONCLUSIONES', UI.textoLargo(a.conclusiones)) +
    UI.seccion('FIRMAS', '<table><tr><td style="width:50%;height:60px;vertical-align:bottom;">' + UI.firmaHoja(a.firmaAuditor) + '<br><b>' + esc(a.auditor.nombre) + '</b><br>Auditor líder</td><td style="vertical-align:bottom;">' + UI.firmaHoja(a.firmaAuditado) + '<br><b>' + esc(a.auditadoNombre || '') + '</b><br>Responsable auditado</td></tr></table>'));
  UI.imprimir(hojas);
}
$('btnPrograma').addEventListener('click', ()=>{
  const a = anio(), l = filas.filter((x)=> fechaDe(x).slice(0, 4) === a).sort((p, q)=> String(p.resumen.fechaPlan).localeCompare(String(q.resumen.fechaPlan)));
  if (!l.length) { UI.toast('No hay auditorías en el programa de ' + a + '.'); return; }
  const t = '<table><tr><th style="width:4%">N°</th><th style="width:20%">Auditoría</th><th>Alcance</th><th style="width:10%">Planeada</th><th style="width:14%">Auditor</th><th style="width:10%">Estado</th><th style="width:10%">Ejecutada</th><th style="width:14%">Resultado</th></tr>' +
    l.map((x, i)=> { const s = x.resumen, hh = s.hallazgos || {}; return '<tr><td class="a">' + (i + 1) + '</td><td>' + esc(s.titulo) + '<br><span class="nota">' + esc(s.tipoAuditoria) + '</span></td><td>' + esc(s.alcance || '') + '</td><td>' + esc(UI.corta(s.fechaPlan)) + '</td><td>' + esc(s.auditor || '') + '</td><td>' + esc(x.estado) + '</td><td>' + esc(UI.corta(s.fechaEjecucion)) + '</td><td>' +
      esc(x.estado !== 'CERRADA' ? '' : /^RES0312/.test(s.plantilla) && s.puntaje != null ? String(s.puntaje.toFixed(1)).replace('.', ',') + ' % ' + s.valoracion : (hh.ncMayor || 0) + ' NC mayor, ' + (hh.ncMenor || 0) + ' NC menor, ' + (hh.obs || 0) + ' obs.') + '</td></tr>'; }).join('') + '</table>';
  UI.imprimir([UI.cabecera('SG-AUDITORIA-PROGRAMA', 'PROGRAMA ANUAL DE AUDITORÍAS ' + a, 'Corte ' + UI.corta(UI.hoy()) + ' · ' + l.filter((x)=> x.estado === 'CERRADA').length + ' de ' + l.length + ' realizadas') + t], true);
});

$('btnNueva').addEventListener('click', nuevaAuditoria);
$('tabs').addEventListener('click', (e)=>{ const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x)=> x.classList.toggle('on', x === b)); pintar(); });
$('lista').addEventListener('click', (e)=>{ const b = e.target.closest('[data-id]'); if (b) abrir(b.dataset.id); });
document.addEventListener('click', (e)=>{ const v = e.target.closest('[data-volver]'); if (v) { e.preventDefault(); show('scrLista'); pintar(); } });
window.addEventListener('outbox-enviado', ()=> cargar());
/* Desde la carpeta de evidencias (evidencias.html): autoevaluación nueva con la evidencia ya escrita
   y «cumple» sugerido en lo que está al día. Quien audita revisa y confirma cada estándar. */
function desdeEvidencias(){
  let sug = null; try { sug = JSON.parse(sessionStorage.getItem('ssta-autoeval-sugerida') || 'null'); sessionStorage.removeItem('ssta-autoeval-sugerida'); } catch (e) {}
  const P = sug && PLANTILLAS_AUDITORIA[sug.plantilla]; if (!P) return false;
  aud = { id: SGSST.nuevoId('AUD'), nuevo: true, plantilla: sug.plantilla, tipoAuditoria: P.corto, titulo: P.corto + ' ' + anio(), fechaPlan: UI.hoy(), fechaEjecucion: '',
    estado: 'PROGRAMADA', auditor: { nombre: Sesion.nombre() || '', cargo: '', independiente: true }, equipo: '', alcance: 'Autoevaluación con la carpeta de evidencias del portal', objetivo: '', criterios: P.criterios, areas: '', copasst: { participo: false, nombre: '' },
    items: P.items.map((i)=> { const x = (sug.items || {})[i[0]] || {}; return { id: i[0], grupo: i[1], ref: i[2], valor: i[3], texto: i[4], r: x.r === 'C' ? 'C' : '', just: '', evid: String(x.evid || '').slice(0, 900), sev: 'ncMenor', hdesc: '' }; }),
    hallazgos: [], auditados: '', conclusiones: '', fortalezas: '', firmaAuditor: '', firmaAuditado: '', auditadoNombre: '', acciones: [] };
  pintarAud();
  UI.toast('Autoevaluación preparada con la carpeta de evidencias: revisa cada estándar y guarda.');
  return true;
}
cargar().then(()=>{ if (/[?&]sugerida=1/.test(location.search) && desdeEvidencias()) return; if (location.hash.length > 1 && !/^#ir=/.test(location.hash)) abrir(decodeURIComponent(location.hash.slice(1))); });
